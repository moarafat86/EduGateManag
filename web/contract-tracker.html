<style>
/* Layout: a contract ledger. Sticky header + tab rail, then one working surface per tab; tables scroll inside their own frame. */
:root {

  --focus: #2F8AA0;
  --danger: #A4262C;
  --danger-soft: #FBE7E8;

  --st-acc-bg: #DCF1E2; --st-acc-fg: #17643A; --st-acc: #2E8B57;
  --st-wait-bg: #DDEAF7; --st-wait-fg: #1F4E78; --st-wait: #3A73B0;

  --st-prog-bg: #FBF0CC; --st-prog-fg: #6F5600; --st-prog: #C9A21E;

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1618; --surface: #152024; --surface-2: #1A272B; --ink: #E3ECEB; --muted: #93A5A8;
    --line: #283A3E; --accent: #62B4C5; --accent-ink: #0E1618; --accent-soft: #1C343A; --focus: #8FD0DD;
    --danger: #F08A90; --danger-soft: #3A1E21;
    --st-acc-bg: #173527; --st-acc-fg: #8FDDAE; --st-acc: #4FB57C;

}

  --bg: #0E1618; --surface: #152024; --surface-2: #1A272B; --ink: #E3ECEB; --muted: #93A5A8;
  --line: #283A3E; --accent: #62B4C5; --accent-ink: #0E1618; --accent-soft: #1C343A; --focus: #8FD0DD;
  --danger: #F08A90; --danger-soft: #3A1E21;
  --st-acc-bg: #173527; --st-acc-fg: #8FDDAE; --st-acc: #4FB57C;
  --st-wait-bg: #182B40; --st-wait-fg: #A5C8EE; --st-wait: #5B93D1;
  --st-ret-bg: #3A2516; --st-ret-fg: #F4B788; --st-ret: #E08A48;

  --st-sus-bg: #273134; --st-sus-fg: #B7C2C4; --st-sus: #7D8A8D;

* { box-sizing: border-box; }
html { direction: rtl; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font-body); font-size: 14px; line-height: 1.6; }
.num, .date, .code { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; display: inline-block; }
.date { white-space: nowrap; }
.code { font-weight: 600; letter-spacing: .02em; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-inner { max-width: 1400px; margin: 0 auto; padding: 12px 16px 0; display: flex; flex-direction: column; gap: 10px; }
.title-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; justify-content: space-between; }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand h1 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 1.25rem; text-wrap: balance; }
.brand .meta { color: var(--muted); font-size: .82rem; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }

.tabs button:hover { color: var(--ink); }
.tabs .badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-inline-start: 4px; border-radius: 9px; background: var(--st-late-bg); color: var(--st-late-fg); font-size: .72rem; font-weight: 700; line-height: 18px; text-align: center; }

main { max-width: 1400px; margin: 0 auto; padding: 20px 16px 48px; display: flex; flex-direction: column; gap: 20px; }

/* buttons & inputs */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 6px 14px; border-radius: var(--radius); cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--danger); border-color: var(--danger); background: var(--surface); }
.btn.danger.solid { background: var(--danger); color: var(--surface); }
.btn:disabled { opacity: .55; cursor: progress; }
.btn.small { padding: 3px 10px; font-size: .85rem; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label, .field .label { font-size: .82rem; color: var(--muted); font-weight: 500; }
.field input, .field select, .field textarea, .filters input, .filters select {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 7px 10px; width: 100%; min-width: 0;
}
.field textarea { resize: vertical; min-height: 70px; }
.field .hint { font-size: .78rem; color: var(--muted); }
.check { display: flex; align-items: center; gap: 8px; font-weight: 500; cursor: pointer; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); }
.checks { display: flex; flex-wrap: wrap; gap: 6px 16px; max-height: 220px; overflow-y: auto; border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; }
.checks .check { font-weight: 400; font-size: .88rem; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.form-grid .wide { grid-column: 1 / -1; }
.form-group { grid-column: 1 / -1; font-weight: 600; font-size: .9rem; padding-top: 6px; border-top: 1px solid var(--line); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.seg button { background: var(--surface); border: 0; padding: 5px 14px; cursor: pointer; color: var(--muted); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

/* sections */
.section { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.section-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
.section-head h2 { margin: 0; font-family: var(--font-display); font-size: 1.05rem; font-weight: 600; }
.section-head .sub { color: var(--muted); font-size: .85rem; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 20px; }

/* KPI tiles */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
.kpi .label { color: var(--muted); font-size: .82rem; font-weight: 500; }
.kpi .value { font-family: var(--font-display); font-size: 1.55rem; font-weight: 600; line-height: 1.3; }
.kpi .foot { color: var(--muted); font-size: .8rem; }
.kpi.lead { background: var(--accent-soft); border-color: transparent; }
.kpi.lead .value { color: var(--accent); }

/* status */
.pill { display: inline-block; padding: 1px 10px; border-radius: 999px; font-size: .8rem; font-weight: 600; white-space: nowrap; }
.s-acc { background: var(--st-acc-bg); color: var(--st-acc-fg); }
.s-wait { background: var(--st-wait-bg); color: var(--st-wait-fg); }
.s-ret { background: var(--st-ret-bg); color: var(--st-ret-fg); }
.s-late { background: var(--st-late-bg); color: var(--st-late-fg); }
.s-prog { background: var(--st-prog-bg); color: var(--st-prog-fg); }
.s-sus { background: var(--st-sus-bg); color: var(--st-sus-fg); }
.s-new { background: var(--st-new-bg); color: var(--st-new-fg); }
.flag { display: inline-flex; align-items: center; gap: 4px; padding: 0 8px; border-radius: 999px; font-size: .76rem; font-weight: 700; white-space: nowrap; background: var(--st-late-bg); color: var(--st-late-fg); }
.flag.soft { background: var(--st-prog-bg); color: var(--st-prog-fg); }
.yes { color: var(--st-acc-fg); font-weight: 600; }
.no { color: var(--muted); }
.statusbar { display: flex; height: 18px; gap: 2px; border-radius: 4px; overflow: hidden; }
.statusbar span { display: block; height: 100%; min-width: 3px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; }
.legend .row { display: flex; align-items: center; gap: 6px; font-size: .88rem; }
.legend .sw { width: 10px; height: 10px; border-radius: 2px; }
.legend button { background: none; border: 0; padding: 0; cursor: pointer; display: flex; align-items: center; gap: 6px; }
.legend button:hover .lbl { text-decoration: underline; }

/* item progress */
.progress-list { display: flex; flex-direction: column; gap: 12px; }
.prog-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: baseline; }
.prog-row .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prog-row .name .code { color: var(--muted); margin-inline-end: 6px; }
.prog-row .pstat { color: var(--muted); font-size: .82rem; }
.bar { grid-column: 1 / -1; height: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; display: flex; }
.bar .acc { background: var(--st-acc); }
.bar .del { background: var(--st-wait); opacity: .45; }
.mini-bar { display: inline-flex; width: 70px; height: 6px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 3px; overflow: hidden; vertical-align: middle; margin-inline-start: 6px; }
.mini-bar span { background: var(--st-acc); }

/* tables */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .88rem; }
th, td { padding: 8px 10px; text-align: start; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: var(--surface-2); color: var(--muted); font-weight: 600; font-size: .8rem; white-space: nowrap; position: sticky; top: 0; }
td.n, th.n { text-align: end; }
td.c, th.c { text-align: center; }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:hover { background: var(--accent-soft); }
tfoot td { font-weight: 700; background: var(--surface-2); border-bottom: 0; }
td .desc { max-width: 380px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.red { color: var(--danger); font-weight: 700; }
.muted { color: var(--muted); }
.warn-cell { color: var(--danger); font-weight: 600; font-size: .82rem; }
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.filters input { width: auto; flex: 1 1 200px; }
.filters select { width: auto; flex: 0 1 190px; }
.count { color: var(--muted); font-size: .85rem; }

/* cards list (issues, crs) */
.cards { display: flex; flex-direction: column; gap: 10px; }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; background: var(--surface); }
.card.blocking { border-inline-start: 4px solid var(--st-late); }
.card.closed { opacity: .75; }
.card .head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.card .title { font-weight: 600; }
.card .meta { color: var(--muted); font-size: .8rem; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.card .body { white-space: pre-line; font-size: .9rem; }
.card .actions { margin-top: 2px; }
.card.clickable { cursor: pointer; }
.card.clickable:hover { border-color: var(--accent); }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgba(8, 20, 24, .45); z-index: 40; }
.drawer { position: fixed; inset-block: 0; inset-inline-start: 0; width: min(600px, 100%); background: var(--surface); z-index: 41; display: flex; flex-direction: column; border-inline-end: 1px solid var(--line); box-shadow: 0 0 40px rgba(0,0,0,.18); }
.drawer-head { display: flex; flex-direction: column; gap: 10px; padding: calc(14px + env(safe-area-inset-top, 0px)) 18px 0; border-bottom: 1px solid var(--line); }
.drawer-head .row1 { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.drawer-head h3 { margin: 0; font-family: var(--font-display); font-size: 1.05rem; font-weight: 600; min-width: 0; }
.drawer-head .tabs button { padding: 6px 10px 8px; }
.drawer-head.plain { padding-bottom: 14px; }
.drawer-body { padding: 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
.icon-btn { background: none; border: 1px solid var(--line); border-radius: var(--radius); width: 34px; height: 34px; cursor: pointer; font-size: 1.1rem; line-height: 1; flex: none; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 16px; }
.kv div { display: flex; flex-direction: column; min-width: 0; }
.kv .k { font-size: .78rem; color: var(--muted); }
.kv .v { font-weight: 600; overflow-wrap: anywhere; }
.confirm { border: 1px solid var(--danger); background: var(--danger-soft); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
h4 { margin: 0; font-size: .95rem; font-weight: 600; }
.block { display: flex; flex-direction: column; gap: 10px; }

/* timeline */
.timeline { display: flex; flex-direction: column; border-inline-start: 2px solid var(--line); margin-inline-start: 6px; }
.tl { position: relative; padding-block: 4px 14px; padding-inline-start: 18px; }
.tl::before { content: ""; position: absolute; inset-inline-start: -7px; top: 9px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--muted); }
.tl.sub::before { border-color: var(--st-wait); }

.tl .what { font-weight: 600; }
.tl .info { color: var(--muted); font-size: .82rem; }
.tl .del-ev { margin-inline-start: auto; }

/* report */
.report-controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.report-controls .field { flex: 0 1 180px; }
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 10px; }
.stat { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; }
.stat .k { color: var(--muted); font-size: .8rem; }
.stat .v { font-family: var(--font-display); font-size: 1.3rem; font-weight: 600; }
.copybox { width: 100%; min-height: 160px; border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; background: var(--surface-2); }

/* misc */
.empty { text-align: center; padding: 28px 16px; color: var(--muted); display: flex; flex-direction: column; gap: 10px; align-items: center; }
.empty strong { color: var(--ink); font-size: 1.02rem; }
.notice { background: var(--danger-soft); color: var(--danger); border-radius: 8px; padding: 12px 16px; font-weight: 500; }
.toast { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); inset-inline-end: 18px; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; z-index: 60; font-weight: 500; max-width: calc(100% - 36px); }
.toast.err { background: var(--danger); color: var(--surface); }
.hol-add { display: grid; grid-template-columns: 160px 1fr 140px auto; gap: 10px; align-items: end; }
@media (max-width: 640px) { .hol-add { grid-template-columns: 1fr 1fr; } .kpi .value { font-size: 1.3rem; } }
@media (prefers-reduced-motion: no-preference) { .drawer { animation: slide .18s ease-out; } @keyframes slide { from { transform: translateX(24px); opacity: .6; } to { transform: none; opacity: 1; } } }
</style>

  ["issues", "المشاكل والقرارات"], ["crs", "طلبات التغيير"], ["report", "التقرير الدوري"], ["settings", "الإعدادات"],
];

/* ------------------------------------------------------------ state */

/* ------------------------------------------------------------ utils */
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nf2 = new Intl.NumberFormat("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const nf0 = new Intl.NumberFormat("en-US", { maximumFractionDigits: 2 });
const money = (v) => `<span class="num">${Number.isFinite(v) && v !== 0 ? nf2.format(v) : "-"}</span>`;
const int = (v) => `<span class="num">${Number.isFinite(v) && v !== 0 ? nf0.format(v) : "-"}</span>`;
const pct = (v) => `<span class="num">${Number.isFinite(v) ? (v * 100).toFixed(1) + "%" : "-"}</span>`;
const dateHtml = (iso) => iso ? `<span class="date">${esc(iso)}</span>` : `<span class="muted">—</span>`;
const pill = (s, cls) => `<span class="pill s-${cls || STATUS_CLASS[s] || "new"}">${esc(s)}</span>`;
const ynHtml = (v) => v === "نعم" ? `<span class="yes">نعم</span>` : v === "لا" ? `<span class="no">لا</span>` : `<span class="muted">—</span>`;
const isIso = (s) => typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s);
const dn = (iso) => { if (!isIso(iso)) return NaN; const [y, m, d] = iso.split("-").map(Number); return Math.floor(Date.UTC(y, m - 1, d) / 864e5); };
const isoOf = (n) => new Date(n * 864e5).toISOString().slice(0, 10);
const todayIso = () => { const t = new Date(); return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, "0")}-${String(t.getDate()).padStart(2, "0")}`; };
const numOr = (v, d) => (v === "" || v === null || v === undefined || !Number.isFinite(Number(v))) ? d : Number(v);
const itemLabel = (it) => it ? String(it.no ?? "") : "";
const byItemOrder = (a, b) => (a.order ?? 0) - (b.order ?? 0) || String(a.no).localeCompare(String(b.no), "ar");
const byId = (a, b) => String(a.id).localeCompare(String(b.id), "en", { numeric: true });
const billingOf = (d) => d.billing || d.legacy_billing || {};
const short = (s, n = 70) => { s = String(s || ""); return s.length > n ? s.slice(0, n) + "…" : s; };

function toast(msg, isErr) {
  const root = document.getElementById("toastRoot");
  root.innerHTML = `<div class="toast${isErr ? " err" : ""}">${esc(msg)}</div>`;
  clearTimeout(toast.t);
  toast.t = setTimeout(() => { root.innerHTML = ""; }, isErr ? 6000 : 2600);
}
const errText = (e) => {
  const map = { quota_exceeded: "مساحة التخزين اتملت — احذف بيانات قديمة.", invalid_argument: "مفيش صلاحية حفظ أو البيانات غير صحيحة.", resource_exhausted: "طلبات كتير ورا بعض — استنى ثواني وجرّب تاني.", unavailable: "التخزين مش متاح دلوقتي — جرّب كمان شوية.", revoked: "صلاحية الوصول اتسحبت." };
  return map[e?.code] || e?.message || "حصل خطأ غير متوقع";
};

/* ------------------------------------------------------------ calculations
   Same rules as the Excel workbook:
   - every "تسليم" opens a review cycle; it closes at the first reply/acceptance on or after it, or the next submission
   - review days = working days from the day after submission to the cycle end (weekend + holidays excluded)
   - delay = review days above the review limit, per cycle                                                     */
function computeModel(data, asOfIso) {
  const s = data.settings;
  const asOf = dn(asOfIso);
  const weekend = new Set((Array.isArray(s.weekend) ? s.weekend : [5, 6]).map(Number));
  const hol = new Set((s.holidays || []).map((h) => dn(h.date)).filter(Number.isFinite));
  const reviewLimit = numOr(s.review_days, 10);
  const vat = numOr(s.vat, 0.15);
  const workdays = (a, b) => { if (!(b >= a)) return 0; let c = 0; for (let d = a; d <= b; d++) if (!weekend.has((d + 4) % 7) && !hol.has(d)) c++; return c; };
  const span = (a, b) => Math.max(0, workdays(a, b) - 1);

  const itemsById = new Map(data.items.map((i) => [i.id, i]));
  const delById = new Map(data.deliverables.map((d) => [d.id, d]));
  const evBy = new Map();
  for (const e of data.events) {
    const t = dn(e.date);
    if (!e.deliverable || !Number.isFinite(t) || !ACTIONS.includes(e.action)) continue;
    if (!evBy.has(e.deliverable)) evBy.set(e.deliverable, []);
    evBy.get(e.deliverable).push({ ...e, t });
  }

  const ev = new Map();
  for (const e of data.events) {
    const c = { cycle: null, end: null, open: false, review: null, delay: null, vendorDays: null, vendorOpen: false, warn: "" };
    const t = dn(e.date), list = evBy.get(e.deliverable) || [];
    if (!e.deliverable) c.warn = "رقم المخرج ناقص";
    else if (!delById.has(e.deliverable)) c.warn = "رقم مخرج غير موجود";
    else if (!ACTIONS.includes(e.action)) c.warn = "نوع الحركة ناقص";
    else if (!Number.isFinite(t)) c.warn = "التاريخ ناقص";
    else if (t > asOf) c.warn = "تاريخ بعد تاريخ الاحتساب";
    else if (e.action !== ACT.SUB && !list.some((x) => x.action === ACT.SUB && x.t <= t)) c.warn = "لا يوجد تسليم قبل الحركة دي";

    if (Number.isFinite(t) && e.deliverable) {
      if (e.action === ACT.SUB) {
        c.cycle = list.filter((x) => x.action === ACT.SUB && x.t < t).length + 1;
        const ends = [
          ...list.filter((x) => x.action !== ACT.SUB && x.t >= t).map((x) => x.t),
          ...list.filter((x) => x.action === ACT.SUB && x.t > t).map((x) => x.t),
        ];
        c.open = ends.length === 0;
        c.end = c.open ? asOf : Math.min(...ends);
        c.review = span(t, c.end);
        c.delay = Math.max(0, c.review - reviewLimit);
      } else if (e.action === ACT.REP) {
        // time on our side: from the reply until we resubmit
        const next = list.filter((x) => x.action === ACT.SUB && x.t >= t).map((x) => x.t);
        const accepted = list.some((x) => x.action === ACT.ACC && x.t >= t);
        if (next.length) c.vendorDays = span(t, Math.min(...next));
        else if (!accepted) { c.vendorDays = span(t, asOf); c.vendorOpen = true; }
      }
    }
    ev.set(e.id, c);
  }

  const issuesBy = new Map();
  for (const i of data.issues) { if (!issuesBy.has(i.deliverable)) issuesBy.set(i.deliverable, []); issuesBy.get(i.deliverable).push(i); }
  const crsByDel = new Map(), crsByItem = new Map();
  for (const cr of data.crs) {
    for (const id of cr.deliverables || []) { if (!crsByDel.has(id)) crsByDel.set(id, []); crsByDel.get(id).push(cr); }
    for (const id of cr.items || []) { if (!crsByItem.has(id)) crsByItem.set(id, []); crsByItem.get(id).push(cr); }
  }

  const del = new Map();
  for (const d of data.deliverables) {
    const list = evBy.get(d.id) || [];
    const pick = (a) => list.filter((x) => x.action === a).map((x) => x.t);
    const subs = pick(ACT.SUB), reps = pick(ACT.REP), accs = pick(ACT.ACC);
    const firstSubmit = subs.length ? Math.min(...subs) : 0;
    const lastSubmit = subs.length ? Math.max(...subs) : 0;
    const lastReply = reps.length ? Math.max(...reps) : 0;
    const accepted = accs.length ? Math.max(...accs) : 0;
    let status;
    if (accepted > 0) status = ST.ACC;
    else if (d.work_status === ST.SUS) status = ST.SUS;
    else if (lastReply > 0 && lastReply >= lastSubmit) status = ST.RET;
    else if (lastSubmit > 0) status = ST.WAIT;
    else status = WORK_STATUSES.includes(d.work_status) ? d.work_status : ST.NEW;

    let review = 0, delay = 0, vendorDays = 0, openCycle = null;
    for (const e of data.events) {
      if (e.deliverable !== d.id) continue;
      const c = ev.get(e.id);
      if (c.review !== null) { review += c.review; delay += c.delay; if (c.open) openCycle = { start: dn(e.date), review: c.review, delay: c.delay }; }
      if (c.vendorDays !== null) vendorDays += c.vendorDays;
    }
    const issues = issuesBy.get(d.id) || [];
    const openIssues = issues.filter((i) => i.status !== CLOSED);
    const item = itemsById.get(d.item_id);
    const value = item ? numOr(item.unit_price, 0) : 0;
    del.set(d.id, {
      firstSubmit, lastSubmit, lastReply, accepted, cycles: subs.length, status, review, delay, vendorDays, openCycle,
      value, valueVat: value * (1 + vat), openIssues: openIssues.length, blocking: openIssues.filter((i) => i.blocking).length,
      crs: crsByDel.get(d.id) || [], waitingSinceReply: status === ST.RET ? span(lastReply, asOf) : null,
    });
  }

  const items = new Map();
  const tot = { qty: 0, total: 0, vat: 0, totalVat: 0, registered: 0, delivered: 0, accepted: 0, late: 0, acceptedValue: 0, remaining: 0 };
  for (const it of data.items) {
    const ds = data.deliverables.filter((d) => d.item_id === it.id);
    const qty = numOr(it.qty, 0), price = numOr(it.unit_price, 0), total = qty * price;
    const r = {
      qty, price, total, vat: total * vat, totalVat: total * (1 + vat), registered: ds.length,
      delivered: ds.filter((d) => del.get(d.id).firstSubmit > 0).length,
      accepted: ds.filter((d) => del.get(d.id).status === ST.ACC).length,
      late: ds.filter((d) => del.get(d.id).status === ST.LATE).length,
      crs: crsByItem.get(it.id) || [],
    };
    r.progress = qty > 0 ? r.accepted / qty : null;
    r.acceptedValue = r.accepted * price;
    r.remaining = total - r.acceptedValue;
    items.set(it.id, r);
    for (const k of Object.keys(tot)) tot[k] += r[k] || 0;
  }
  tot.progress = tot.total > 0 ? tot.acceptedValue / tot.total : null;

  const statusCounts = Object.fromEntries(STATUS_ORDER.map((st) => [st, 0]));
  for (const d of data.deliverables) statusCounts[del.get(d.id).status]++;

  return { asOf, asOfIso, reviewLimit, vat, ev, del, items, tot, statusCounts, itemsById, delById, span };
}
const currentAsOf = () => isIso(state.settings.as_of_override) ? state.settings.as_of_override : todayIso();
function compute() { state.calc = computeModel(state, currentAsOf()); }

/* ------------------------------------------------------------ rendering */
function render() {
  compute();
  const s = state.settings, c = state.calc;
  document.getElementById("projTitle").textContent = s.project_name || "متابعة عقد البوابة الموحدة";
  document.getElementById("projCode").innerHTML = [s.contract_no && `<span class="code">${esc(s.contract_no)}</span>`, s.client && esc(s.client)].filter(Boolean).join(" · ");
  document.getElementById("asOfLabel").innerHTML = `محسوب حتى <span class="date">${esc(c.asOfIso)}</span>${isIso(s.as_of_override) ? " (تاريخ ثابت)" : ""}`;
  const blocking = state.issues.filter((i) => i.status !== CLOSED && i.blocking).length;
  const openCrs = state.crs.filter((x) => CR_OPEN.has(x.status)).length;
  document.getElementById("tabs").innerHTML = TABS.map(([k, label]) => {
    const badge = k === "issues" && blocking ? `<span class="badge num">${blocking}</span>` : k === "crs" && openCrs ? `<span class="badge num">${openCrs}</span>` : "";
    return `<button role="tab" data-tab="${k}" type="button" aria-selected="${k === state.tab}">${label}${badge}</button>`;
  }).join("");

  const view = document.getElementById("view");
  const loading = !Object.values(state.ready).every(Boolean) && !state.offline;
  let html = state.offline ? `<div class="notice">مش قادر أوصل لتخزين البيانات. افتح الصفحة من claude.ai وإنت مسجّل دخول عشان تشوف بيانات العقد وتعدّل فيها.</div>` : "";
  if (loading) html += `<div class="section"><div class="empty"><strong>جاري تحميل بيانات العقد…</strong></div></div>`;
  else html += ({ dashboard: viewDashboard, items: viewItems, deliverables: viewDeliverables, log: viewLog, issues: viewIssues, crs: viewCrs, report: viewReport, settings: viewSettings })[state.tab]();
  view.innerHTML = html;
  if (state.drawer) renderDrawer();
}
const emptyBlock = (title, text, btn) => `<div class="empty"><strong>${esc(title)}</strong>${text ? `<span>${esc(text)}</span>` : ""}${btn || ""}</div>`;
const delRow = (d, cells) => `<tr class="clickable" tabindex="0" data-open-del="${esc(d.id)}"><td><span class="code">${esc(d.id)}</span></td><td><div class="desc">${esc(d.description)}</div></td>${cells}</tr>`;

/* ---- issue & CR cards (shared) */
function issueCard(i, opts = {}) {
  const d = state.calc.delById.get(i.deliverable);
  const closed = i.status === CLOSED;
  return `<div class="card ${i.blocking && !closed ? "blocking" : ""} ${closed ? "closed" : ""} ${opts.clickable ? "clickable" : ""}" ${opts.clickable ? `data-open-del="${esc(i.deliverable)}" data-sub="issues"` : ""}>
    <div class="head">${pill(i.type || "مشكلة", i.type === "قرار" ? "wait" : "ret")}
      ${i.blocking && !closed ? `<span class="flag">واقف عليها الإجراء</span>` : ""}
      ${closed ? pill("مغلق", "acc") : ""}
      <span class="title">${esc(i.title)}</span></div>
    <div class="meta">${opts.showDel ? `<span><span class="code">${esc(i.deliverable)}</span> ${esc(short(d?.description, 50))}</span>` : ""}
      <span>من <span class="date">${esc(i.date || "")}</span></span>${i.owner ? `<span>على: ${esc(i.owner)}</span>` : ""}
      ${closed && i.closed_date ? `<span>اتقفلت <span class="date">${esc(i.closed_date)}</span></span>` : ""}</div>
    ${i.details ? `<div class="body">${esc(i.details)}</div>` : ""}
    ${closed && i.resolution ? `<div class="body"><strong>الحل/القرار:</strong> ${esc(i.resolution)}</div>` : ""}
    ${opts.actions ? `<div class="actions">${closed ? `<button class="btn small" type="button" data-reopen-issue="${esc(i.id)}">إعادة فتح</button>` : `<button class="btn small" type="button" data-close-issue="${esc(i.id)}">قفل</button>`}
      <button class="btn small" type="button" data-edit-issue="${esc(i.id)}">تعديل</button></div>` : ""}
  </div>`;
}
function crCard(cr) {
  const c = state.calc;
  const its = (cr.items || []).map((id) => c.itemsById.get(id)).filter(Boolean).map(itemLabel);
  return `<div class="card clickable" data-edit-cr="${esc(cr.id)}">
    <div class="head"><span class="code">${esc(cr.code)}</span>${pill(cr.status || "قيد الإعداد", CR_CLASS[cr.status])}<span class="title">${esc(cr.title)}</span></div>
    <div class="meta">${cr.date ? `<span>تاريخ الطلب <span class="date">${esc(cr.date)}</span></span>` : ""}

      ${Number.isFinite(cr.value_change) && cr.value_change ? `<span>الأثر المالي ${money(cr.value_change)}</span>` : ""}</div>

/* ---- dashboard */

  const legend = STATUS_ORDER.map((s) =>
    `<button type="button" class="row" data-filter-status="${esc(s)}"><span class="sw" style="background:var(--st-${STATUS_CLASS[s]})"></span><span class="lbl">${esc(s)}</span><strong class="num">${c.statusCounts[s] || 0}</strong></button>`).join("");
  const withK = state.deliverables.map((d) => ({ d, k: c.del.get(d.id) }));

  const returned = withK.filter((x) => x.k.status === ST.RET).sort((a, b) => b.k.waitingSinceReply - a.k.waitingSinceReply);
  const openIssues = state.issues.filter((i) => i.status !== CLOSED).sort((a, b) => (b.blocking ? 1 : 0) - (a.blocking ? 1 : 0) || String(a.date).localeCompare(String(b.date)));
  const openCrs = state.crs.filter((x) => CR_OPEN.has(x.status)).sort((a, b) => String(a.date).localeCompare(String(b.date)));
  const itemRows = [...state.items].sort(byItemOrder).map((it) => {
    const r = c.items.get(it.id);
    const accW = r.qty ? Math.min(100, (r.accepted / r.qty) * 100) : 0;

    return `<div class="prog-row" title="مقبول ${r.accepted} · مسلّم ${r.delivered} · الكمية ${r.qty}">

      <div class="bar"><span class="acc" style="width:${accW}%"></span><span class="del" style="width:${delW}%"></span></div></div>`;
  }).join("");

  return `
  <div class="kpis">
    <div class="kpi lead"><span class="label">الإنجاز المالي</span><span class="value">${pct(t.progress)}</span><span class="foot">قيمة المقبول ÷ قيمة العقد</span></div>
    <div class="kpi"><span class="label">قيمة العقد قبل الضريبة (ر.س)</span><span class="value">${money(t.total)}</span><span class="foot">شامل الضريبة ${money(t.totalVat)}</span></div>
    <div class="kpi"><span class="label">قيمة المقبول (ر.س)</span><span class="value">${money(t.acceptedValue)}</span><span class="foot"><span class="num">${t.accepted}</span> مخرج مقبول من <span class="num">${t.qty}</span></span></div>
    <div class="kpi"><span class="label">المتبقي (ر.س)</span><span class="value">${money(t.remaining)}</span><span class="foot"><span class="num">${t.delivered}</span> مخرج اتسلّم مرة على الأقل</span></div>
  </div>
  <section class="section">
    <div class="section-head"><h2>حالة المخرجات</h2><span class="sub"><span class="num">${state.deliverables.length}</span> مخرج — اضغط على أي حالة لعرض مخرجاتها</span></div>
    <div class="statusbar" role="img" aria-label="توزيع المخرجات حسب الحالة">${seg}</div>
    <div class="legend">${legend}</div>
  </section>
  <div class="grid-2">
    <section class="section">
      <div class="section-head"><h2>في انتظار رد العميل</h2><span class="sub">دورات مراجعة مفتوحة · المهلة <span class="num">${c.reviewLimit}</span> أيام عمل</span></div>
      ${open.length ? `<div class="table-wrap"><table><thead><tr><th>المخرج</th><th>الوصف</th><th>تاريخ التسليم</th><th class="n">أيام المراجعة</th><th class="n">التأخير</th></tr></thead><tbody>
        ${open.slice(0, 10).map((x) => delRow(x.d, `<td>${dateHtml(isoOf(x.k.openCycle.start))}</td><td class="n">${int(x.k.openCycle.review)}</td><td class="n ${x.k.openCycle.delay > 0 ? "red" : ""}">${int(x.k.openCycle.delay)}</td>`)).join("")}
        </tbody></table></div>${open.length > 10 ? `<button class="btn small" type="button" data-filter-status="${ST.WAIT}">عرض الكل (<span class="num">${open.length}</span>)</button>` : ""}`
        : emptyBlock("مفيش مخرجات مستنية رد", "كل التسليمات اتردّ عليها.")}
    </section>
    <section class="section">
      <div class="section-head"><h2>مشاكل وقرارات مفتوحة</h2><span class="sub">اللي واقف عليها الإجراء الأول</span></div>
      ${openIssues.length ? `<div class="cards">${openIssues.slice(0, 6).map((i) => issueCard(i, { clickable: true, showDel: true })).join("")}</div>
        ${openIssues.length > 6 ? `<button class="btn small" type="button" data-go="issues">عرض الكل (<span class="num">${openIssues.length}</span>)</button>` : ""}`
        : emptyBlock("مفيش مشاكل مفتوحة", "سجّل أي مشكلة أو قرار من صفحة المخرج.")}

/* ---- periodic report */
function reportRange() {
  const r = state.report, today = dn(todayIso()), wd = (today + 4) % 7; // 0 = Sunday
  const weekStart = today - wd;
  const t = new Date(); const y = t.getFullYear(), m = t.getMonth();
  const monthStart = dn(`${y}-${String(m + 1).padStart(2, "0")}-01`);
  const prevMonthStart = dn(m === 0 ? `${y - 1}-12-01` : `${y}-${String(m).padStart(2, "0")}-01`);
  const ranges = {
    this_week: [weekStart, today], last_week: [weekStart - 7, weekStart - 1],
    this_month: [monthStart, today], last_month: [prevMonthStart, monthStart - 1],
  };
  if (r.preset !== "custom") { const [a, b] = ranges[r.preset] || ranges.last_week; return [isoOf(a), isoOf(b)]; }
  return [isIso(r.from) ? r.from : isoOf(weekStart - 7), isIso(r.to) ? r.to : isoOf(today)];
}
function buildReport() {
  const [from, to] = reportRange();
  const a = dn(from), b = dn(to);
  const inRange = (iso) => { const t = dn(iso); return t >= a && t <= b; };
  const end = computeModel({ ...state, events: state.events.filter((e) => dn(e.date) <= b) }, to);
  const evIn = state.events.filter((e) => inRange(e.date) && end.delById.has(e.deliverable));
  const pickEv = (act) => evIn.filter((e) => e.action === act).sort((p, q) => String(p.date).localeCompare(String(q.date)))
    .map((e) => ({ e, d: end.delById.get(e.deliverable), k: end.del.get(e.deliverable), x: end.ev.get(e.id) }));
  const accepted = pickEv(ACT.ACC), submitted = pickEv(ACT.SUB), returned = pickEv(ACT.REP);
  const acceptedValue = accepted.reduce((s, x) => s + (x.k?.value || 0), 0);
  const openCycles = state.deliverables.map((d) => ({ d, k: end.del.get(d.id) })).filter((x) => x.k.openCycle && x.k.status !== ST.ACC).sort((p, q) => q.k.openCycle.review - p.k.openCycle.review);
  const overLimit = openCycles.filter((x) => x.k.openCycle.delay > 0);
  const issuesOpened = state.issues.filter((i) => inRange(i.date));
  const issuesClosed = state.issues.filter((i) => i.status === CLOSED && inRange(i.closed_date));
  const blockingOpen = state.issues.filter((i) => i.blocking && dn(i.date) <= b && (i.status !== CLOSED || dn(i.closed_date) > b));
  const crsTouched = state.crs.filter((x) => inRange(x.date) || inRange(x.decision_date));
  const crsOpen = state.crs.filter((x) => CR_OPEN.has(x.status));
  return { from, to, end, accepted, submitted, returned, acceptedValue, openCycles, overLimit, issuesOpened, issuesClosed, blockingOpen, crsTouched, crsOpen };
}

  return `<section class="section">

    <div class="section-head"><h2>الوضع في <span class="date">${esc(R.to)}</span></h2></div>
    <div class="stat-row">
      <div class="stat"><span class="k">الإنجاز المالي</span><span class="v">${pct(e.tot.progress)}</span></div>
      <div class="stat"><span class="k">مخرجات مقبولة</span><span class="v"><span class="num">${e.tot.accepted}</span> / <span class="num">${e.tot.qty}</span></span></div>
      <div class="stat"><span class="k">في انتظار رد العميل</span><span class="v num">${R.openCycles.length}</span></div>
      <div class="stat"><span class="k">عدّت المهلة</span><span class="v num ${R.overLimit.length ? "red" : ""}">${R.overLimit.length}</span></div>
      <div class="stat"><span class="k">مُعادة بملاحظات</span><span class="v num">${e.statusCounts[ST.RET]}</span></div>
      <div class="stat"><span class="k">واقف عليها الإجراء</span><span class="v num ${R.blockingOpen.length ? "red" : ""}">${R.blockingOpen.length}</span></div>
    </div>
  </section>
  <section class="section">
    <div class="section-head"><h2>حركة الفترة</h2><span class="sub"><span class="num">${R.submitted.length}</span> تسليم · <span class="num">${R.returned.length}</span> رد بملاحظات · <span class="num">${R.accepted.length}</span> قبول بقيمة ${money(R.acceptedValue)} ر.س</span></div>
    <div class="grid-2">
      <div class="block"><h4>المقبولة</h4>${tbl(R.accepted.map((x) => delRow(x.d, `<td>${dateHtml(x.e.date)}</td><td class="n">${int(x.k.review)}</td><td class="n ${x.k.delay ? "red" : ""}">${int(x.k.delay)}</td>`)), "<th>المخرج</th><th>الوصف</th><th>تاريخ القبول</th><th class='n'>أيام المراجعة</th><th class='n'>التأخير</th>", "مفيش قبول في الفترة دي.")}</div>
      <div class="block"><h4>المسلّمة</h4>${tbl(R.submitted.map((x) => delRow(x.d, `<td>${dateHtml(x.e.date)}</td><td class="n">${int(x.x?.cycle)}</td>`)), "<th>المخرج</th><th>الوصف</th><th>تاريخ التسليم</th><th class='n'>الدورة</th>", "مفيش تسليمات في الفترة دي.")}</div>
      <div class="block"><h4>المُعادة بملاحظات</h4>${tbl(R.returned.map((x) => delRow(x.d, `<td>${dateHtml(x.e.date)}</td>`)), "<th>المخرج</th><th>الوصف</th><th>تاريخ الرد</th>", "مفيش ردود بملاحظات في الفترة دي.")}</div>
      <div class="block"><h4>متأخرة في الرد عن المهلة</h4>${tbl(R.overLimit.map((x) => delRow(x.d, `<td>${dateHtml(isoOf(x.k.openCycle.start))}</td><td class="n">${int(x.k.openCycle.review)}</td><td class="n red">${int(x.k.openCycle.delay)}</td>`)), "<th>المخرج</th><th>الوصف</th><th>تاريخ التسليم</th><th class='n'>أيام المراجعة</th><th class='n'>التأخير</th>", "مفيش دورات عدّت المهلة.")}</div>
    </div>
  </section>
  <div class="grid-2">
    <section class="section"><div class="section-head"><h2>المشاكل والقرارات</h2><span class="sub">اتفتح <span class="num">${R.issuesOpened.length}</span> · اتقفل <span class="num">${R.issuesClosed.length}</span> · واقف عليها الإجراء <span class="num">${R.blockingOpen.length}</span></span></div>
      ${issuesAll.length ? `<div class="cards">${issuesAll.map((i) => issueCard(i, { clickable: true, showDel: true })).join("")}</div>` : emptyBlock("مفيش جديد", "")}
    </section>
    <section class="section"><div class="section-head"><h2>طلبات التغيير</h2><span class="sub">مفتوحة <span class="num">${R.crsOpen.length}</span></span></div>
      ${crsAll.length ? `<div class="cards">${crsAll.map(crCard).join("")}</div>` : emptyBlock("مفيش طلبات تغيير", "")}
    </section>
  </div>`;
}

/* ------------------------------------------------------------ drawer */
function openDrawer(d) { state.drawer = d; renderDrawer(); }
function closeDrawer() { state.drawer = null; const r = document.getElementById("drawerRoot"); r.innerHTML = ""; r.dataset.key = ""; }
function renderDrawer() {
  const d = state.drawer; if (!d) return;
  const body = ({ item: drawerItem, del: drawerDel, delForm: drawerDelForm, ev: drawerEv, issue: drawerIssue, cr: drawerCr })[d.kind]();
  if (body === null) { closeDrawer(); return; }
  const root = document.getElementById("drawerRoot");
  const key = d.kind + (d.id || "") + (d.sub || "");
  const scroll = root.dataset.key === key ? (root.querySelector(".drawer-body")?.scrollTop || 0) : 0;
  root.dataset.key = key;
  root.innerHTML = `<div class="scrim" data-close></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="${esc(body.title)}">
    <div class="drawer-head ${body.tabs ? "" : "plain"}"><div class="row1"><h3>${body.titleHtml || esc(body.title)}</h3><button class="icon-btn" type="button" data-close aria-label="إغلاق">×</button></div>${body.tabs || ""}</div>
    <div class="drawer-body">${body.html}</div></aside>`;
  root.querySelector(".drawer-body").scrollTop = scroll;
}
const confirmBlock = (text, action) => `<div class="confirm"><span>${esc(text)}</span><div class="actions"><button class="btn danger solid" type="button" data-confirm="${action}">تأكيد الحذف</button><button class="btn" type="button" data-cancel-confirm>إلغاء</button></div></div>`;
const itemOptions = (sel) => [...state.items].sort(byItemOrder).map((it) => `<option value="${esc(it.id)}"${sel === it.id ? " selected" : ""}>${esc(itemLabel(it))} — ${esc(short(it.name, 50))}</option>`).join("");
const delOptions = (sel) => [...state.deliverables].sort(byId).map((d) => `<option value="${esc(d.id)}"${sel === d.id ? " selected" : ""}>${esc(d.id)} — ${esc(short(d.description, 60))}</option>`).join("");

function drawerItem() {
  const d = state.drawer, it = d.id ? state.items.find((x) => x.id === d.id) : null;
  if (d.id && !it) return null;
  const linked = it ? state.deliverables.filter((x) => x.item_id === it.id).length : 0;
  const crs = it ? state.calc.items.get(it.id).crs : [];
  const v = it || {};
  return { title: it ? `تعديل البند ${itemLabel(it)}` : "بند جديد", html: `
    <form id="itemForm" class="form-grid" autocomplete="off">
      <div class="field"><label for="iNo">رقم البند</label><input id="iNo" name="no" required value="${esc(v.no ?? "")}" placeholder="مثال: 5.ج"></div>
      <div class="field"><label for="iWbs">WBS</label><input id="iWbs" name="wbs" value="${esc(v.wbs ?? "")}"></div>
      <div class="field wide"><label for="iName">اسم البند</label><input id="iName" name="name" required value="${esc(v.name ?? "")}"></div>
      <div class="field"><label for="iQty">الكمية التعاقدية</label><input id="iQty" name="qty" type="number" min="0" step="1" required value="${esc(v.qty ?? "")}"></div>
      <div class="field"><label for="iPrice">سعر الوحدة قبل الضريبة (ر.س)</label><input id="iPrice" name="unit_price" type="number" min="0" step="0.01" required value="${esc(v.unit_price ?? "")}"></div>
      <div class="field"><label for="iOrder">ترتيب العرض</label><input id="iOrder" name="order" type="number" step="1" value="${esc(v.order ?? state.items.length + 1)}"></div>
      <div class="actions wide"><button class="btn primary" type="submit">حفظ</button>${it ? `<button class="btn danger" type="button" data-ask-delete>حذف البند</button>` : ""}</div>
    </form>
    ${crs.length ? `<div class="block"><h4>طلبات التغيير على البند</h4><div class="cards">${crs.map(crCard).join("")}</div></div>` : ""}
    ${d.confirm ? (linked ? `<div class="notice">البند ده مربوط بيه <span class="num">${linked}</span> مخرج. انقل المخرجات لبند تاني أو احذفها الأول.</div>` : confirmBlock("هيتم حذف البند نهائياً.", "item")) : ""}` };
}

function drawerDel() {
  const d = state.drawer, del = state.deliverables.find((x) => x.id === d.id);
  if (!del) return null;
  const c = state.calc, k = c.del.get(del.id), it = c.itemsById.get(del.item_id), sub = d.sub || "review";
  const issues = state.issues.filter((i) => i.deliverable === del.id).sort((a, b) => (a.status === CLOSED ? 1 : 0) - (b.status === CLOSED ? 1 : 0) || String(b.date).localeCompare(String(a.date)));
  const tabs = `<nav class="tabs" role="tablist">${[["review", "المراجعات"], ["issues", `المشاكل والقرارات${k.openIssues ? ` (${k.openIssues})` : ""}`], ["billing", "الفوترة"]]
    .map(([v, l]) => `<button type="button" role="tab" data-sub-tab="${v}" aria-selected="${sub === v}">${l}</button>`).join("")}</nav>`;
  const head = `<div class="kv">
      <div><span class="k">البند</span><span class="v"><span class="code">${esc(itemLabel(it))}</span> ${esc(short(it?.name, 60) || "بند غير موجود")}</span></div>
      <div><span class="k">القيمة قبل الضريبة</span><span class="v">${money(k.value)}</span></div>
      <div><span class="k">حالة العمل (يدوي)</span><span class="v">${esc(del.work_status || "—")}</span></div>
    </div>
    <div><h4>وصف المخرج</h4><p style="margin:4px 0 0;white-space:pre-line">${esc(del.description)}</p></div>
    ${del.notes ? `<div><h4>ملاحظات</h4><p style="margin:4px 0 0;white-space:pre-line">${esc(del.notes)}</p></div>` : ""}
    ${k.crs.length ? `<div class="block"><h4>طلبات تغيير مرتبطة</h4><div class="cards">${k.crs.map(crCard).join("")}</div></div>` : ""}
    <div class="actions"><button class="btn" type="button" data-edit-del="${esc(del.id)}">تعديل بيانات المخرج</button></div>`;

  let html;
  if (sub === "issues") {
    const editing = d.editIssue ? state.issues.find((i) => i.id === d.editIssue) : null;
    html = `${issueForm(editing, del.id)}
      ${d.confirmIssue ? confirmBlock("هيتم حذف المشكلة/القرار نهائياً.", "issue:" + d.confirmIssue) : ""}
      <div class="block"><h4>السجل (<span class="num">${issues.length}</span>)</h4>
      ${issues.length ? `<div class="cards">${issues.map((i) => issueCard(i, { actions: true })).join("")}</div>` : `<span class="muted">مفيش مشاكل أو قرارات على المخرج ده.</span>`}</div>`;
  } else if (sub === "billing") {
    const b = billingOf(del);
    html = `<div class="kv">${BILLING.map((x) => `<div><span class="k">${x.label}</span><span class="v">${x.yn ? ynHtml(b[x.k]) : b[x.k] ? `<span class="code">${esc(b[x.k])}</span>` : '<span class="muted">—</span>'}</span></div>`).join("")}</div>
      <div class="actions"><button class="btn" type="button" data-edit-del="${esc(del.id)}">تعديل بيانات الفوترة</button></div>`;
  } else {
    const evs = state.events.filter((e) => e.deliverable === del.id).sort((a, b) => (dn(a.date) || 0) - (dn(b.date) || 0) || ACTIONS.indexOf(a.action) - ACTIONS.indexOf(b.action));
    const cls = { [ACT.SUB]: "sub", [ACT.REP]: "rep", [ACT.ACC]: "acc" };
    const tl = evs.map((e) => {
      const x = c.ev.get(e.id);
      let info = "";
      if (x.cycle !== null) info = `دورة <span class="num">${x.cycle}</span> عند العميل · ${x.open ? "لسه مفتوحة" : `انتهت <span class="date">${isoOf(x.end)}</span>`} · <span class="num">${x.review}</span> يوم عمل${x.delay ? ` · <span class="red">تأخير <span class="num">${x.delay}</span></span>` : ""}`;
      else if (x.vendorDays !== null) info = `عندنا <span class="num">${x.vendorDays}</span> يوم عمل${x.vendorOpen ? " لحد النهارده" : " لحد إعادة التسليم"}`;
      return `<div class="tl ${cls[e.action] || ""}"><div class="line1"><span class="what">${esc(e.action)}</span>${dateHtml(e.date)}
        <button class="btn small danger del-ev" type="button" data-del-ev="${esc(e.id)}" aria-label="حذف الحركة">حذف</button></div>
        ${info ? `<div class="info">${info}</div>` : ""}${x.warn ? `<div class="warn-cell">${esc(x.warn)}</div>` : ""}${e.notes ? `<div class="info">${esc(e.notes)}</div>` : ""}</div>`;
    }).join("");
    html = `<div class="kv">
        <div><span class="k">أول تسليم</span><span class="v">${dateHtml(k.firstSubmit ? isoOf(k.firstSubmit) : "")}</span></div>
        <div><span class="k">تاريخ القبول</span><span class="v">${dateHtml(k.accepted ? isoOf(k.accepted) : "")}</span></div>
        <div><span class="k">مرات التسليم</span><span class="v">${int(k.cycles)}</span></div>
        <div><span class="k">أيام المراجعة (عند العميل)</span><span class="v">${int(k.review)}</span></div>
        <div><span class="k">أيام التأخير على العميل</span><span class="v ${k.delay ? "red" : ""}">${int(k.delay)}</span></div>
        <div><span class="k">أيام عندنا (بعد الملاحظات)</span><span class="v">${int(k.vendorDays)}</span></div>
      </div>
      <div class="block"><h4>تسجيل حركة</h4>
        <form id="quickEv" class="form-grid" autocomplete="off">
          <div class="field"><label for="qAct">نوع الحركة</label><select id="qAct" name="action">${ACTIONS.map((a) => `<option>${esc(a)}</option>`).join("")}</select></div>
          <div class="field"><label for="qDate">التاريخ</label><input id="qDate" name="date" type="date" required value="${esc(todayIso())}"></div>
          <div class="field wide"><label for="qNotes">ملاحظات</label><input id="qNotes" name="notes"></div>
          <div class="actions wide"><button class="btn primary" type="submit">إضافة للسجل</button></div>
        </form></div>
      <div class="block"><h4>سجل المراجعات (<span class="num">${evs.length}</span>)</h4>
        ${d.confirmEv ? confirmBlock("هيتم حذف الحركة دي من السجل.", "ev:" + d.confirmEv) : ""}
        ${evs.length ? `<div class="timeline">${tl}</div>` : `<span class="muted">لسه مفيش حركات على المخرج ده.</span>`}</div>`;
  }
  return { title: del.id, titleHtml: `<span class="code">${esc(del.id)}</span> ${pill(k.status)} ${k.blocking ? `<span class="flag">واقف عليها الإجراء</span>` : ""}`, tabs, html: head + html };
}

function issueForm(i, deliverable) {

  return `<form id="issueForm" class="form-grid" autocomplete="off" data-issue-id="${esc(i?.id || "")}">
    <div class="form-group">${i ? "تعديل" : "إضافة مشكلة أو قرار"}</div>
    ${deliverable ? `<input type="hidden" name="deliverable" value="${esc(deliverable)}">` : `<div class="field wide"><label for="isDel">المخرج</label><select id="isDel" name="deliverable" required><option value="">اختر المخرج</option>${delOptions(v.deliverable)}</select></div>`}
    <div class="field"><label for="isType">النوع</label><select id="isType" name="type">${ISSUE_TYPES.map((t) => `<option${v.type === t ? " selected" : ""}>${t}</option>`).join("")}</select></div>
    <div class="field"><label for="isDate">التاريخ</label><input id="isDate" name="date" type="date" required value="${esc(v.date || "")}"></div>
    <div class="field"><label for="isOwner">على مين</label><select id="isOwner" name="owner"><option value="">—</option>${ISSUE_OWNERS.map((o) => `<option${v.owner === o ? " selected" : ""}>${o}</option>`).join("")}</select></div>
    <div class="field wide"><label for="isTitle">العنوان</label><input id="isTitle" name="title" required value="${esc(v.title || "")}" placeholder="مثال: العميل طلب تغيير نطاق المخرج"></div>
    <div class="field wide"><label for="isDetails">التفاصيل</label><textarea id="isDetails" name="details">${esc(v.details || "")}</textarea></div>

const formData = (form) => Object.fromEntries(new FormData(form).entries());
const clean = (o) => { const r = {}; for (const [k, v] of Object.entries(o)) if (v !== "" && v !== null && v !== undefined && !(typeof v === "number" && Number.isNaN(v))) r[k] = v; return r; };

async function saveDeliverable(form, btn) {
  const f = formData(form), editing = state.drawer.id;
  const id = editing || f.did.trim();
  if (!/^[A-Za-z0-9_.~:@+-]+$/.test(id)) { toast("رقم المخرج لازم يكون حروف إنجليزي وأرقام وشرطة بس.", true); return; }
  if (!editing && state.deliverables.some((x) => x.id === id)) { toast(`الرقم ${id} مستخدم قبل كده.`, true); return; }
  const prevB = editing ? billingOf(state.deliverables.find((x) => x.id === id) || {}) : {};
  const billing = {};
  for (const x of BILLING) {
    const v = (f["b_" + x.k] ?? "").trim();
    if (v) billing[x.k] = typeof prevB[x.k] === "number" && String(prevB[x.k]) === v ? prevB[x.k] : v;
  }
  const body = clean({ item_id: f.item_id, description: f.description.trim(), work_status: f.work_status, points: f.points === "" ? "" : Number(f.points), notes: f.notes.trim() });
  if (Object.keys(billing).length) body.billing = billing;
  const sub = state.drawer.sub;
  if (await run(btn, () => state.db.collection("deliverables").doc(id).set(body), "اتحفظ المخرج")) openDrawer({ kind: "del", id, sub: sub || "review" });
}

const FMT = { M: "#,##0.00", D: "yyyy-mm-dd", P: "0.0%" };
function addSheet(wb, name, cols, rows, opts = {}) {
  const ws = wb.addWorksheet(name, { views: [{ rightToLeft: true, state: "frozen", ySplit: 1 }] });
  ws.columns = cols.map((col) => ({ header: col.h, key: col.k, width: col.w || 14, style: { numFmt: col.f, font: { name: "Arial", size: 10 }, alignment: { vertical: "top", wrapText: !!col.wrap } } }));
  rows.forEach((r) => ws.addRow(r));
  const head = ws.getRow(1);
  head.font = { name: "Arial", bold: true, color: { argb: "FFFFFFFF" } };
  head.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FF1F5C6B" } };
  head.alignment = { vertical: "middle", horizontal: "center", wrapText: true };
  head.height = 32;
  if (cols.length) ws.autoFilter = { from: { row: 1, column: 1 }, to: { row: 1, column: cols.length } };
  if (opts.total) { const tr = ws.addRow(opts.total); tr.font = { name: "Arial", bold: true }; tr.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFD9E7EA" } }; }
  return ws;
}
function kvSheet(wb, name, rows) {

      { h: "رقم البند", k: "no", w: 10 }, { h: "WBS", k: "wbs", w: 19 }, { h: "اسم البند", k: "name", w: 44, wrap: true }, { h: "الكمية", k: "qty", w: 9 },
      { h: "سعر الوحدة", k: "price", w: 15, f: FMT.M }, { h: "الإجمالي قبل الضريبة", k: "total", w: 17, f: FMT.M }, { h: "الضريبة", k: "vat", w: 14, f: FMT.M },
      { h: "الإجمالي شامل الضريبة", k: "totalVat", w: 17, f: FMT.M }, { h: "المخرجات المسجلة", k: "registered", w: 10 }, { h: "المسلّمة", k: "delivered", w: 9 },
      { h: "المقبولة", k: "accepted", w: 9 }, { h: "نسبة الإنجاز", k: "progress", w: 10, f: FMT.P },
      { h: "قيمة المقبول", k: "acceptedValue", w: 17, f: FMT.M }, { h: "المتبقي", k: "remaining", w: 17, f: FMT.M }, { h: "طلبات التغيير", k: "crs", w: 16 },
    ], [...state.items].sort(byItemOrder).map((it) => { const r = c.items.get(it.id); return { no: it.no, wbs: it.wbs, name: it.name, ...r, crs: r.crs.map((x) => x.code).join("، ") }; }),
    { total: { name: "الإجمالي", qty: t.qty, total: t.total, vat: t.vat, totalVat: t.totalVat, registered: t.registered, delivered: t.delivered, accepted: t.accepted, progress: t.progress, acceptedValue: t.acceptedValue, remaining: t.remaining } });
    addSheet(wb, "المخرجات", [
      { h: "رقم المخرج", k: "id", w: 10 }, { h: "رقم البند", k: "item", w: 8 }, { h: "اسم البند", k: "itemName", w: 30, wrap: true }, { h: "وصف المخرج", k: "desc", w: 46, wrap: true },
      { h: "الحالة", k: "status", w: 15 }, { h: "حالة العمل (يدوي)", k: "work", w: 12 }, { h: "النقاط المنجزة", k: "points", w: 9 },
      { h: "القيمة قبل الضريبة", k: "value", w: 15, f: FMT.M }, { h: "القيمة شامل الضريبة", k: "valueVat", w: 15, f: FMT.M },
      { h: "أول تسليم", k: "first", w: 12, f: FMT.D }, { h: "آخر تسليم", k: "lastSub", w: 12, f: FMT.D }, { h: "آخر رد بملاحظات", k: "lastRep", w: 12, f: FMT.D },
      { h: "تاريخ القبول", k: "acc", w: 12, f: FMT.D }, { h: "مرات التسليم", k: "cycles", w: 9 }, { h: "أيام المراجعة", k: "review", w: 10 },
      { h: "أيام التأخير على العميل", k: "delay", w: 11 }, { h: "أيام عندنا", k: "vendor", w: 10 }, { h: "مشاكل مفتوحة", k: "issues", w: 9 }, { h: "طلبات التغيير", k: "crs", w: 14 },
      ...BILLING.map((x) => ({ h: x.label, k: "b_" + x.k, w: x.yn ? 10 : 16 })), { h: "ملاحظات", k: "notes", w: 50, wrap: true },
    ], [...state.deliverables].sort(byId).map((d) => { const k = c.del.get(d.id), it = c.itemsById.get(d.item_id), b = billingOf(d); return {
      id: d.id, item: it?.no, itemName: it?.name, desc: d.description, status: k.status, work: d.work_status, points: d.points === "" ? null : d.points,
      value: k.value, valueVat: k.valueVat, first: numD(k.firstSubmit), lastSub: numD(k.lastSubmit), lastRep: numD(k.lastReply), acc: numD(k.accepted),
      cycles: k.cycles, review: k.review, delay: k.delay, vendor: k.vendorDays, issues: k.openIssues, crs: k.crs.map((x) => x.code).join("، "),
      ...Object.fromEntries(BILLING.map((x) => ["b_" + x.k, b[x.k] ?? null])), notes: d.notes }; }));
    addSheet(wb, "سجل المراجعات", [
      { h: "رقم المخرج", k: "del", w: 10 }, { h: "رقم البند", k: "item", w: 8 }, { h: "وصف المخرج", k: "desc", w: 40, wrap: true }, { h: "نوع الحركة", k: "act", w: 13 },
      { h: "التاريخ", k: "date", w: 12, f: FMT.D }, { h: "ملاحظات", k: "notes", w: 34, wrap: true }, { h: "رقم الدورة", k: "cycle", w: 8 },
      { h: "نهاية الدورة", k: "end", w: 12, f: FMT.D }, { h: "حالة الدورة", k: "state", w: 9 }, { h: "أيام المراجعة", k: "review", w: 9 }, { h: "أيام التأخير", k: "delay", w: 9 },
      { h: "أيام عندنا", k: "vendor", w: 9 }, { h: "تنبيه", k: "warn", w: 22 },
    ], [...state.events].sort((a, b) => String(a.deliverable).localeCompare(String(b.deliverable), "en", { numeric: true }) || (dn(a.date) || 0) - (dn(b.date) || 0)).map((e) => {
      const k = c.ev.get(e.id), d = c.delById.get(e.deliverable), it = d && c.itemsById.get(d.item_id), sub = k.cycle !== null;
      return { del: e.deliverable, item: it?.no, desc: d?.description, act: e.action, date: toDate(e.date), notes: e.notes, cycle: sub ? k.cycle : null,
        end: sub ? numD(k.end) : null, state: sub ? (k.open ? "جارية" : "مغلقة") : null, review: sub ? k.review : null, delay: sub ? k.delay : null, vendor: k.vendorDays, warn: k.warn || null }; }));
    addSheet(wb, "المشاكل والقرارات", ISSUE_COLS, issuesSheetRows([...state.issues].sort((a, b) => String(a.date).localeCompare(String(b.date))), c));
    addSheet(wb, "طلبات التغيير", CR_COLS, crSheetRows([...state.crs].sort((a, b) => String(a.code).localeCompare(String(b.code), "en", { numeric: true })), c));
    addSheet(wb, "الأجازات", [{ h: "التاريخ", k: "date", w: 14, f: FMT.D }, { h: "المناسبة", k: "name", w: 30 }, { h: "ملاحظة", k: "note", w: 20 }],
      [...(s.holidays || [])].sort((a, b) => String(a.date).localeCompare(String(b.date))).map((h) => ({ date: toDate(h.date), name: h.name, note: h.note })));
    return [wb, `متابعة_عقد_البوابة_${c.asOfIso}.xlsx`];
  });
}

function exportReport(btn) {
  return withExcel(btn, async () => {
    const R = buildReport(), e = R.end, s = state.settings;
    const wb = new ExcelJS.Workbook();
    kvSheet(wb, "ملخص التقرير", [
      ["المشروع", s.project_name], ["رقم العقد", s.contract_no], ["من", toDate(R.from)], ["إلى", toDate(R.to)],
      ["الإنجاز المالي في نهاية الفترة", { v: e.tot.progress, f: FMT.P }], ["مخرجات مقبولة", `${e.tot.accepted} من ${e.tot.qty}`], ["قيمة المقبول", { v: e.tot.acceptedValue, f: FMT.M }],
      ["في انتظار رد العميل", R.openCycles.length], ["منهم عدّوا المهلة", R.overLimit.length], ["مُعادة بملاحظات", e.statusCounts[ST.RET]],
      ["تسليمات خلال الفترة", R.submitted.length], ["ردود بملاحظات خلال الفترة", R.returned.length], ["قبول خلال الفترة", R.accepted.length],
      ["قيمة المقبول خلال الفترة", { v: R.acceptedValue, f: FMT.M }], ["مشاكل اتفتحت", R.issuesOpened.length], ["مشاكل اتقفلت", R.issuesClosed.length],
      ["واقف عليها الإجراء", R.blockingOpen.length], ["طلبات تغيير مفتوحة", R.crsOpen.length],
    ]);
    const delCols = (extra) => [{ h: "رقم المخرج", k: "id", w: 10 }, { h: "رقم البند", k: "item", w: 8 }, { h: "وصف المخرج", k: "desc", w: 46, wrap: true }, ...extra];
    const base = (d) => ({ id: d.id, item: e.itemsById.get(d.item_id)?.no, desc: d.description });
    addSheet(wb, "المقبولة", delCols([{ h: "تاريخ القبول", k: "date", w: 12, f: FMT.D }, { h: "القيمة", k: "value", w: 15, f: FMT.M }, { h: "أيام المراجعة", k: "review", w: 10 }, { h: "أيام التأخير", k: "delay", w: 10 }]),
      R.accepted.map((x) => ({ ...base(x.d), date: toDate(x.e.date), value: x.k.value, review: x.k.review, delay: x.k.delay })));
    addSheet(wb, "المسلّمة", delCols([{ h: "تاريخ التسليم", k: "date", w: 12, f: FMT.D }, { h: "رقم الدورة", k: "cycle", w: 9 }]),
      R.submitted.map((x) => ({ ...base(x.d), date: toDate(x.e.date), cycle: x.x?.cycle })));
    addSheet(wb, "المُعادة بملاحظات", delCols([{ h: "تاريخ الرد", k: "date", w: 12, f: FMT.D }, { h: "ملاحظات", k: "notes", w: 34, wrap: true }]),
      R.returned.map((x) => ({ ...base(x.d), date: toDate(x.e.date), notes: x.e.notes })));
    addSheet(wb, "في انتظار الرد", delCols([{ h: "تاريخ التسليم", k: "date", w: 12, f: FMT.D }, { h: "أيام المراجعة", k: "review", w: 10 }, { h: "أيام التأخير", k: "delay", w: 10 }]),
      R.openCycles.map((x) => ({ ...base(x.d), date: numD(x.k.openCycle.start), review: x.k.openCycle.review, delay: x.k.openCycle.delay })));
    addSheet(wb, "المشاكل والقرارات", ISSUE_COLS, issuesSheetRows([...new Set([...R.blockingOpen, ...R.issuesOpened, ...R.issuesClosed])], e));
    addSheet(wb, "طلبات التغيير", CR_COLS, crSheetRows([...new Set([...R.crsOpen, ...R.crsTouched])], e));
    return [wb, `تقرير_متابعة_${R.from}_${R.to}.xlsx`];
  });
}

/* ------------------------------------------------------------ events */
function setTab(tab) {
  if (!TAB_KEYS.includes(tab)) tab = "dashboard";
  state.tab = tab;
  try { localStorage.setItem("tab", tab); } catch (_) {}
  if (location.hash !== "#" + tab) history.replaceState(null, "", "#" + tab);
  render();
  window.scrollTo(0, 0);
}

document.addEventListener("click", async (ev) => {
  if (ev.target.closest("input, select, textarea, label") && !ev.target.closest("button")) return;
  const t = ev.target.closest("button, tr, .card, [data-close]");
  if (!t) return;
  const ds = t.dataset;
  if (ds.tab) return setTab(ds.tab);
  if ("close" in ds) return closeDrawer();
  if (ds.go) return setTab(ds.go);
  if (ds.filterStatus) { state.filters = { q: "", item: "", status: ds.filterStatus, issue: "" }; return setTab("deliverables"); }
  if (ds.delview) { state.delView = ds.delview; return render(); }
  if ("newItem" in ds) return openDrawer({ kind: "item" });
  if (ds.editItem) return openDrawer({ kind: "item", id: ds.editItem });
  if ("newDel" in ds) return openDrawer({ kind: "delForm" });
  if (ds.editDel) return openDrawer({ kind: "delForm", id: ds.editDel, sub: state.drawer?.sub });
  if (ds.openDel) return openDrawer({ kind: "del", id: ds.openDel, sub: ds.sub || "review" });
  if (ds.subTab) { state.drawer.sub = ds.subTab; state.drawer.editIssue = null; return renderDrawer(); }
  if ("newEv" in ds) return openDrawer({ kind: "ev" });
  if ("newIssue" in ds) return openDrawer({ kind: "issue" });
  if (ds.editIssue) {
    if (state.drawer?.kind === "del") { state.drawer.editIssue = ds.editIssue; renderDrawer(); document.querySelector(".drawer-body").scrollTop = 0; return; }
    return openDrawer({ kind: "issue", id: ds.editIssue });
  }
  if ("cancelIssue" in ds) { if (state.drawer?.kind === "del") { state.drawer.editIssue = null; return renderDrawer(); } return closeDrawer(); }
  if (ds.closeIssue) return setIssueStatus(ds.closeIssue, true, t);
  if (ds.reopenIssue) return setIssueStatus(ds.reopenIssue, false, t);
  if (ds.askDelIssue) { state.drawer.confirmIssue = ds.askDelIssue; return renderDrawer(); }
  if ("newCr" in ds) return openDrawer({ kind: "cr" });
  if (ds.editCr) return openDrawer({ kind: "cr", id: ds.editCr });
  if ("askDelete" in ds) { state.drawer.confirm = true; return renderDrawer(); }
  if (ds.delEv) { state.drawer.confirmEv = ds.delEv; return renderDrawer(); }
  if ("cancelConfirm" in ds) { Object.assign(state.drawer, { confirm: false, confirmEv: null, confirmIssue: null }); return renderDrawer(); }
  if (ds.confirm) {
    const d = state.drawer;
    if (ds.confirm === "item") { if (await run(t, () => state.db.collection("items").doc(d.id).delete(), "اتحذف البند")) closeDrawer(); }
    else if (ds.confirm === "cr") { if (await run(t, () => state.db.collection("crs").doc(d.id).delete(), "اتحذف طلب التغيير")) closeDrawer(); }
    else if (ds.confirm === "del") {
      const evs = state.events.filter((e) => e.deliverable === d.id), iss = state.issues.filter((i) => i.deliverable === d.id);
      if (await run(t, async () => {
        for (const e of evs) await state.db.collection("events").doc(e.id).delete();
        for (const i of iss) await state.db.collection("issues").doc(i.id).delete();
        await state.db.collection("deliverables").doc(d.id).delete();
      }, "اتحذف المخرج")) closeDrawer();
    } else if (ds.confirm.startsWith("ev:")) {
      if (await run(t, () => state.db.collection("events").doc(ds.confirm.slice(3)).delete(), "اتحذفت الحركة")) { d.confirmEv = null; renderDrawer(); }
    } else if (ds.confirm.startsWith("issue:")) {
      if (await run(t, () => state.db.collection("issues").doc(ds.confirm.slice(6)).delete(), "اتحذفت")) { if (d.kind === "issue") closeDrawer(); else { d.confirmIssue = null; d.editIssue = null; renderDrawer(); } }
    }
    return;
  }
  if (ds.delHol !== undefined) {
    const i = Number(ds.delHol); const list = (state.settings.holidays || []).filter((_, j) => j !== i);
    return saveHolidays(list, t, "اتحذفت الإجازة");
  }
  if (t.id === "exportBtn") return exportAll(t);
  if (t.id === "reportExport") return exportReport(t);
  if (t.id === "reportCopy") {
    const text = reportText(buildReport());
    try { await navigator.clipboard.writeText(text); toast("اتنسخ التقرير — الصقه في الإيميل أو الرسالة"); }
    catch (_) {
      const box = document.getElementById("copyFallback");
      box.innerHTML = `<textarea class="copybox" readonly aria-label="نص التقرير">${esc(text)}</textarea>`;
      const ta = box.querySelector("textarea"); ta.focus(); ta.select();
      toast("مقدرتش أنسخ تلقائياً — النص متحدد، اضغط Ctrl+C");
    }
  }
});

document.addEventListener("submit", (ev) => {
  ev.preventDefault();
  const form = ev.target, btn = form.querySelector('button[type="submit"]');
  const fid = form.getAttribute("id"); // not form.id: a field named "id" would shadow it
  if (fid === "itemForm") return saveItem(form, btn);
  if (fid === "delForm") return saveDeliverable(form, btn);
  if (fid === "evForm") return addEvent(form, btn);
  if (fid === "quickEv") return addEvent(form, btn, state.drawer.id);
  if (fid === "issueForm") return saveIssue(form, btn);
  if (fid === "crForm") return saveCr(form, btn);
  if (fid === "settingsForm") return saveSettings(form, btn);
  if (fid === "holForm") {
    const date = form.querySelector("#hDate").value, name = form.querySelector("#hName").value.trim(), note = form.querySelector("#hNote").value.trim();
    if (!isIso(date) || !name) return toast("اكتب التاريخ والمناسبة.", true);
    if ((state.settings.holidays || []).some((h) => h.date === date)) return toast("التاريخ ده متسجل قبل كده.", true);
    return saveHolidays([...(state.settings.holidays || []), clean({ date, name, note })], btn, "اتضافت الإجازة");
  }
});

let inputTimer;
const SEARCH = { fQ: (v) => (state.filters.q = v), lQ: (v) => (state.logFilters.q = v), iQ: (v) => (state.issueFilters.q = v) };
document.addEventListener("input", (ev) => {
  const id = ev.target.id;
  if (!SEARCH[id]) return;
  clearTimeout(inputTimer);
  inputTimer = setTimeout(() => {
    SEARCH[id](ev.target.value);
    const pos = ev.target.selectionStart;
    render();
    const el = document.getElementById(id); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (_) {} }
  }, 200);
});
document.addEventListener("change", (ev) => {
  const el = ev.target, id = el.id;
  const set = { fItem: () => (state.filters.item = el.value), fStatus: () => (state.filters.status = el.value), fIssue: () => (state.filters.issue = el.value),
    lAction: () => (state.logFilters.action = el.value), iState: () => (state.issueFilters.state = el.value), iType: () => (state.issueFilters.type = el.value),
    rPreset: () => { const [a, b] = reportRange(); state.report.preset = el.value; if (el.value === "custom") { state.report.from = a; state.report.to = b; } },
    rFrom: () => { const [, b] = reportRange(); state.report = { preset: "custom", from: el.value, to: b }; },
    rTo: () => { const [a] = reportRange(); state.report = { preset: "custom", from: a, to: el.value }; } };
  if (set[id]) { set[id](); return render(); }
  if (el.name === "critem") {
    const form = el.form, items = [...form.querySelectorAll('input[name="critem"]:checked')].map((x) => x.value);
    const sel = [...form.querySelectorAll('input[name="crdel"]:checked')].map((x) => x.value);
    document.getElementById("crDels").innerHTML = crDelChecks(items, sel);
  }
});
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape" && state.drawer) closeDrawer();
  if (ev.key === "Enter" && ev.target.matches("tr.clickable")) ev.target.click();
});
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (TAB_KEYS.includes(h) && h !== state.tab) setTab(h); });

/* ------------------------------------------------------------ boot */
(function initTab() {
  let tab = location.hash.slice(1);
  if (!TAB_KEYS.includes(tab)) { try { tab = localStorage.getItem("tab") || ""; } catch (_) { tab = ""; } }
  state.tab = TAB_KEYS.includes(tab) ? tab : "dashboard";
})();
render();

let scheduled = false;
function scheduleRender() {
  if (scheduled) return; scheduled = true;
  requestAnimationFrame(() => {
    scheduled = false;
    // a snapshot arriving while the user types in the drawer must not wipe the form
    const active = document.activeElement;
    if (state.drawer && active && active.closest(".drawer") && active.matches("input, textarea, select")) { compute(); return; }
    render();
  });
}

async function boot() {
  const api = window.claude;
  if (!api || typeof api.use !== "function") { state.offline = true; render(); return; }
  const [db, downloads] = await Promise.all([api.use("db").catch(() => null), api.use("downloads").catch(() => null)]);
  state.downloads = downloads;
  if (!downloads) document.getElementById("exportBtn").hidden = true;
  if (!db) { state.offline = true; render(); return; }
  state.db = db;
  const onErr = (e) => { if (e?.code !== "unavailable") toast(errText(e), true); };
  db.doc("contract/settings").onSnapshot((snap) => {
    state.settings = { ...DEFAULT_SETTINGS, ...(snap.exists ? snap.data() : {}) };
    state.ready.settings = true; scheduleRender();
  }, onErr);
  for (const name of COLLECTIONS) db.collection(name).onSnapshot((snap) => {
    state[name] = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    state.ready[name] = true; scheduleRender();
  }, onErr);
}
boot();
})();
