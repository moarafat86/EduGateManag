<style>
/* Layout: a calm system app. Fixed sidebar navigation (bottom bar on phones), translucent top bar,
   one quiet surface per screen; the dashboard opens on concentric progress rings for the contract. */
:root {
  --bg: #F5F5F7;
  --surface: #FFFFFF;
  --surface-2: #F5F5F7;
  --surface-3: #E8E8ED;
  --glass: rgba(255, 255, 255, .72);
  --ink: #1D1D1F;
  --ink-2: #424245;
  --muted: #6E6E73;
  --line: rgba(0, 0, 0, .08);
  --line-strong: rgba(0, 0, 0, .14);
  --accent: #0071E3;
  --accent-ink: #FFFFFF;
  --accent-soft: rgba(0, 113, 227, .10);
  --focus: rgba(0, 113, 227, .45);
  --danger: #D70015;
  --danger-soft: rgba(255, 59, 48, .10);
  --actual: #AF52DE;
  --scrim: rgba(0, 0, 0, .28);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .04);
  --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 6px 20px rgba(0, 0, 0, .05);
  --shadow-lg: 0 24px 60px rgba(0, 0, 0, .18);

  --st-acc: #34C759;  --st-acc-bg: rgba(52, 199, 89, .14);   --st-acc-fg: #1E7A36;
  --st-wait: #007AFF; --st-wait-bg: rgba(0, 122, 255, .12);  --st-wait-fg: #0058B9;
  --st-ret: #FF9500;  --st-ret-bg: rgba(255, 149, 0, .14);   --st-ret-fg: #A35A00;
  --st-late: #FF3B30; --st-late-bg: rgba(255, 59, 48, .12);  --st-late-fg: #C4140A;
  --st-prog: #FFCC00; --st-prog-bg: rgba(255, 204, 0, .20);  --st-prog-fg: #7A5E00;
  --st-sus: #8E8E93;  --st-sus-bg: rgba(142, 142, 147, .16); --st-sus-fg: #48484A;
  --st-new: #C7C7CC;  --st-new-bg: rgba(142, 142, 147, .10); --st-new-fg: #6E6E73;

  --font: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --font-display: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --r-sm: 10px; --r: 14px; --r-lg: 20px; --r-xl: 26px;
  --side: 248px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --surface: #1C1C1E; --surface-2: #2C2C2E; --surface-3: #3A3A3C; --glass: rgba(28, 28, 30, .72);
    --ink: #F5F5F7; --ink-2: #D1D1D6; --muted: #98989D; --line: rgba(255, 255, 255, .09); --line-strong: rgba(255, 255, 255, .16);
    --accent: #0A84FF; --accent-ink: #FFFFFF; --accent-soft: rgba(10, 132, 255, .18); --focus: rgba(10, 132, 255, .55);
    --danger: #FF453A; --danger-soft: rgba(255, 69, 58, .16); --actual: #BF5AF2; --scrim: rgba(0, 0, 0, .55);
    --shadow-sm: none; --shadow: 0 0 0 1px rgba(255, 255, 255, .04); --shadow-lg: 0 24px 60px rgba(0, 0, 0, .6);
    --st-acc: #30D158;  --st-acc-bg: rgba(48, 209, 88, .18);   --st-acc-fg: #5DE07D;
    --st-wait: #0A84FF; --st-wait-bg: rgba(10, 132, 255, .20); --st-wait-fg: #64AFFF;
    --st-ret: #FF9F0A;  --st-ret-bg: rgba(255, 159, 10, .18);  --st-ret-fg: #FFB340;
    --st-late: #FF453A; --st-late-bg: rgba(255, 69, 58, .18);  --st-late-fg: #FF7066;
    --st-prog: #FFD60A; --st-prog-bg: rgba(255, 214, 10, .16); --st-prog-fg: #FFD60A;
    --st-sus: #98989D;  --st-sus-bg: rgba(152, 152, 157, .20); --st-sus-fg: #C7C7CC;
    --st-new: #48484A;  --st-new-bg: rgba(142, 142, 147, .14); --st-new-fg: #98989D;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --surface: #1C1C1E; --surface-2: #2C2C2E; --surface-3: #3A3A3C; --glass: rgba(28, 28, 30, .72);
  --ink: #F5F5F7; --ink-2: #D1D1D6; --muted: #98989D; --line: rgba(255, 255, 255, .09); --line-strong: rgba(255, 255, 255, .16);
  --accent: #0A84FF; --accent-ink: #FFFFFF; --accent-soft: rgba(10, 132, 255, .18); --focus: rgba(10, 132, 255, .55);
  --danger: #FF453A; --danger-soft: rgba(255, 69, 58, .16); --actual: #BF5AF2; --scrim: rgba(0, 0, 0, .55);
  --shadow-sm: none; --shadow: 0 0 0 1px rgba(255, 255, 255, .04); --shadow-lg: 0 24px 60px rgba(0, 0, 0, .6);
  --st-acc: #30D158;  --st-acc-bg: rgba(48, 209, 88, .18);   --st-acc-fg: #5DE07D;
  --st-wait: #0A84FF; --st-wait-bg: rgba(10, 132, 255, .20); --st-wait-fg: #64AFFF;
  --st-ret: #FF9F0A;  --st-ret-bg: rgba(255, 159, 10, .18);  --st-ret-fg: #FFB340;
  --st-late: #FF453A; --st-late-bg: rgba(255, 69, 58, .18);  --st-late-fg: #FF7066;
  --st-prog: #FFD60A; --st-prog-bg: rgba(255, 214, 10, .16); --st-prog-fg: #FFD60A;
  --st-sus: #98989D;  --st-sus-bg: rgba(152, 152, 157, .20); --st-sus-fg: #C7C7CC;
  --st-new: #48484A;  --st-new-bg: rgba(142, 142, 147, .14); --st-new-fg: #98989D;
  color-scheme: dark;
}

/* ---------- base */
* { box-sizing: border-box; }
html { direction: rtl; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font); font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; letter-spacing: -.003em; }
.num, .date, .code { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; display: inline-block; }
.date { white-space: nowrap; }
.code { font-weight: 600; letter-spacing: .01em; }
td .code { white-space: nowrap; }
.sar { width: .8em; height: .9em; vertical-align: -0.06em; margin-inline-end: .26em; fill: currentColor; flex: none; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 8px; }
::selection { background: var(--accent-soft); }

/* ---------- app shell */
.app { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: 100%; }
.sidebar { position: sticky; top: env(safe-area-inset-top, 0px); height: calc(100vh - env(safe-area-inset-top, 0px)); padding: 22px 14px; display: flex; flex-direction: column; gap: 22px; background: var(--glass); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-inline-end: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; padding-inline: 8px; }
.brand-mark { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(145deg, var(--accent), #5E5CE6); display: grid; place-items: center; color: #fff; flex: none; box-shadow: 0 4px 12px rgba(0, 113, 227, .3); }
.brand-mark svg { width: 19px; height: 19px; }
.brand-text { min-width: 0; display: flex; flex-direction: column; }
.brand-text strong { font-family: var(--font-display); font-size: .95rem; font-weight: 700; line-height: 1.3; }
.brand-text span { font-size: .74rem; color: var(--muted); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 11px; width: 100%; border: 0; background: none; padding: 9px 10px; border-radius: 10px; cursor: pointer; color: var(--ink-2); font-weight: 500; font-size: .92rem; text-align: start; transition: background .15s, color .15s; }
.nav button svg { width: 19px; height: 19px; flex: none; color: var(--muted); transition: color .15s; }
.nav button:hover { background: var(--surface-3); }
.nav button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.nav button[aria-selected="true"] svg { color: var(--accent-ink); }
.nav .lbl { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav .badge { min-width: 20px; padding: 0 6px; border-radius: 10px; background: var(--st-late); color: #fff; font-size: .72rem; font-weight: 700; line-height: 20px; text-align: center; }
.side-foot { margin-top: auto; padding: 12px 10px 0; border-top: 1px solid var(--line); font-size: .76rem; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }

.main-col { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--glass); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--line); }
.topbar-inner { max-width: 1320px; margin: 0 auto; padding: 14px 32px; display: flex; align-items: center; gap: 16px; justify-content: space-between; flex-wrap: wrap; }
.page-head { min-width: 0; display: flex; flex-direction: column; }
.page-head h1 { margin: 0; font-family: var(--font-display); font-size: 1.55rem; font-weight: 700; letter-spacing: -.02em; line-height: 1.25; }
.page-head .meta { color: var(--muted); font-size: .8rem; display: flex; flex-wrap: wrap; gap: 2px 12px; }
.page-head .meta > span:empty { display: none; }
.top-actions { display: flex; gap: 8px; align-items: center; }

.theme-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0 10px; color: var(--ink-2); font-size: .85rem; font-weight: 500; }
.theme-row .lbl { display: flex; align-items: center; gap: 8px; }
.theme-row svg { width: 17px; height: 17px; color: var(--muted); }
.switch { position: relative; width: 44px; height: 26px; border-radius: 13px; border: 0; background: var(--surface-3); cursor: pointer; flex: none; transition: background .2s; padding: 0; }
.switch .knob { position: absolute; top: 3px; inset-inline-start: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: inset-inline-start .2s; }
.switch[aria-checked="true"] { background: var(--st-acc); }
.switch[aria-checked="true"] .knob { inset-inline-start: 21px; }
.theme-m { display: none; }
.theme-m svg { width: 17px; height: 17px; }
main { max-width: 1320px; width: 100%; margin: 0 auto; padding: 26px 32px 64px; display: flex; flex-direction: column; gap: 22px; }

/* ---------- buttons & inputs */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; background: var(--surface-3); color: var(--ink); padding: 7px 16px; border-radius: 980px; cursor: pointer; font-weight: 500; font-size: .9rem; transition: transform .1s, filter .15s, background .15s; white-space: nowrap; }
.btn:hover { filter: brightness(.97); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { background: var(--danger-soft); color: var(--danger); }
.btn.danger.solid { background: var(--danger); color: #fff; }
.btn:disabled { opacity: .5; cursor: progress; transform: none; }
.btn.small { padding: 4px 12px; font-size: .82rem; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label, .field .label { font-size: .8rem; color: var(--muted); font-weight: 500; }
.field input, .field select, .field textarea, .filters input, .filters select {
  background: var(--surface-2); border: 1px solid transparent; border-radius: var(--r-sm); padding: 9px 12px; width: 100%; min-width: 0; transition: border-color .15s, background .15s, box-shadow .15s;
}
.field input:focus, .field select:focus, .field textarea:focus, .filters input:focus, .filters select:focus { outline: none; background: var(--surface); border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.field input[readonly] { color: var(--muted); }
.field textarea { resize: vertical; min-height: 80px; }
.field .hint { font-size: .76rem; color: var(--muted); }
.check { display: flex; align-items: center; gap: 9px; font-weight: 500; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
.checks { display: flex; flex-wrap: wrap; gap: 8px 18px; max-height: 240px; overflow-y: auto; background: var(--surface-2); border-radius: var(--r-sm); padding: 10px 12px; }
.checks .check { font-weight: 400; font-size: .88rem; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; }
.form-grid .wide { grid-column: 1 / -1; }
.form-group { grid-column: 1 / -1; font-weight: 600; font-size: .95rem; padding-top: 10px; border-top: 1px solid var(--line); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; padding: 2px; border-radius: 10px; background: var(--surface-3); }
.seg button { background: none; border: 0; padding: 5px 16px; border-radius: 8px; cursor: pointer; color: var(--ink-2); font-weight: 500; font-size: .86rem; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }

/* ---------- surfaces */
.section { background: var(--surface); border-radius: var(--r-lg); padding: 22px 24px; display: flex; flex-direction: column; gap: 16px; min-width: 0; box-shadow: var(--shadow); }
.section-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
.section-head h2 { margin: 0; font-family: var(--font-display); font-size: 1.12rem; font-weight: 700; letter-spacing: -.01em; }
.section-head .sub { color: var(--muted); font-size: .84rem; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 470px), 1fr)); gap: 22px; }

/* ---------- hero rings */
.hero { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 34px; align-items: center; padding: 30px 34px; border-radius: var(--r-xl); background: var(--surface); box-shadow: var(--shadow); }
.rings { width: 236px; height: 236px; max-width: 100%; }
.rings circle { fill: none; stroke-linecap: round; }
.rings .arc { transition: stroke-dashoffset 1.1s cubic-bezier(.2, .8, .2, 1); }
.hero-body { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.eyebrow { font-size: .78rem; font-weight: 600; color: var(--muted); letter-spacing: .04em; }
.hero-title { margin: 0; font-family: var(--font-display); font-size: clamp(1.6rem, 2.6vw, 2.25rem); font-weight: 700; letter-spacing: -.025em; line-height: 1.2; text-wrap: balance; }
.hero-title .num { color: var(--st-acc-fg); }
.hero-sub { color: var(--muted); font-size: .92rem; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.ring-legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.ring-item { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: var(--r); background: var(--surface-2); }
.ring-item .k { display: flex; align-items: center; gap: 7px; font-size: .8rem; color: var(--muted); font-weight: 500; }
.ring-item .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.ring-item .v { font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; letter-spacing: -.02em; line-height: 1.25; }
.ring-item .f { font-size: .76rem; color: var(--muted); }

/* ---------- KPI tiles */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); gap: 16px; }
.kpi { background: var(--surface); border-radius: var(--r-lg); padding: 18px 20px; display: flex; flex-direction: column; gap: 4px; min-width: 0; box-shadow: var(--shadow); }
.kpi .label { color: var(--muted); font-size: .8rem; font-weight: 500; }
.kpi .value { font-family: var(--font-display); font-size: 1.55rem; font-weight: 700; letter-spacing: -.02em; line-height: 1.3; display: flex; align-items: baseline; flex-wrap: wrap; gap: 0 10px; }
.kpi .value .amt { font-size: .6em; color: var(--muted); font-weight: 500; letter-spacing: 0; }
.kpi .foot { color: var(--muted); font-size: .78rem; }
.kpi .meter { height: 5px; border-radius: 3px; background: var(--surface-3); overflow: hidden; margin-top: 8px; }
.kpi .meter span { display: block; height: 100%; border-radius: 3px; }
.kpi.wait .value { color: var(--st-wait-fg); }
.kpi.acc .value { color: var(--st-acc-fg); }

/* ---------- status */
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 10px; border-radius: 980px; font-size: .78rem; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .85; }
.s-acc { background: var(--st-acc-bg); color: var(--st-acc-fg); }
.s-wait { background: var(--st-wait-bg); color: var(--st-wait-fg); }
.s-ret { background: var(--st-ret-bg); color: var(--st-ret-fg); }
.s-late { background: var(--st-late-bg); color: var(--st-late-fg); }
.s-prog { background: var(--st-prog-bg); color: var(--st-prog-fg); }
.s-sus { background: var(--st-sus-bg); color: var(--st-sus-fg); }
.s-new { background: var(--st-new-bg); color: var(--st-new-fg); }
.flag { display: inline-flex; align-items: center; gap: 4px; padding: 1px 9px; border-radius: 980px; font-size: .74rem; font-weight: 600; white-space: nowrap; background: var(--st-late-bg); color: var(--st-late-fg); }
.flag.soft { background: var(--st-prog-bg); color: var(--st-prog-fg); }
.yes { color: var(--st-acc-fg); font-weight: 600; }
.no { color: var(--muted); }

/* ---------- donut */
.donut-wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 22px 30px; }
.donut { width: 210px; height: 210px; flex: none; max-width: 100%; }
.donut path { cursor: pointer; transition: opacity .15s; }
.donut path:hover { opacity: .8; }
.donut .total { font-family: var(--font-display); font-size: 34px; font-weight: 700; fill: var(--ink); letter-spacing: -.02em; }
.donut .total-lbl { font-size: 12px; fill: var(--muted); }
.legend { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 200px; }
.legend button { background: none; border: 0; padding: 7px 8px; border-radius: 9px; cursor: pointer; display: grid; grid-template-columns: 10px 1fr auto auto; gap: 10px; align-items: center; text-align: start; font-size: .9rem; }
.legend button:hover { background: var(--surface-2); }
.legend .sw { width: 10px; height: 10px; border-radius: 50%; }
.legend .share { color: var(--muted); font-size: .8rem; min-width: 46px; text-align: end; }

/* ---------- bars */
.mini-bar { display: inline-flex; width: 64px; height: 5px; background: var(--surface-3); border-radius: 3px; overflow: hidden; vertical-align: middle; margin-inline-start: 8px; }
.mini-bar span { display: block; height: 100%; background: var(--st-acc); border-radius: 3px; }
.mini-bar.del span { background: var(--st-wait); }
.mini-bar.act span { background: var(--actual); }

/* ---------- tables */
.table-wrap { overflow-x: auto; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }
table { border-collapse: collapse; width: 100%; font-size: .87rem; }
th, td { padding: 11px 14px; text-align: start; border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
th { background: var(--surface); color: var(--muted); font-weight: 600; font-size: .76rem; white-space: nowrap; position: sticky; top: 0; z-index: 1; border-bottom: 1px solid var(--line-strong); }
td.n, th.n { text-align: end; white-space: nowrap; }
td.c, th.c { text-align: center; }
tbody tr { transition: background .12s; }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:hover { background: var(--surface-2); }
tfoot td { font-weight: 700; background: var(--surface-2); border-bottom: 0; border-top: 1px solid var(--line-strong); }
td .desc { max-width: 440px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.red { color: var(--danger); font-weight: 700; }
.muted { color: var(--muted); }
.warn-cell { color: var(--danger); font-weight: 600; font-size: .8rem; }
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.filters input { width: auto; flex: 1 1 220px; }
.filters select { width: auto; flex: 0 1 200px; }
.count { color: var(--muted); font-size: .84rem; }

/* ---------- cards (issues, change requests) */
.cards { display: flex; flex-direction: column; gap: 10px; }
.card { border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; background: var(--surface-2); }
.card.blocking { box-shadow: inset 0 0 0 1.5px var(--st-late); background: var(--st-late-bg); }
.card.closed { opacity: .7; }
.card .head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.card .title { font-weight: 600; }
.card .meta { color: var(--muted); font-size: .79rem; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.card .body { white-space: pre-line; font-size: .9rem; color: var(--ink-2); }
.card.clickable { cursor: pointer; transition: transform .15s, box-shadow .15s; }
.card.clickable:hover { transform: translateY(-1px); box-shadow: var(--shadow); }

/* ---------- sheet (drawer) */

/* ------------------------------------------------------------ calculations
   Same rules as the Excel workbook:
   - every "تسليم" opens a review cycle; it closes at the first reply/acceptance on or after it, or the next submission
   - review days = working days from the day after submission to the cycle end (weekend + holidays excluded)
   - delay = review days above the review limit, per cycle                                                     */
function computeModel(data, asOfIso) {
  const s = data.settings;
  const asOf = dn(asOfIso);
  const weekend = new Set((Array.isArray(s.weekend) ? s.weekend : [5, 6]).map(Number));

  const reviewLimit = numOr(s.review_days, 10);

  const workdays = (a, b) => { if (!(b >= a)) return 0; let c = 0; for (let d = a; d <= b; d++) if (!weekend.has((d + 4) % 7) && !hol.has(d)) c++; return c; };
  const span = (a, b) => Math.max(0, workdays(a, b) - 1);

  const itemsById = new Map(data.items.map((i) => [i.id, i]));
  const delById = new Map(data.deliverables.map((d) => [d.id, d]));
  // a suspended deliverable (manual "معلق", never accepted) is left out of every delivery/acceptance figure
  const acceptedIds = new Set(data.events.filter((e) => e.action === ACT.ACC && isIso(e.date)).map((e) => e.deliverable));
  // a deliverable cancelled by an applied change request is left out of everything except its own record
  const cancelledIds = new Set(data.deliverables.filter((d) => d.cancelled).map((d) => d.id));
  const suspendedIds = new Set(data.deliverables.filter((d) => d.work_status === ST.SUS && !acceptedIds.has(d.id) && !d.cancelled).map((d) => d.id));
  const evBy = new Map();
  for (const e of data.events) {
    const t = dn(e.date);
    if (!e.deliverable || !Number.isFinite(t) || !ACTIONS.includes(e.action)) continue;
    if (!evBy.has(e.deliverable)) evBy.set(e.deliverable, []);
    evBy.get(e.deliverable).push({ ...e, t });
  }

  const ev = new Map();
  for (const e of data.events) {
    const c = { cycle: null, end: null, open: false, review: null, delay: null, vendorDays: null, vendorOpen: false, warn: "", excluded: suspendedIds.has(e.deliverable) || cancelledIds.has(e.deliverable) };
    const t = dn(e.date), list = evBy.get(e.deliverable) || [];
    if (!e.deliverable) c.warn = "رقم المخرج ناقص";
    else if (!delById.has(e.deliverable)) c.warn = "رقم المخرج غير موجود";
    else if (!ACTIONS.includes(e.action)) c.warn = "نوع الحركة ناقص";
    else if (!Number.isFinite(t)) c.warn = "التاريخ ناقص";
    else if (t > asOf) c.warn = "التاريخ بعد تاريخ الاحتساب";
    else if (e.action !== ACT.SUB && !list.some((x) => x.action === ACT.SUB && x.t <= t)) c.warn = "لا يوجد تسليم سابق لهذه الحركة";

    if (Number.isFinite(t) && e.deliverable) {
      if (e.action === ACT.SUB) {
        c.cycle = list.filter((x) => x.action === ACT.SUB && x.t < t).length + 1;
        const ends = [
          ...list.filter((x) => x.action !== ACT.SUB && x.t >= t).map((x) => x.t),
          ...list.filter((x) => x.action === ACT.SUB && x.t > t).map((x) => x.t),
        ];
        c.open = ends.length === 0;
        c.end = c.open ? asOf : Math.min(...ends);
        c.review = span(t, c.end);
        c.delay = Math.max(0, c.review - reviewLimit);
      } else if (e.action === ACT.REP) {
        // time on the project team's side: from the reply until the resubmission
        const next = list.filter((x) => x.action === ACT.SUB && x.t >= t).map((x) => x.t);
        const accepted = list.some((x) => x.action === ACT.ACC && x.t >= t);
        if (next.length) c.vendorDays = span(t, Math.min(...next));
        else if (!accepted) { c.vendorDays = span(t, asOf); c.vendorOpen = true; }
      }
    }
    ev.set(e.id, c);
  }

  const issuesBy = new Map();
  for (const i of data.issues) { if (!issuesBy.has(i.deliverable)) issuesBy.set(i.deliverable, []); issuesBy.get(i.deliverable).push(i); }
  const crsByDel = new Map(), crsByItem = new Map();
  for (const cr of data.crs) {
    for (const id of cr.deliverables || []) { if (!crsByDel.has(id)) crsByDel.set(id, []); crsByDel.get(id).push(cr); }
    for (const id of cr.items || []) { if (!crsByItem.has(id)) crsByItem.set(id, []); crsByItem.get(id).push(cr); }
  }

  const del = new Map();
  for (const d of data.deliverables) {
    const list = evBy.get(d.id) || [];
    const pick = (a) => list.filter((x) => x.action === a).map((x) => x.t);
    const subs = pick(ACT.SUB), reps = pick(ACT.REP), accs = pick(ACT.ACC);
    const firstSubmit = subs.length ? Math.min(...subs) : 0;
    const lastSubmit = subs.length ? Math.max(...subs) : 0;
    const lastReply = reps.length ? Math.max(...reps) : 0;
    const accepted = accs.length ? Math.max(...accs) : 0;
    let status;
    if (accepted > 0) status = ST.ACC;
    else if (d.work_status === ST.SUS) status = ST.SUS;
    else if (lastReply > 0 && lastReply >= lastSubmit) status = ST.RET;
    else if (lastSubmit > 0) status = ST.WAIT;
    else status = WORK_STATUSES.includes(d.work_status) ? d.work_status : ST.NEW;
    const cancelled = cancelledIds.has(d.id);
    if (cancelled) status = ST.CAN;

    const suspended = suspendedIds.has(d.id);
    let review = 0, delay = 0, vendorDays = 0, openCycle = null;
    for (const e of data.events) {
      if (e.deliverable !== d.id || suspended || cancelled) continue;
      const c = ev.get(e.id);
      if (c.review !== null) { review += c.review; delay += c.delay; if (c.open) openCycle = { start: dn(e.date), review: c.review, delay: c.delay }; }
      if (c.vendorDays !== null) vendorDays += c.vendorDays;
    }
    const issues = issuesBy.get(d.id) || [];
    const openIssues = issues.filter((i) => i.status !== CLOSED);
    const item = itemsById.get(d.item_id);
    const value = item ? numOr(item.unit_price, 0) : 0;
    const crs = [...(crsByDel.get(d.id) || [])];
    const suspendCr = d.suspend_cr ? data.crs.find((x) => x.id === d.suspend_cr) : null;
    if (suspendCr && !crs.includes(suspendCr)) crs.push(suspendCr);
    del.set(d.id, {
      firstSubmit, lastSubmit, lastReply, accepted, cycles: subs.length, status, review, delay, vendorDays, openCycle,
      value, valueVat: value * (1 + vat), openIssues: openIssues.length, blocking: openIssues.filter((i) => i.blocking).length,
      crs, suspended, cancelled, suspendCr, suspendMissing: suspended && !String(d.suspend_reason || "").trim(),
      waitingSinceReply: status === ST.RET ? span(lastReply, asOf) : null,
    });
  }

  const items = new Map();
  const tot = { qty: 0, total: 0, vat: 0, totalVat: 0, registered: 0, delivered: 0, accepted: 0, waiting: 0, late: 0, suspended: 0, acceptedValue: 0, deliveredValue: 0, waitingValue: 0, suspendedValue: 0, remaining: 0, actualWeighted: 0 };
  for (const it of data.items) {
    const ds = data.deliverables.filter((d) => d.item_id === it.id && !d.cancelled);
    const qty = numOr(it.qty, 0), price = numOr(it.unit_price, 0), total = qty * price;
    const k = (d) => del.get(d.id);
    const r = {
      qty, price, total, vat: total * vat, totalVat: total * (1 + vat), registered: ds.length,
      delivered: ds.filter((d) => k(d).firstSubmit > 0 && !k(d).suspended).length,
      suspended: ds.filter((d) => k(d).suspended).length,
      accepted: ds.filter((d) => k(d).status === ST.ACC).length,
      waiting: ds.filter((d) => k(d).status === ST.WAIT).length,
      late: ds.filter((d) => k(d).status === ST.LATE).length,
      actual: it.actual_progress === undefined || it.actual_progress === null || it.actual_progress === "" ? null : numOr(it.actual_progress, null),
      crs: crsByItem.get(it.id) || [],
    };
    r.progress = qty > 0 ? r.accepted / qty : null;
    r.deliveredPct = qty > 0 ? r.delivered / qty : null;
    r.acceptedValue = r.accepted * price;
    r.deliveredValue = r.delivered * price;
    r.waitingValue = r.waiting * price;
    r.suspendedValue = r.suspended * price;
    r.remaining = total - r.acceptedValue;
    r.actualWeighted = (r.actual || 0) * total;
    items.set(it.id, r);
    for (const key of Object.keys(tot)) tot[key] += r[key] || 0;
  }
  tot.acceptedShare = tot.total > 0 ? tot.acceptedValue / tot.total : null;
  tot.waitingShare = tot.total > 0 ? tot.waitingValue / tot.total : null;
  tot.progress = tot.qty > 0 ? tot.accepted / tot.qty : null;
  tot.deliveredPct = tot.qty > 0 ? tot.delivered / tot.qty : null;
  tot.actual = tot.total > 0 ? tot.actualWeighted / tot.total : null;

  const statusCounts = Object.fromEntries(STATUS_ORDER.map((st) => [st, 0]));
  for (const d of data.deliverables) if (!d.cancelled) statusCounts[del.get(d.id).status]++;
  tot.suspendMissing = data.deliverables.filter((d) => del.get(d.id).suspendMissing).length;

  return { asOf, asOfIso, reviewLimit, vat, ev, del, items, tot, statusCounts, itemsById, delById, span };
}

/* ---- status donut */
function donut(counts, total) {
  const R = 100, r0 = 62, cx = 110, cy = 110;
  const live = STATUS_ORDER.filter((s) => counts[s]);
  if (!total) return `<svg class="donut" viewBox="0 0 220 220" role="img" aria-label="لا توجد مخرجات"><circle cx="${cx}" cy="${cy}" r="${(R + r0) / 2}" fill="none" stroke="var(--line)" stroke-width="${R - r0}"/></svg>`;
  let a = -Math.PI / 2;
  const pt = (rad, ang) => `${(cx + rad * Math.cos(ang)).toFixed(2)},${(cy + rad * Math.sin(ang)).toFixed(2)}`;
  const paths = live.map((s) => {
    const n = counts[s], sweep = (n / total) * Math.PI * 2;
    const a2 = a + sweep, large = sweep > Math.PI ? 1 : 0;
    let d;
    if (live.length === 1) d = `M${pt(R, -Math.PI / 2)}A${R},${R} 0 1 1 ${pt(R, Math.PI * 1.5 - 0.0001)}L${pt(r0, Math.PI * 1.5 - 0.0001)}A${r0},${r0} 0 1 0 ${pt(r0, -Math.PI / 2)}Z`;
    else d = `M${pt(R, a)}A${R},${R} 0 ${large} 1 ${pt(R, a2)}L${pt(r0, a2)}A${r0},${r0} 0 ${large} 0 ${pt(r0, a)}Z`;
    a = a2;
    return `<path d="${d}" fill="var(--st-${STATUS_CLASS[s]})" stroke="var(--surface)" stroke-width="2" data-filter-status="${esc(s)}"><title>${esc(s)}: ${n} مخرج (${((n / total) * 100).toFixed(1)}%)</title></path>`;
  }).join("");
  return `<svg class="donut" viewBox="0 0 220 220" role="img" aria-label="توزيع المخرجات حسب الحالة">${paths}
    <text x="${cx}" y="${cy + 4}" text-anchor="middle" class="total">${total}</text><text x="${cx}" y="${cy + 26}" text-anchor="middle" class="total-lbl">مخرجًا</text></svg>`;
}

/* ---- concentric progress rings (outer → inner) */
function rings(list) {
  const size = 236, c = size / 2, w = 18, gap = 6;
  const arcs = list.map(([v, color], i) => {
    const r = c - w / 2 - i * (w + gap), len = 2 * Math.PI * r, val = Math.max(0, Math.min(1, Number.isFinite(v) ? v : 0));
    return `<circle cx="${c}" cy="${c}" r="${r}" stroke="var(${color})" stroke-opacity=".16" stroke-width="${w}"/>
      <circle class="arc" cx="${c}" cy="${c}" r="${r}" stroke="var(${color})" stroke-width="${w}" stroke-dasharray="${len.toFixed(2)}" stroke-dashoffset="${(len * (1 - val)).toFixed(2)}" transform="rotate(-90 ${c} ${c})"><title>${(val * 100).toFixed(1)}%</title></circle>`;
  }).join("");
  return `<svg class="rings" viewBox="0 0 ${size} ${size}" role="img" aria-label="حلقات الإنجاز: المقبول، والمسلَّم، والفعلي">${arcs}</svg>`;
}

/* ---- change request projection: what items would look like if pending requests were approved */
function crProjection() {
  const pend = state.crs.filter((x) => CR_OPEN.has(x.status) && !x.applied_at && Array.isArray(x.changes) && x.changes.length);
  const byItem = new Map(), added = [];
  for (const cr of pend) for (const ch of cr.changes) { if (ch.item_id) byItem.set(ch.item_id, { ...ch, cr }); else if (ch.new_item) added.push({ ...ch, cr }); }
  return { pend, byItem, added };
}

/* ---- items */
function viewItems() {
  const c = state.calc, t = c.tot, P = crProjection(), hasP = P.pend.length > 0;
  let projTotal = 0;
  const diffCell = (v) => `<td class="n ${v < 0 ? "red" : ""}">${v ? `<span class="num">${v > 0 ? "+" : ""}${nf2.format(v)}</span>` : '<span class="muted">—</span>'}</td>`;
  const rows = [...state.items].sort(byItemOrder).map((it) => {
    const r = c.items.get(it.id);
    const pr = P.byItem.get(it.id);
    const qA = pr ? numOr(pr.qty_after, r.qty) : r.qty, pA = pr ? numOr(pr.price_after, r.price) : r.price, totA = qA * pA;
    projTotal += totA;
    const projCells = hasP ? `<td class="n ${pr && qA !== r.qty ? "" : "muted"}">${int(qA)}</td><td class="n">${money(totA)}</td>${diffCell(totA - r.total)}` : "";
    const renamed = pr && pr.name_after && pr.name_after !== it.name ? `<div class="muted" style="font-size:.8rem">الاسم بعد الطلب: ${esc(pr.name_after)}</div>` : "";
    const mismatch = r.registered !== r.qty;

    return `<tr class="clickable" tabindex="0" data-edit-item="${esc(it.id)}">
      <td><span class="code">${esc(itemLabel(it))}</span></td><td><span class="code muted">${esc(it.wbs)}</span></td><td><div class="desc">${esc(it.name)}</div>${renamed}</td>
      <td class="n">${int(r.qty)}</td><td class="n">${money(r.price)}</td><td class="n">${money(r.total)}</td><td class="n">${money(r.totalVat)}</td>
      <td class="n ${mismatch ? "red" : ""}" title="${mismatch ? "عدد المخرجات المسجلة يختلف عن الكمية التعاقدية" : ""}">${int(r.registered)}</td>
      <td class="n">${int(r.delivered)}</td><td class="n">${int(r.accepted)}</td>

  }).join("") + (hasP ? P.added.map((a) => {
    const totA = numOr(a.qty_after, 0) * numOr(a.price_after, 0); projTotal += totA;

  }).join("") : "");
  const projHead = hasP ? `<th class="n">الكمية بعد الطلب</th><th class="n">القيمة بعد الطلب</th><th class="n">فرق القيمة</th>` : "";
  const projFoot = hasP ? `<td></td><td class="n">${money(projTotal)}</td>${diffCell(projTotal - t.total)}` : "";
  return `<section class="section">
    ${hasP ? `<div class="notice" style="background:var(--st-prog-bg);color:var(--st-prog-fg)">يوجد ${P.pend.length === 1 ? "طلب تغيير" : `${P.pend.length} طلبات تغيير`} في انتظار الاعتماد (${P.pend.map((x) => esc(x.code)).join("، ")}). الأعمدة «بعد الطلب» للعرض فقط، ولا تتغير أرقام البنود إلا بعد تطبيق الطلب من شاشة طلبات التغيير. المبالغ قبل الضريبة.</div>` : ""}
    <div class="section-head"><h2>بنود العقد</h2><div class="actions"><span class="count">المبالغ بالريال ${SAR} · اضغط على أي بند لتعديله</span><button class="btn primary" data-new-item type="button">+ بند جديد</button></div></div>
    ${state.items.length ? `<div class="table-wrap"><table>
      <thead><tr><th>رقم البند</th><th>WBS</th><th>اسم البند</th><th class="n">الكمية</th><th class="n">سعر الوحدة</th><th class="n">الإجمالي قبل الضريبة</th><th class="n">الإجمالي شاملًا الضريبة</th><th class="n">المسجلة</th><th class="n">المسلَّمة</th><th class="n">المقبولة</th><th class="n">نسبة المسلَّم</th><th class="n">نسبة الإنجاز</th><th class="n">الإنجاز الفعلي</th><th class="n">قيمة المقبول</th><th class="n">المتبقي</th>${projHead}<th class="c">طلبات التغيير</th></tr></thead>

/* ---- deliverables */
function filteredDeliverables() {
  const c = state.calc, f = state.filters, q = f.q.trim();
  return [...state.deliverables].filter((d) => {
    const k = c.del.get(d.id);
    if (f.item && d.item_id !== f.item) return false;
    if (f.status && k.status !== f.status) return false;
    if (k.cancelled && f.status !== ST.CAN) return false;
    if (f.issue === "open" && !k.openIssues) return false;
    if (f.issue === "blocking" && !k.blocking) return false;
    if (f.issue === "cr" && !k.crs.length) return false;
    if (f.issue === "nosusp" && !k.suspendMissing) return false;
    if (q && !(`${d.id} ${d.description || ""} ${d.notes || ""} ${Object.values(billingOf(d)).join(" ")}`.includes(q))) return false;
    return true;
  }).sort(byId);
}
function viewDeliverables() {
  const c = state.calc, f = state.filters, billingView = state.delView === "billing";
  const list = filteredDeliverables();
  const itemOpts = [...state.items].sort(byItemOrder).map((it) => `<option value="${esc(it.id)}"${f.item === it.id ? " selected" : ""}>${esc(itemLabel(it))} — ${esc(short(it.name, 40))}</option>`).join("");
  const statusOpts = [...STATUS_ORDER, ST.CAN].map((s) => `<option${f.status === s ? " selected" : ""}>${esc(s)}</option>`).join("");

  const rows = list.map((d) => {

  </section>`;
}

/* ---- periodic report */
function reportRange() {
  const r = state.report, today = dn(todayIso()), wd = (today + 4) % 7; // 0 = Sunday
  const weekStart = today - wd;
  const t = new Date(); const y = t.getFullYear(), m = t.getMonth();
  const monthStart = dn(`${y}-${String(m + 1).padStart(2, "0")}-01`);
  const prevMonthStart = dn(m === 0 ? `${y - 1}-12-01` : `${y}-${String(m).padStart(2, "0")}-01`);
  const ranges = {
    this_week: [weekStart, today], last_week: [weekStart - 7, weekStart - 1],
    this_month: [monthStart, today], last_month: [prevMonthStart, monthStart - 1],
  };
  if (r.preset !== "custom") { const [a, b] = ranges[r.preset] || ranges.last_week; return [isoOf(a), isoOf(b)]; }
  return [isIso(r.from) ? r.from : isoOf(weekStart - 7), isIso(r.to) ? r.to : isoOf(today)];
}
function buildReport() {
  const [from, to] = reportRange();
  const a = dn(from), b = dn(to);
  const inRange = (iso) => { const t = dn(iso); return t >= a && t <= b; };
  const end = computeModel({ ...state, events: state.events.filter((e) => dn(e.date) <= b) }, to);
  const evIn = state.events.filter((e) => inRange(e.date) && end.delById.has(e.deliverable) && !end.del.get(e.deliverable).suspended);
  const pickEv = (act) => evIn.filter((e) => e.action === act).sort((p, q) => String(p.date).localeCompare(String(q.date)))
    .map((e) => ({ e, d: end.delById.get(e.deliverable), k: end.del.get(e.deliverable), x: end.ev.get(e.id) }));
  const accepted = pickEv(ACT.ACC), submitted = pickEv(ACT.SUB), returned = pickEv(ACT.REP);
  const acceptedValue = accepted.reduce((s, x) => s + (x.k?.value || 0), 0);
  const openCycles = state.deliverables.map((d) => ({ d, k: end.del.get(d.id) })).filter((x) => x.k.openCycle && x.k.status !== ST.ACC).sort((p, q) => q.k.openCycle.review - p.k.openCycle.review);
  const overLimit = openCycles.filter((x) => x.k.openCycle.delay > 0);
  const issuesOpened = state.issues.filter((i) => inRange(i.date));
  const issuesClosed = state.issues.filter((i) => i.status === CLOSED && inRange(i.closed_date));
  const blockingOpen = state.issues.filter((i) => i.blocking && dn(i.date) <= b && (i.status !== CLOSED || dn(i.closed_date) > b));
  const crsTouched = state.crs.filter((x) => inRange(x.date) || inRange(x.decision_date));
  const crsOpen = state.crs.filter((x) => CR_OPEN.has(x.status));
  return { from, to, end, accepted, submitted, returned, acceptedValue, openCycles, overLimit, issuesOpened, issuesClosed, blockingOpen, crsTouched, crsOpen };
}

    ${del.notes ? `<div><h4>ملاحظات</h4><p style="margin:4px 0 0;white-space:pre-line">${esc(del.notes)}</p></div>` : ""}
    ${k.suspended ? `<div class="block card ${k.suspendMissing ? "blocking" : ""}"><h4>التعليق</h4>
      ${k.suspendMissing ? `<span class="red">لم يُدخل سبب التعليق بعد. أدخله من «تعديل بيانات المخرج».</span>` : `<div class="body">${esc(del.suspend_reason)}</div>`}
      <div class="meta">${del.suspend_date ? `<span>منذ <span class="date">${esc(del.suspend_date)}</span></span>` : ""}<span>${k.suspendCr ? `مرتبط بطلب التغيير <span class="code">${esc(k.suspendCr.code)}</span>` : del.suspend_cr_linked ? "مرتبط بطلب تغيير (لم يُحدَّد الطلب)" : "غير مرتبط بطلب تغيير"}</span><span>مستبعد من حسابات التسليم والقبول</span></div></div>` : ""}
    ${k.crs.length ? `<div class="block"><h4>طلبات تغيير مرتبطة</h4><div class="cards">${k.crs.map(crCard).join("")}</div></div>` : ""}
    <div class="actions"><button class="btn" type="button" data-edit-del="${esc(del.id)}">تعديل بيانات المخرج</button></div>`;

  let html;
  if (sub === "issues") {
    const editing = d.editIssue ? state.issues.find((i) => i.id === d.editIssue) : null;
    html = `${issueForm(editing, del.id)}
      ${d.confirmIssue ? confirmBlock("ستُحذف المشكلة أو القرار نهائيًا.", "issue:" + d.confirmIssue) : ""}

      ${issues.length ? `<div class="cards">${issues.map((i) => issueCard(i, { actions: true })).join("")}</div>` : `<span class="muted">لا توجد مشكلات أو قرارات على هذا المخرج.</span>`}</div>`;
  } else if (sub === "billing") {
    const b = billingOf(del);
    html = `<div class="kv">${BILLING.map((x) => `<div><span class="k">${x.label}</span><span class="v">${x.yn ? ynHtml(b[x.k]) : b[x.k] ? `<span class="code">${esc(b[x.k])}</span>` : '<span class="muted">—</span>'}</span></div>`).join("")}</div>
      <div class="actions"><button class="btn" type="button" data-edit-del="${esc(del.id)}">تعديل بيانات الفوترة</button></div>`;
  } else {
    const evs = state.events.filter((e) => e.deliverable === del.id).sort((a, b) => (dn(a.date) || 0) - (dn(b.date) || 0) || ACTIONS.indexOf(a.action) - ACTIONS.indexOf(b.action));
    const cls = { [ACT.SUB]: "sub", [ACT.REP]: "rep", [ACT.ACC]: "acc" };

      else if (x.vendorDays !== null) info = `لدى فريق المشروع <span class="num">${x.vendorDays}</span> يوم عمل${x.vendorOpen ? " حتى اليوم" : " حتى إعادة التسليم"}`;
      return `<div class="tl ${cls[e.action] || ""}"><div class="line1"><span class="what">${esc(e.action)}</span>${dateHtml(e.date)}
        <button class="btn small danger del-ev" type="button" data-del-ev="${esc(e.id)}" aria-label="حذف الحركة">حذف</button></div>
        ${info ? `<div class="info">${info}</div>` : ""}${x.warn ? `<div class="warn-cell">${esc(x.warn)}</div>` : ""}${e.notes ? `<div class="info">${esc(e.notes)}</div>` : ""}</div>`;

        <div><span class="k">أيام المراجعة (لدى العميل)</span><span class="v">${int(k.review)}</span></div>
        <div><span class="k">أيام التأخير على العميل</span><span class="v ${k.delay ? "red" : ""}">${int(k.delay)}</span></div>
        <div><span class="k">أيام لدى فريق المشروع</span><span class="v">${int(k.vendorDays)}</span></div>
      </div>
      <div class="block"><h4>تسجيل حركة</h4>
        <form id="quickEv" class="form-grid" autocomplete="off">
          <div class="field"><label for="qAct">نوع الحركة</label><select id="qAct" name="action">${ACTIONS.map((a) => `<option>${esc(a)}</option>`).join("")}</select></div>

          <div class="field wide"><label for="qNotes">ملاحظات</label><input id="qNotes" name="notes"></div>
          <div class="actions wide"><button class="btn primary" type="submit">إضافة إلى السجل</button></div>

  }
  return { title: del.id, titleHtml: `<span class="code">${esc(del.id)}</span> ${pill(k.status)} ${k.blocking ? `<span class="flag">${BLOCKING}</span>` : ""}`, tabs, html: head + html };
}

async function applyCr(cr, btn) {
  if (!cr || cr.applied_at) return false;
  const db = state.db, today = todayIso(), p = cr.plan || {};
  const strip = (o) => { const { id: _omit, ...rest } = o; return rest; };
  return run(btn, async () => {
    let newItemId = null;
    for (const ch of cr.changes || []) {
      if (ch.item_id) {
        const it = state.items.find((x) => x.id === ch.item_id); if (!it) continue;
        await db.collection("items").doc(it.id).set({ ...strip(it), name: ch.name_after || it.name, qty: numOr(ch.qty_after, it.qty), unit_price: numOr(ch.price_after, it.unit_price) });
      } else if (ch.new_item) {
        newItemId = newId("i");
        await db.collection("items").doc(newItemId).set(clean({ no: ch.new_item.no, wbs: ch.new_item.wbs, name: ch.new_item.name, qty: numOr(ch.qty_after, 0), unit_price: numOr(ch.price_after, 0), order: ch.new_item.order ?? state.items.length + 1 }));
      }
    }
    const patches = new Map(), patch = (id, x) => patches.set(id, { ...(patches.get(id) || {}), ...x });
    for (const id of p.cancel || []) patch(id, { cancelled: true, cancel_cr: cr.id, cancel_date: today });
    for (const r of p.rename || []) patch(r.id, { description: r.description });
    for (const id of p.resume || []) patch(id, { work_status: ST.PROG, resume: true });
    for (const [id, x] of patches) {
      const d = state.deliverables.find((y) => y.id === id); if (!d) continue;
      const body = { ...strip(d), ...x };
      if (body.resume) { for (const k of ["resume", "suspend_reason", "suspend_date", "suspend_cr", "suspend_cr_linked"]) delete body[k]; }
      await db.collection("deliverables").doc(id).set(body);
    }
    let max = Math.max(0, ...state.deliverables.map((d) => /^D-(\d+)$/.exec(d.id)).filter(Boolean).map((m) => Number(m[1])));
    const created = [];
    for (const a of p.add || []) {
      const itemId = a.item_id === "new" ? newItemId : a.item_id; if (!itemId) continue;
      for (let n = 0; n < a.count; n++) {
        const id = "D-" + String(++max).padStart(3, "0");
        await db.collection("deliverables").doc(id).set({ item_id: itemId, description: String(a.description || "").replace("{n}", String((a.start || 1) + n)), work_status: ST.NEW, cr_origin: cr.id });
        created.push(id);
      }
    }
    if (cr.extend_months) await db.doc("contract/settings").set({ ...state.settings, duration_months: numOr(state.settings.duration_months, 0) + Number(cr.extend_months) });
    await db.collection("crs").doc(cr.id).set({ ...strip(cr), status: "معتمد", decision_date: cr.decision_date || today, applied_at: today, applied: { created, new_item: newItemId } });
  }, "تم تطبيق طلب التغيير");
}

/* ------------------------------------------------------------ events */
function setTab(tab) {
  if (!TAB_KEYS.includes(tab)) tab = "dashboard";
  state.tab = tab;
  try { localStorage.setItem("tab", tab); } catch (_) {}
  if (location.hash !== "#" + tab) history.replaceState(null, "", "#" + tab);
  render();
  window.scrollTo(0, 0);
}

document.addEventListener("click", async (ev) => {
  if (ev.target.closest("input, select, textarea, label") && !ev.target.closest("button")) return;
  const t = ev.target.closest("button, tr, .card, path[data-filter-status], [data-close]");
  if (!t) return;
  const ds = t.dataset;
  if (ds.tab) return setTab(ds.tab);
  if ("close" in ds) return closeDrawer();
  if (ds.go) return setTab(ds.go);
  if (ds.filterStatus) { state.filters = { q: "", item: "", status: ds.filterStatus, issue: "" }; return setTab("deliverables"); }
  if (ds.delview) { state.delView = ds.delview; return render(); }
  if ("newItem" in ds) return openDrawer({ kind: "item" });
  if (ds.editItem) return openDrawer({ kind: "item", id: ds.editItem });
  if ("newDel" in ds) return openDrawer({ kind: "delForm" });
  if (ds.editDel) return openDrawer({ kind: "delForm", id: ds.editDel, sub: state.drawer?.sub });
  if (ds.openDel) return openDrawer({ kind: "del", id: ds.openDel, sub: ds.sub || "review" });
  if (ds.subTab) { state.drawer.sub = ds.subTab; state.drawer.editIssue = null; return renderDrawer(); }
  if ("newEv" in ds) return openDrawer({ kind: "ev" });
  if ("newIssue" in ds) return openDrawer({ kind: "issue" });
  if (ds.editIssue) {
    if (state.drawer?.kind === "del") { state.drawer.editIssue = ds.editIssue; renderDrawer(); document.querySelector(".drawer-body").scrollTop = 0; return; }
    return openDrawer({ kind: "issue", id: ds.editIssue });
  }
  if ("cancelIssue" in ds) { if (state.drawer?.kind === "del") { state.drawer.editIssue = null; return renderDrawer(); } return closeDrawer(); }
  if (ds.closeIssue) return setIssueStatus(ds.closeIssue, true, t);
  if (ds.reopenIssue) return setIssueStatus(ds.reopenIssue, false, t);
  if (ds.askDelIssue) { state.drawer.confirmIssue = ds.askDelIssue; return renderDrawer(); }
  if ("newCr" in ds) return openDrawer({ kind: "cr" });
  if (ds.editCr) return openDrawer({ kind: "cr", id: ds.editCr });
  if ("askDelete" in ds) { state.drawer.confirm = true; return renderDrawer(); }
  if ("askApply" in ds) { state.drawer.confirmApply = true; return renderDrawer(); }
  if (ds.delEv) { state.drawer.confirmEv = ds.delEv; return renderDrawer(); }
  if ("cancelConfirm" in ds) { Object.assign(state.drawer, { confirm: false, confirmEv: null, confirmIssue: null, confirmApply: false }); return renderDrawer(); }
  if (ds.confirm) {
    const d = state.drawer;
    if (ds.confirm === "apply") { if (await applyCr(state.crs.find((x) => x.id === d.id), t)) closeDrawer(); return; }
    if (ds.confirm === "item") { if (await run(t, () => state.db.collection("items").doc(d.id).delete(), "تم حذف البند")) closeDrawer(); }
    else if (ds.confirm === "cr") { if (await run(t, () => state.db.collection("crs").doc(d.id).delete(), "تم حذف طلب التغيير")) closeDrawer(); }
    else if (ds.confirm === "del") {
      const evs = state.events.filter((e) => e.deliverable === d.id), iss = state.issues.filter((i) => i.deliverable === d.id);
      if (await run(t, async () => {
        for (const e of evs) await state.db.collection("events").doc(e.id).delete();
        for (const i of iss) await state.db.collection("issues").doc(i.id).delete();
        await state.db.collection("deliverables").doc(d.id).delete();
      }, "تم حذف المخرج")) closeDrawer();
    } else if (ds.confirm.startsWith("ev:")) {
      if (await run(t, () => state.db.collection("events").doc(ds.confirm.slice(3)).delete(), "تم حذف الحركة")) { d.confirmEv = null; renderDrawer(); }
    } else if (ds.confirm.startsWith("issue:")) {
      if (await run(t, () => state.db.collection("issues").doc(ds.confirm.slice(6)).delete(), "تم الحذف")) { if (d.kind === "issue") closeDrawer(); else { d.confirmIssue = null; d.editIssue = null; renderDrawer(); } }
    }
    return;
  }
  if (ds.delHol !== undefined) {
    const i = Number(ds.delHol); const list = (state.settings.holidays || []).filter((_, j) => j !== i);
    return saveHolidays(list, t, "تم حذف الإجازة");
  }
  if (t.id === "themeToggle" || t.id === "themeToggleM") return applyTheme(currentTheme() === "dark" ? "light" : "dark", true);
  if (t.id === "exportBtn") return exportAll(t);
  if (t.id === "reportExport") return exportReport(t);
  if (t.id === "reportCopy") {
    const text = reportText(buildReport());
    try { await navigator.clipboard.writeText(text); toast("نُسخ التقرير؛ يمكنك لصقه في البريد أو الرسالة"); }
    catch (_) {
      const box = document.getElementById("copyFallback");
      box.innerHTML = `<textarea class="copybox" readonly aria-label="نص التقرير">${esc(text)}</textarea>`;
      const ta = box.querySelector("textarea"); ta.focus(); ta.select();
      toast("تعذّر النسخ التلقائي؛ النص محدد، اضغط Ctrl+C");
    }
  }
});

document.addEventListener("submit", (ev) => {
  ev.preventDefault();
  const form = ev.target, btn = form.querySelector('button[type="submit"]');
  const fid = form.getAttribute("id"); // not form.id: a field named "id" would shadow it
  if (fid === "itemForm") return saveItem(form, btn);
  if (fid === "delForm") return saveDeliverable(form, btn);
  if (fid === "evForm") return addEvent(form, btn);
  if (fid === "quickEv") return addEvent(form, btn, state.drawer.id);
  if (fid === "issueForm") return saveIssue(form, btn);
  if (fid === "crForm") return saveCr(form, btn);
  if (fid === "settingsForm") return saveSettings(form, btn);
  if (fid === "holForm") {
    const date = form.querySelector("#hDate").value, name = form.querySelector("#hName").value.trim(), note = form.querySelector("#hNote").value.trim();
    if (!isIso(date) || !name) return toast("أدخل التاريخ والمناسبة.", true);
    if ((state.settings.holidays || []).some((h) => h.date === date)) return toast("هذا التاريخ مسجل من قبل.", true);
    return saveHolidays([...(state.settings.holidays || []), clean({ date, name, note })], btn, "تمت إضافة الإجازة");
  }
});

let inputTimer;
const SEARCH = { fQ: (v) => (state.filters.q = v), lQ: (v) => (state.logFilters.q = v), iQ: (v) => (state.issueFilters.q = v) };
document.addEventListener("input", (ev) => {
  const id = ev.target.id;
  if (!SEARCH[id]) return;
  clearTimeout(inputTimer);
  inputTimer = setTimeout(() => {
    SEARCH[id](ev.target.value);
    const pos = ev.target.selectionStart;
    render();
    const el = document.getElementById(id); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (_) {} }
  }, 200);
});
document.addEventListener("change", (ev) => {
  const el = ev.target, id = el.id;
  const set = { fItem: () => (state.filters.item = el.value), fStatus: () => (state.filters.status = el.value), fIssue: () => (state.filters.issue = el.value),
    lAction: () => (state.logFilters.action = el.value), iState: () => (state.issueFilters.state = el.value), iType: () => (state.issueFilters.type = el.value),
    rPreset: () => { const [a, b] = reportRange(); state.report.preset = el.value; if (el.value === "custom") { state.report.from = a; state.report.to = b; } },
    rFrom: () => { const [, b] = reportRange(); state.report = { preset: "custom", from: el.value, to: b }; },
    rTo: () => { const [a] = reportRange(); state.report = { preset: "custom", from: a, to: el.value }; } };
  if (set[id]) { set[id](); return render(); }
  if (id === "dSuspLinked") { const box = document.getElementById("suspCrPick"); if (box) box.hidden = !el.checked; return; }
  if (id === "dWork") { const box = document.getElementById("suspFields"); if (box) box.hidden = el.value !== ST.SUS; return; }
  if (el.name === "critem") {

document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape" && state.drawer) closeDrawer();
  if (ev.key === "Enter" && ev.target.matches("tr.clickable")) ev.target.click();
});
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (TAB_KEYS.includes(h) && h !== state.tab) setTab(h); });

/* ------------------------------------------------------------ boot */
(function initTab() {
  let tab = location.hash.slice(1);
  if (!TAB_KEYS.includes(tab)) { try { tab = localStorage.getItem("tab") || ""; } catch (_) { tab = ""; } }
  state.tab = TAB_KEYS.includes(tab) ? tab : "dashboard";
})();
render();

let scheduled = false;
function scheduleRender() {
  if (scheduled) return; scheduled = true;
  requestAnimationFrame(() => {
    scheduled = false;
    // a snapshot arriving while the user types in the drawer must not wipe the form
    const active = document.activeElement;
    if (state.drawer && active && active.closest(".drawer") && active.matches("input, textarea, select")) { compute(); return; }
    render();
  });
}

async function boot() {
  const api = window.claude;
  if (!api || typeof api.use !== "function") { state.offline = true; render(); return; }
  const [db, downloads] = await Promise.all([api.use("db").catch(() => null), api.use("downloads").catch(() => null)]);
  state.downloads = downloads;
  if (!downloads) document.getElementById("exportBtn").hidden = true;
  if (!db) { state.offline = true; render(); return; }
  state.db = db;
  const onErr = (e) => { if (e?.code !== "unavailable") toast(errText(e), true); };
  db.doc("contract/settings").onSnapshot((snap) => {
    state.settings = { ...DEFAULT_SETTINGS, ...(snap.exists ? snap.data() : {}) };
    state.ready.settings = true; scheduleRender();
  }, onErr);
  for (const name of COLLECTIONS) db.collection(name).onSnapshot((snap) => {
    state[name] = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    state.ready[name] = true; scheduleRender();
  }, onErr);
}
boot();
})();
</script>
