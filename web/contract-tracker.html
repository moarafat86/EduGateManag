/* ---------- base */
* { box-sizing: border-box; }
html { direction: rtl; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font); font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; letter-spacing: -.003em; }
.num, .date, .code { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; display: inline-block; }
.date { white-space: nowrap; }
.code { font-weight: 600; letter-spacing: .01em; }
td .code { white-space: nowrap; }
.sar { width: .8em; height: .9em; vertical-align: -0.06em; margin-inline-end: .26em; fill: currentColor; flex: none; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 8px; }
::selection { background: var(--accent-soft); }

/* ---------- app shell */
.app { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: 100%; }
.sidebar { position: sticky; top: env(safe-area-inset-top, 0px); height: calc(100vh - env(safe-area-inset-top, 0px)); padding: 22px 14px; display: flex; flex-direction: column; gap: 22px; background: var(--glass); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-inline-end: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; padding-inline: 8px; }
.brand-mark { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(145deg, var(--accent), #5E5CE6); display: grid; place-items: center; color: #fff; flex: none; box-shadow: 0 4px 12px rgba(0, 113, 227, .3); }
.brand-mark svg { width: 19px; height: 19px; }
.brand-text { min-width: 0; display: flex; flex-direction: column; }
.brand-text strong { font-family: var(--font-display); font-size: .95rem; font-weight: 700; line-height: 1.3; }
.brand-text span { font-size: .74rem; color: var(--muted); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 11px; width: 100%; border: 0; background: none; padding: 9px 10px; border-radius: 10px; cursor: pointer; color: var(--ink-2); font-weight: 500; font-size: .92rem; text-align: start; transition: background .15s, color .15s; }
.nav button svg { width: 19px; height: 19px; flex: none; color: var(--muted); transition: color .15s; }
.nav button:hover { background: var(--surface-3); }
.nav button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.nav button[aria-selected="true"] svg { color: var(--accent-ink); }
.nav .lbl { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav .badge { min-width: 20px; padding: 0 6px; border-radius: 10px; background: var(--st-late); color: #fff; font-size: .72rem; font-weight: 700; line-height: 20px; text-align: center; }
.side-foot { margin-top: auto; padding: 12px 10px 0; border-top: 1px solid var(--line); font-size: .76rem; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }

.main-col { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--glass); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--line); }
.topbar-inner { max-width: none; margin: 0 auto; padding: 14px 32px; display: flex; align-items: center; gap: 16px; justify-content: space-between; flex-wrap: wrap; }
.page-head { min-width: 0; display: flex; flex-direction: column; }
.page-head h1 { margin: 0; font-family: var(--font-display); font-size: 1.55rem; font-weight: 700; letter-spacing: -.02em; line-height: 1.25; }
.page-head .meta { color: var(--muted); font-size: .8rem; display: flex; flex-wrap: wrap; gap: 2px 12px; }
.page-head .meta > span:empty { display: none; }
.top-actions { display: flex; gap: 8px; align-items: center; }

.theme-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0 10px; color: var(--ink-2); font-size: .85rem; font-weight: 500; }
.theme-row .lbl { display: flex; align-items: center; gap: 8px; }
.theme-row svg { width: 17px; height: 17px; color: var(--muted); }
.switch { position: relative; width: 44px; height: 26px; border-radius: 13px; border: 0; background: var(--surface-3); cursor: pointer; flex: none; transition: background .2s; padding: 0; }
.switch .knob { position: absolute; top: 3px; inset-inline-start: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: inset-inline-start .2s; }
.switch[aria-checked="true"] { background: var(--st-acc); }
.switch[aria-checked="true"] .knob { inset-inline-start: 21px; }
.theme-m { display: none; }
.theme-m svg { width: 17px; height: 17px; }
main { max-width: none; width: 100%; margin: 0 auto; padding: 26px 32px 64px; display: flex; flex-direction: column; gap: 22px; }

/* ---------- buttons & inputs */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; background: var(--surface-3); color: var(--ink); padding: 7px 16px; border-radius: 980px; cursor: pointer; font-weight: 500; font-size: .9rem; transition: transform .1s, filter .15s, background .15s; white-space: nowrap; }
.btn:hover { filter: brightness(.97); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { background: var(--danger-soft); color: var(--danger); }
.btn.danger.solid { background: var(--danger); color: #fff; }
.btn:disabled { opacity: .5; cursor: progress; transform: none; }
.btn.small { padding: 4px 12px; font-size: .82rem; }
[hidden] { display: none !important; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label, .field .label { font-size: .8rem; color: var(--muted); font-weight: 500; }
.field input, .field select, .field textarea, .filters input, .filters select {
  background: var(--surface-2); border: 1px solid transparent; border-radius: var(--r-sm); padding: 9px 12px; width: 100%; min-width: 0; transition: border-color .15s, background .15s, box-shadow .15s;
}
.field input:focus, .field select:focus, .field textarea:focus, .filters input:focus, .filters select:focus { outline: none; background: var(--surface); border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.field input[readonly] { color: var(--muted); }
.field textarea { resize: vertical; min-height: 80px; }
.field .hint { font-size: .76rem; color: var(--muted); }
.check { display: flex; align-items: center; gap: 9px; font-weight: 500; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
.checks { display: flex; flex-wrap: wrap; gap: 8px 18px; max-height: 240px; overflow-y: auto; background: var(--surface-2); border-radius: var(--r-sm); padding: 10px 12px; }
.checks .check { font-weight: 400; font-size: .88rem; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; }
.form-grid .wide { grid-column: 1 / -1; }
.form-group { grid-column: 1 / -1; font-weight: 600; font-size: .95rem; padding-top: 10px; border-top: 1px solid var(--line); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; padding: 2px; border-radius: 10px; background: var(--surface-3); }
.seg button { background: none; border: 0; padding: 5px 16px; border-radius: 8px; cursor: pointer; color: var(--ink-2); font-weight: 500; font-size: .86rem; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }

/* ---------- surfaces */
.section { background: var(--surface); border-radius: var(--r-lg); padding: 22px 24px; display: flex; flex-direction: column; gap: 16px; min-width: 0; box-shadow: var(--shadow); }
.section-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
.section-head h2 { margin: 0; font-family: var(--font-display); font-size: 1.12rem; font-weight: 700; letter-spacing: -.01em; }
.section-head .sub { color: var(--muted); font-size: .84rem; }
.stack { display: flex; flex-direction: column; gap: 22px; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 470px), 1fr)); gap: 22px; }

/* ---------- hero rings */
.hero { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 34px; align-items: center; padding: 30px 34px; border-radius: var(--r-xl); background: var(--surface); box-shadow: var(--shadow); }
.rings { width: 236px; height: 236px; max-width: 100%; }
.rings circle { fill: none; stroke-linecap: round; }
.rings .arc { transition: stroke-dashoffset 1.1s cubic-bezier(.2, .8, .2, 1); }
.hero-body { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.eyebrow { font-size: .78rem; font-weight: 600; color: var(--muted); letter-spacing: .04em; }
.hero-title { margin: 0; font-family: var(--font-display); font-size: clamp(1.6rem, 2.6vw, 2.25rem); font-weight: 700; letter-spacing: -.025em; line-height: 1.2; text-wrap: balance; }
.hero-title .num { color: var(--st-acc-fg); }
.hero-sub { color: var(--muted); font-size: .92rem; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.ring-legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.ring-item { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: var(--r); background: var(--surface-2); }
.ring-item .k { display: flex; align-items: center; gap: 7px; font-size: .8rem; color: var(--muted); font-weight: 500; }
.ring-item .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.ring-item .v { font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; letter-spacing: -.02em; line-height: 1.25; }
.ring-item .f { font-size: .76rem; color: var(--muted); }
.ring-item .v .amt { font-size: .5em; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-inline-start: 8px; }
.rings .hit { cursor: default; }
.rings .arc, .rings .track { transition: stroke-width .15s, opacity .15s; }
.rings:hover .arc, .rings:hover .track { opacity: .35; }
.rings .ring.on .arc, .rings .ring.on .track { opacity: 1; }
.rings .ring.on .arc { stroke-width: 22px; }
.rings .c-v { font-family: var(--font-display); font-size: 28px; font-weight: 700; fill: var(--ink); letter-spacing: -.02em; }
.rings .c-l { font-size: 11px; fill: var(--muted); }
.donut:hover path { opacity: .45; }
.donut path.on { opacity: 1; }
.chart-tip { position: fixed; z-index: 90; pointer-events: none; background: var(--ink); color: var(--bg); padding: 8px 12px; border-radius: 10px; font-size: .8rem; line-height: 1.45; box-shadow: var(--shadow-lg); transform: translate(-50%, calc(-100% - 14px)); display: flex; flex-direction: column; gap: 1px; min-width: 120px; text-align: center; }
.chart-tip strong { font-weight: 600; }
.chart-tip .big { font-size: 1.05rem; font-weight: 700; }

/* ---------- KPI tiles */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); gap: 16px; }
.kpi { background: var(--surface); border-radius: var(--r-lg); padding: 18px 20px; display: flex; flex-direction: column; gap: 4px; min-width: 0; box-shadow: var(--shadow); }
.kpi .label { color: var(--muted); font-size: .8rem; font-weight: 500; }
.kpi .value { font-family: var(--font-display); font-size: 1.55rem; font-weight: 700; letter-spacing: -.02em; line-height: 1.3; display: flex; align-items: baseline; flex-wrap: wrap; gap: 0 10px; }
.kpi .value .amt { font-size: .6em; color: var(--muted); font-weight: 500; letter-spacing: 0; }
.kpi .foot { color: var(--muted); font-size: .78rem; }
.kpi .meter { height: 5px; border-radius: 3px; background: var(--surface-3); overflow: hidden; margin-top: 8px; }
.kpi .meter span { display: block; height: 100%; border-radius: 3px; }
.kpi.wait .value { color: var(--st-wait-fg); }
.kpi.acc .value { color: var(--st-acc-fg); }

/* ---------- status */
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 10px; border-radius: 980px; font-size: .78rem; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .85; }
.s-acc { background: var(--st-acc-bg); color: var(--st-acc-fg); }
.s-wait { background: var(--st-wait-bg); color: var(--st-wait-fg); }
.s-ret { background: var(--st-ret-bg); color: var(--st-ret-fg); }
.s-late { background: var(--st-late-bg); color: var(--st-late-fg); }
.s-prog { background: var(--st-prog-bg); color: var(--st-prog-fg); }
.s-sus { background: var(--st-sus-bg); color: var(--st-sus-fg); }
.s-new { background: var(--st-new-bg); color: var(--st-new-fg); }
.s-inv { background: var(--st-inv-bg); color: var(--st-inv-fg); }
.s-certw { background: var(--st-certw-bg); color: var(--st-certw-fg); }
.s-cert { background: var(--st-cert-bg); color: var(--st-cert-fg); }
.flag { display: inline-flex; align-items: center; gap: 4px; padding: 1px 9px; border-radius: 980px; font-size: .74rem; font-weight: 600; white-space: nowrap; background: var(--st-late-bg); color: var(--st-late-fg); }
.flag.soft { background: var(--st-prog-bg); color: var(--st-prog-fg); }
.yes { color: var(--st-acc-fg); font-weight: 600; }
.no { color: var(--muted); }

/* ---------- donut */
.donut-wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 22px 30px; }
.donut { width: 210px; height: 210px; flex: none; max-width: 100%; }
.donut path { cursor: pointer; transition: opacity .15s; }
.donut .total { font-family: var(--font-display); font-size: 34px; font-weight: 700; fill: var(--ink); letter-spacing: -.02em; }
.donut .total-lbl { font-size: 12px; fill: var(--muted); }
.legend { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 200px; }
.legend button { background: none; border: 0; padding: 7px 8px; border-radius: 9px; cursor: pointer; display: grid; grid-template-columns: 10px 1fr auto auto; gap: 10px; align-items: center; text-align: start; font-size: .9rem; }
.legend button:hover { background: var(--surface-2); }
.legend .sw { width: 10px; height: 10px; border-radius: 50%; }
.legend .share { color: var(--muted); font-size: .8rem; min-width: 46px; text-align: end; }

/* ---------- bars */
.mini-bar { display: inline-flex; width: 64px; height: 5px; background: var(--surface-3); border-radius: 3px; overflow: hidden; vertical-align: middle; margin-inline-start: 8px; }

(() => {

/* light / dark switch: follows the device until the viewer picks one, then remembers the choice */
const systemDark = () => { try { return window.matchMedia("(prefers-color-scheme: dark)").matches; } catch (_) { return false; } };

function syncThemeSwitch() { const el = document.getElementById("themeToggle"); if (el) el.setAttribute("aria-checked", String(currentTheme() === "dark")); }
function applyTheme(theme, remember) {
  document.documentElement.dataset.theme = theme;

(() => { let saved = null; try { saved = localStorage.getItem("theme"); } catch (_) {} if (saved === "dark" || saved === "light") applyTheme(saved, false); else syncThemeSwitch(); })();

/* ------------------------------------------------------------ constants */
const ST = { ACC: "تم القبول", SUS: "معلق", RET: "مُعاد بملاحظات", WAIT: "في انتظار القبول", LATE: "متأخر", PROG: "جاري العمل", NEW: "لم يبدأ", CAN: "ملغى",

  [ST.DONE]: "acc", [ST.INV]: "inv", [ST.CERTW]: "certw", [ST.CERT]: "cert" };
// two statuses per deliverable: execution (manual, «تم» follows the review log) and billing (follows the review log and billing data)

  settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
};
const navIcon = (k) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON_PATHS[k] || ""}</svg>`;
const COLLECTIONS = ["items", "deliverables", "events", "issues", "crs"];
/* Saudi Riyal sign — glyph outline from the Saudi Riyal font (SIL OFL 1.1) */
const SAR_PATH = "M750,1119C730,1163,716,1211,711,1262L1136,1172C1156,1127,1169,1079,1174,1028ZM1136,901C1156,857,1169,809,1174,758L843,828L843,693L1136,631C1156,587,1169,538,1174,488L843,558L843,72C793,100,748,138,711,183L711,586L579,614L579,6C528,34,483,72,447,117L447,642L151,705C131,750,117,798,112,849L447,777L447,948L88,1024C68,1068,55,1117,50,1167L425,1088C456,1081,482,1063,499,1038L568,936C575,926,579,913,579,899L579,749L711,721L711,992Z";
const SAR = `<svg class="sar" viewBox="40 0 1145 1270" role="img" aria-label="ريال سعودي"><path d="${SAR_PATH}"/></svg>`;

/* ------------------------------------------------------------ state */
const state = {
  db: null, downloads: null,
  ready: { settings: false, items: false, deliverables: false, events: false, issues: false, crs: false },
  settings: { ...DEFAULT_SETTINGS }, items: [], deliverables: [], events: [], issues: [], crs: [],
  tab: "dashboard",
  filters: { q: "", item: "", exec: "", bill: "", issue: "" }, delView: "review",
  logFilters: { q: "", action: "" }, issueFilters: { state: OPEN, type: "", q: "" },
  report: { preset: "last_week", from: "", to: "" },
  calc: null, drawer: null, offline: false,
};

/* ------------------------------------------------------------ utils */
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nf2 = new Intl.NumberFormat("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const nf0 = new Intl.NumberFormat("en-US", { maximumFractionDigits: 2 });
const money = (v) => `<span class="num">${Number.isFinite(v) && v !== 0 ? nf2.format(v) : "-"}</span>`;
const sar = (v) => `<span class="num">${SAR}${Number.isFinite(v) ? nf2.format(v) : "-"}</span>`;
const int = (v) => `<span class="num">${Number.isFinite(v) && v !== 0 ? nf0.format(v) : "-"}</span>`;
const pct = (v) => `<span class="num">${Number.isFinite(v) ? (v * 100).toFixed(1) + "%" : "-"}</span>`;
const bar = (v, cls = "") => `<span class="mini-bar ${cls}"><span style="width:${Math.max(0, Math.min(100, (v || 0) * 100))}%"></span></span>`;
const dateHtml = (iso) => iso ? `<span class="date">${esc(iso)}</span>` : `<span class="muted">—</span>`;
const pill = (s, cls) => `<span class="pill s-${cls || STATUS_CLASS[s] || "new"}">${esc(s)}</span>`;
const ynHtml = (v) => v === "نعم" ? `<span class="yes">نعم</span>` : v === "لا" ? `<span class="no">لا</span>` : `<span class="muted">—</span>`;
const isIso = (s) => typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s);
const dn = (iso) => { if (!isIso(iso)) return NaN; const [y, m, d] = iso.split("-").map(Number); return Math.floor(Date.UTC(y, m - 1, d) / 864e5); };
const isoOf = (n) => new Date(n * 864e5).toISOString().slice(0, 10);
const todayIso = () => { const t = new Date(); return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, "0")}-${String(t.getDate()).padStart(2, "0")}`; };
const numOr = (v, d) => (v === "" || v === null || v === undefined || !Number.isFinite(Number(v))) ? d : Number(v);
const itemLabel = (it) => it ? String(it.no ?? "") : "";
const byItemOrder = (a, b) => (a.order ?? 0) - (b.order ?? 0) || String(a.no).localeCompare(String(b.no), "ar");
const byId = (a, b) => String(a.id).localeCompare(String(b.id), "en", { numeric: true });
const billingOf = (d) => d.billing || d.legacy_billing || {};
const filled = (v) => v !== undefined && v !== null && String(v).trim() !== "";
const short = (s, n = 70) => { s = String(s || ""); return s.length > n ? s.slice(0, n) + "…" : s; };

function toast(msg, isErr) {
  const root = document.getElementById("toastRoot");
  root.innerHTML = `<div class="toast${isErr ? " err" : ""}">${esc(msg)}</div>`;
  clearTimeout(toast.t);
  toast.t = setTimeout(() => { root.innerHTML = ""; }, isErr ? 6000 : 2600);
}
const errText = (e) => {
  const map = { quota_exceeded: "امتلأت مساحة التخزين؛ يُرجى حذف بيانات قديمة.", invalid_argument: "لا توجد صلاحية للحفظ أو البيانات غير صحيحة.", resource_exhausted: "طلبات كثيرة متتالية؛ يُرجى الانتظار ثوانيَ ثم المحاولة مجددًا.", unavailable: "التخزين غير متاح حاليًا؛ يُرجى المحاولة بعد قليل.", revoked: "سُحبت صلاحية الوصول." };
  return map[e?.code] || e?.message || "حدث خطأ غير متوقع";
};

/* ------------------------------------------------------------ calculations
   Same rules as the Excel workbook:
   - every "تسليم" opens a review cycle; it closes at the first reply/acceptance on or after it, or the next submission
   - review days = working days from the day after submission to the cycle end (weekend + holidays excluded)
   - delay = review days above the review limit, per cycle                                                     */
function computeModel(data, asOfIso) {
  const s = data.settings;
  const asOf = dn(asOfIso);
  const weekend = new Set((Array.isArray(s.weekend) ? s.weekend : [5, 6]).map(Number));
  const hol = new Set((s.holidays || []).map((h) => dn(h.date)).filter(Number.isFinite));
  const reviewLimit = numOr(s.review_days, 10);
  const vat = numOr(s.vat, 0.15);
  const workdays = (a, b) => { if (!(b >= a)) return 0; let c = 0; for (let d = a; d <= b; d++) if (!weekend.has((d + 4) % 7) && !hol.has(d)) c++; return c; };
  const span = (a, b) => Math.max(0, workdays(a, b) - 1);

  const itemsById = new Map(data.items.map((i) => [i.id, i]));
  const delById = new Map(data.deliverables.map((d) => [d.id, d]));
  // a suspended deliverable (manual "معلق", never accepted) is left out of every delivery/acceptance figure
  const acceptedIds = new Set(data.events.filter((e) => e.action === ACT.ACC && isIso(e.date)).map((e) => e.deliverable));
  // a deliverable cancelled by an applied change request is left out of everything except its own record
  const cancelledIds = new Set(data.deliverables.filter((d) => d.cancelled).map((d) => d.id));
  const suspendedIds = new Set(data.deliverables.filter((d) => d.work_status === ST.SUS && !acceptedIds.has(d.id) && !d.cancelled).map((d) => d.id));
  const evBy = new Map();
  for (const e of data.events) {
    const t = dn(e.date);
    if (!e.deliverable || !Number.isFinite(t) || !ACTIONS.includes(e.action)) continue;
    if (!evBy.has(e.deliverable)) evBy.set(e.deliverable, []);
    evBy.get(e.deliverable).push({ ...e, t });
  }

  const ev = new Map();
  for (const e of data.events) {
    const c = { cycle: null, end: null, open: false, review: null, delay: null, vendorDays: null, vendorOpen: false, warn: "", excluded: suspendedIds.has(e.deliverable) || cancelledIds.has(e.deliverable) };
    const t = dn(e.date), list = evBy.get(e.deliverable) || [];
    if (!e.deliverable) c.warn = "رقم المخرج ناقص";
    else if (!delById.has(e.deliverable)) c.warn = "رقم المخرج غير موجود";
    else if (!ACTIONS.includes(e.action)) c.warn = "نوع الحركة ناقص";
    else if (!Number.isFinite(t)) c.warn = "التاريخ ناقص";
    else if (t > asOf) c.warn = "التاريخ بعد تاريخ الاحتساب";
    else if (e.action !== ACT.SUB && !list.some((x) => x.action === ACT.SUB && x.t <= t)) c.warn = "لا يوجد تسليم سابق لهذه الحركة";

    if (Number.isFinite(t) && e.deliverable) {
      if (e.action === ACT.SUB) {
        c.cycle = list.filter((x) => x.action === ACT.SUB && x.t < t).length + 1;
        const ends = [
          ...list.filter((x) => x.action !== ACT.SUB && x.t >= t).map((x) => x.t),
          ...list.filter((x) => x.action === ACT.SUB && x.t > t).map((x) => x.t),
        ];
        c.open = ends.length === 0;
        c.end = c.open ? asOf : Math.min(...ends);
        c.review = span(t, c.end);
        c.delay = Math.max(0, c.review - reviewLimit);
      } else if (e.action === ACT.REP) {

/* ---- status donut */
function donut(counts, order, attr, label) {
  const R = 100, r0 = 62, cx = 110, cy = 110;
  const live = order.filter((s) => counts[s]), total = order.reduce((a, s) => a + (counts[s] || 0), 0);
  if (!total) return `<svg class="donut" viewBox="0 0 220 220" role="img" aria-label="لا توجد مخرجات"><circle cx="${cx}" cy="${cy}" r="${(R + r0) / 2}" fill="none" stroke="var(--line)" stroke-width="${R - r0}"/></svg>`;
  let a = -Math.PI / 2;
  const pt = (rad, ang) => `${(cx + rad * Math.cos(ang)).toFixed(2)},${(cy + rad * Math.sin(ang)).toFixed(2)}`;
  const paths = live.map((s) => {
    const n = counts[s], sweep = (n / total) * Math.PI * 2;
    const a2 = a + sweep, large = sweep > Math.PI ? 1 : 0;
    let d;
    if (live.length === 1) d = `M${pt(R, -Math.PI / 2)}A${R},${R} 0 1 1 ${pt(R, Math.PI * 1.5 - 0.0001)}L${pt(r0, Math.PI * 1.5 - 0.0001)}A${r0},${r0} 0 1 0 ${pt(r0, -Math.PI / 2)}Z`;
    else d = `M${pt(R, a)}A${R},${R} 0 ${large} 1 ${pt(R, a2)}L${pt(r0, a2)}A${r0},${r0} 0 ${large} 0 ${pt(r0, a)}Z`;
    a = a2;
    const p = ((n / total) * 100).toFixed(1) + "%";
    return `<path d="${d}" fill="var(--st-${STATUS_CLASS[s]})" stroke="var(--surface)" stroke-width="2" data-filter-${attr}="${esc(s)}" data-tip-title="${esc(s)}" data-tip-pct="${p}" data-tip-sub="${n} مخرج" data-center-v="${p}" data-center-l="${esc(s)}"></path>`;
  }).join("");
  return `<svg class="donut" viewBox="0 0 220 220" role="img" aria-label="${esc(label)}">${paths}
    <text x="${cx}" y="${cy + 4}" text-anchor="middle" class="total c-v" data-default="${total}">${total}</text><text x="${cx}" y="${cy + 26}" text-anchor="middle" class="total-lbl c-l" data-default="مخرجًا">مخرجًا</text></svg>`;
}

/* ---- concentric progress rings (outer → inner) */
function rings(list) {
  const size = 236, c = size / 2, w = 18, gap = 6;
  const arcs = list.map(({ v, color, label, amt }, i) => {
    const r = c - w / 2 - i * (w + gap), len = 2 * Math.PI * r, val = Math.max(0, Math.min(1, Number.isFinite(v) ? v : 0));
    const p = (val * 100).toFixed(1) + "%";
    return `<g class="ring hit" data-tip-title="${esc(label)}" data-tip-pct="${p}" data-tip-amt="${Number.isFinite(amt) ? amt : ""}" data-center-v="${p}" data-center-l="${esc(label)}">
      <circle class="track" cx="${c}" cy="${c}" r="${r}" stroke="var(${color})" stroke-opacity=".16" stroke-width="${w}"/>
      <circle class="arc" cx="${c}" cy="${c}" r="${r}" stroke="var(${color})" stroke-width="${w}" stroke-dasharray="${len.toFixed(2)}" stroke-dashoffset="${(len * (1 - val)).toFixed(2)}" transform="rotate(-90 ${c} ${c})"/></g>`;
  }).join("");
  return `<svg class="rings" viewBox="0 0 ${size} ${size}" role="img" aria-label="حلقات الإنجاز: المقبول، والمسلَّم، والفعلي">${arcs}
    <text class="c-v" x="${c}" y="${c + 6}" text-anchor="middle" data-default=""></text><text class="c-l" x="${c}" y="${c + 24}" text-anchor="middle" data-default=""></text></svg>`;
}

/* ---- change request projection: what items would look like if pending requests were approved */
function crProjection() {
  const pend = state.crs.filter((x) => CR_OPEN.has(x.status) && !x.applied_at && Array.isArray(x.changes) && x.changes.length);
  const byItem = new Map(), added = [];
  for (const cr of pend) for (const ch of cr.changes) { if (ch.item_id) byItem.set(ch.item_id, { ...ch, cr }); else if (ch.new_item) added.push({ ...ch, cr }); }
  return { pend, byItem, added };
}

/* ---- deliverables */
function filteredDeliverables() {
  const c = state.calc, f = state.filters, q = f.q.trim();
  return [...state.deliverables].filter((d) => {
    const k = c.del.get(d.id);
    if (f.item && d.item_id !== f.item) return false;
    if (f.exec && k.exec !== f.exec) return false;
    if (f.bill && k.bill !== f.bill) return false;
    if (k.cancelled && f.exec !== ST.CAN) return false;
    if (f.issue === "open" && !k.openIssues) return false;
    if (f.issue === "blocking" && !k.blocking) return false;
    if (f.issue === "cr" && !k.crs.length) return false;
    if (f.issue === "nosusp" && !k.suspendMissing) return false;
    if (q && !(`${d.id} ${d.description || ""} ${d.notes || ""} ${Object.values(billingOf(d)).join(" ")}`.includes(q))) return false;
    return true;
  }).sort(byId);
}

  const c = state.calc, f = state.filters, billingView = state.delView === "billing";
  const list = filteredDeliverables();
  const itemOpts = [...state.items].sort(byItemOrder).map((it) => `<option value="${esc(it.id)}"${f.item === it.id ? " selected" : ""}>${esc(itemLabel(it))} — ${esc(short(it.name, 40))}</option>`).join("");

    ${list.length ? `<div class="table-wrap tall"><table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>`

/* cumulative accepted / delivered share of the contract value, one point per month (the last point is the report end) */

    const t = Math.min(dn(next) - 1, end);

/* ---- PDF: lay the same content out on A4 pages (1000 × 1414 px), render each page and place it on a PDF page */
const PDF_LIBS = ["https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js", "https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"];
function loadScript(src) {
  return new Promise((res, rej) => {
    const had = document.querySelector(`script[src="${src}"]`);
    if (had && had.dataset.loaded) return res();
    const el = had || document.createElement("script");
    el.addEventListener("load", () => { el.dataset.loaded = "1"; res(); }, { once: true });
    el.addEventListener("error", () => rej(new Error("تعذّر تحميل مكتبة إنشاء PDF")), { once: true });
    if (!had) { el.src = src; document.head.appendChild(el); }
  });
}
function pdfPages(host, R) {
  const s = state.settings, { units } = reportModel(R), pages = [];
  const make = (html) => { const t = document.createElement("div"); t.innerHTML = html.trim(); return t.firstElementChild; };
  const cover = make(`<section class="rp rp-page rp-cpage"><i class="rp-glow a"></i><i class="rp-glow b"></i>
    <div class="rp-ctop">${rpLogos()}</div>
    <div class="rp-cmain"><span class="rp-eyebrow">التقرير الدوري لمتابعة العقد</span><h1>${esc(s.project_name || "متابعة عقد البوابة الموحدة")}</h1><i class="rp-grad"></i>
      <p>متابعة تنفيذ بنود العقد ومخرجاته، والمراجعة لدى العميل، والفوترة، والمشكلات وطلبات التغيير</p>
      <div class="rp-cfig"><div><strong>${pctTxt(R.end.tot.acceptedShare)}</strong><span>المقبول من قيمة العقد</span></div><div><strong>${pctTxt(R.end.tot.deliveredPct)}</strong><span>نسبة الإنجاز المسلَّم</span></div><div><strong>${R.openCycles.length}</strong><span>مخرجًا لدى العميل للمراجعة</span></div></div></div>
    <div class="rp-meta">${rpMeta(R)}</div></section>`);
  host.appendChild(cover); pages.push(cover);
  let content;
  const newPage = () => {
    const p = make(`<section class="rp rp-page"><i class="rp-glow c"></i>
      <header class="rp-phead"><div class="t"><span>التقرير الدوري · ${esc(arDate(R.from))} – ${esc(arDate(R.to))}</span><strong>${esc(s.project_name || "")}</strong></div><img src="${LOGO_TETCO}" alt="تطوير لتقنيات التعليم"></header>
      <div class="rp-pcontent"></div>
      <footer class="rp-pfoot"><span>${esc(s.project_name || "")}${s.contract_no ? ` · عقد رقم ${esc(s.contract_no)}` : ""}</span><span class="rp-pno"></span></footer></section>`);
    host.appendChild(p); pages.push(p); content = p.querySelector(".rp-pcontent");
  };
  const fits = () => content.scrollHeight <= content.clientHeight + 1;
  newPage();
  for (const html of units) {
    const unit = make(html);
    content.appendChild(unit);
    if (fits()) continue;
    const tb = unit.querySelector("tbody");
    if (unit.hasAttribute("data-split") && tb && tb.children.length > 1) {
      const rows = [...tb.children]; tb.innerHTML = "";
      const tpl = unit.cloneNode(true);
      const sh = tpl.querySelector(".rp-sh"), h3 = tpl.querySelector(".rp-h3");
      if (h3) { h3.textContent += " (تابع)"; sh?.remove(); }
      else if (sh) sh.outerHTML = `<h3 class="rp-h3">${esc(sh.querySelector("h2")?.textContent || "")} (تابع)</h3>`;
      let cur = unit, curTb = tb;
      for (const r of rows) {
        curTb.appendChild(r);
        if (fits()) continue;
        curTb.removeChild(r);
        if (!curTb.children.length) { cur.remove(); newPage(); content.appendChild(cur); curTb.appendChild(r); continue; }
        newPage(); cur = tpl.cloneNode(true); curTb = cur.querySelector("tbody"); content.appendChild(cur); curTb.appendChild(r);
      }
    } else if (content.children.length > 1) { unit.remove(); newPage(); content.appendChild(unit); }
  }
  pages.forEach((p, i) => { const n = p.querySelector(".rp-pno"); if (n) n.textContent = `${String(i + 1).padStart(2, "0")} / ${String(pages.length).padStart(2, "0")}`; });
  return pages;
}
// html2canvas loses the letter joining of an Arabic word that runs straight into digits or Latin letters ("مرحلة3");
// putting each side in its own span keeps both shaped, and the browser's layout (so the visual order) is unchanged
const AR_CH = "\u0621-\u065F\u066E-\u06D3\u06D5-\u06EF\u06FA-\u06FF\u0750-\u077F\uFB50-\uFDFF\uFE70-\uFEFF";
const NL_CH = "0-9A-Za-z\u0660-\u0669\u06F0-\u06F9";
const MIXED_RE = new RegExp(`[${AR_CH}][${NL_CH}]|[${NL_CH}][${AR_CH}]`);
const MIXED_SPLIT = new RegExp(`(?<=[${AR_CH}])(?=[${NL_CH}])|(?<=[${NL_CH}])(?=[${AR_CH}])`);
function isolateMixedWords(root) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), nodes = [];
  while (walker.nextNode()) if (MIXED_RE.test(walker.currentNode.data)) nodes.push(walker.currentNode);
  for (const n of nodes) {
    const frag = document.createDocumentFragment();
    for (const part of n.data.split(MIXED_SPLIT)) { const sp = document.createElement("span"); sp.textContent = part; frag.appendChild(sp); }
    n.replaceWith(frag);
  }
}
// lays pages out off screen with build(host) → page elements, renders each one and saves an A4 PDF
async function savePdf(btn, build, filename, landscape = false) {
  if (!state.downloads) { toast("التنزيل غير متاح في هذا العرض.", true); return; }
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = "جارٍ إنشاء PDF…";
  let host = null;
  try {
    await Promise.all(PDF_LIBS.map(loadScript));
    host = document.createElement("div");
    host.className = "rp-host" + (landscape ? " wide" : ""); host.setAttribute("aria-hidden", "true");
    document.body.appendChild(host);
    if (document.fonts?.ready) await document.fonts.ready;
    const pages = build(host);
    pages.forEach(isolateMixedWords);
    const [w, h] = landscape ? [297, 210] : [210, 297];
    const pdf = new window.jspdf.jsPDF({ orientation: landscape ? "l" : "p", unit: "mm", format: "a4", compress: true });
    for (let i = 0; i < pages.length; i++) {
      const canvas = await window.html2canvas(pages[i], { scale: 2, backgroundColor: "#ffffff", logging: false, useCORS: true });
      if (i) pdf.addPage();
      pdf.addImage(canvas.toDataURL("image/jpeg", 0.9), "JPEG", 0, 0, w, h, undefined, "FAST");
    }
    await state.downloads.save({ filename, data: pdf.output("blob") });
    toast("تم حفظ ملف PDF");
  } catch (e) {
    if (e?.code === "declined") toast("أُلغي التنزيل.");
    else toast(e?.code ? errText(e) : "تعذّر إنشاء ملف PDF: " + (e?.message || e), true);
  } finally { host?.remove(); btn.disabled = false; btn.textContent = label; }
}

function exportReportPdf(btn) {
  const R = buildReport();
  return savePdf(btn, (host) => pdfPages(host, R), `التقرير_الدوري_${R.from}_${R.to}.pdf`);
}

const shortDate = (t) => { if (!(t > 0)) return ""; const [y, m, d] = isoOf(t).split("-").map(Number); return `<span class="dt">${d}-${EN_MON[m - 1]}-${String(y).slice(2)}</span>`; };
function delayRows() {

  for (const it of [...state.items].sort(byItemOrder)) {
    const rows = state.deliverables.filter((d) => d.item_id === it.id && c.del.get(d.id)?.bill === ST.WAIT).sort(byId).map((d) => {
      const k = c.del.get(d.id), evs = state.events.filter((e) => e.deliverable === d.id && isIso(e.date));
      const pick = (a) => evs.filter((e) => e.action === a).map((e) => dn(e.date)).sort((x, y) => x - y);
      const subs = pick(ACT.SUB), reps = pick(ACT.REP);
      return { d, k, first: subs[0], reps, resubs: subs.slice(1) };
    });
    if (rows.length) groups.push({ it, rows });
  }
  return groups;
}
function delayPages(host) {
  const s = state.settings, groups = delayRows(), c = state.calc;
  const pairs = Math.max(3, ...groups.flatMap((g) => g.rows.map((r) => Math.max(r.reps.length, r.resubs.length))));
  const head = `<tr><th class="it">البنود</th><th class="ds">المخرجات الأساسية</th><th>الحالة التنفيذية للمخرج</th><th>تاريخ التسليم</th>
    ${Array.from({ length: pairs }, (_, i) => `<th>تاريخ الرد بملاحظة إن وجد ${i + 1}</th><th>تاريخ إعادة التسليم ${i + 1}</th>`).join("")}
    <th>تاريخ القبول</th><th>عدد أيام المراجعة</th><th>عدد أيام التأخير في القبول</th><th class="why">ملاحظات / مرئيات / سبب تأخير القبول</th></tr>`;
  const rowHtml = (r, itemCell) => `<tr>${itemCell}<td class="ds">${esc(r.d.description)}</td><td class="pk st">${esc(ST.WAIT)}</td><td>${shortDate(r.first)}</td>
    ${Array.from({ length: pairs }, (_, i) => `<td>${shortDate(r.reps[i])}</td><td>${shortDate(r.resubs[i])}</td>`).join("")}
    <td>${shortDate(r.k.accepted)}</td><td class="pk dd">${r.k.review}</td><td class="pk dd">${r.k.delay}</td><td class="why">${esc(r.d.delay_reason || "")}</td></tr>`;
  const groupHtml = (g, rows) => `<tbody class="grp">${rows.map((r, i) => rowHtml(r, i ? "" : `<td class="it" rowspan="${rows.length}">${esc(g.it.name)}</td>`)).join("")}</tbody>`;
  const pages = [];
  let table, content;
  const make = (html) => { const t = document.createElement("div"); t.innerHTML = html.trim(); return t.firstElementChild; };
  const newPage = () => {
    const p = make(`<section class="rp rp-page wide dl-page">
      <header class="rp-phead"><div class="t"><strong>تقرير متابعة التأخير في قبول المخرجات</strong><span>${esc(s.project_name || "")}${s.contract_no ? ` · عقد رقم ${esc(s.contract_no)}` : ""} · حتى ${esc(arDate(c.asOfIso))} · مهلة المراجعة ${c.reviewLimit} أيام عمل</span></div><img src="${LOGO_TETCO}" alt="تطوير لتقنيات التعليم"></header>
      <div class="rp-pcontent"><table class="dl-t"><thead>${head}</thead></table></div>
      <footer class="rp-pfoot"><span>أيام المراجعة والتأخير أيام عمل، دون الإجازة الأسبوعية والإجازات الرسمية</span><span class="rp-pno"></span></footer></section>`);
    host.appendChild(p); pages.push(p); content = p.querySelector(".rp-pcontent"); table = p.querySelector("table");
  };
  const fits = () => content.scrollHeight <= content.clientHeight + 1;
  newPage();
  if (!groups.length) content.insertAdjacentHTML("beforeend", `<div class="rp-empty">لا توجد مخرجات في انتظار القبول.</div>`);
  for (const g of groups) {
    let rest = g.rows;
    while (rest.length) {
      let n = rest.length, body = null;
      for (; n > 0; n--) { body = make(`<table>${groupHtml(g, rest.slice(0, n))}</table>`).querySelector("tbody"); table.appendChild(body); if (fits()) break; body.remove(); body = null; }
      if (!n) { if (table.tBodies.length) { newPage(); continue; } n = 1; table.appendChild(make(`<table>${groupHtml(g, rest.slice(0, 1))}</table>`).querySelector("tbody")); }
      rest = rest.slice(n);
      if (rest.length) newPage();
    }
  }
  pages.forEach((p, i) => { p.querySelector(".rp-pno").textContent = `${String(i + 1).padStart(2, "0")} / ${String(pages.length).padStart(2, "0")}`; });
  return pages;
}

async function applyCr(cr, btn) {
  if (!cr || cr.applied_at) return false;
  const db = state.db, today = todayIso(), p = cr.plan || {};
  const strip = (o) => { const { id: _omit, ...rest } = o; return rest; };
  return run(btn, async () => {
    let newItemId = null;
    for (const ch of cr.changes || []) {
      if (ch.item_id) {
        const it = state.items.find((x) => x.id === ch.item_id); if (!it) continue;
        await db.collection("items").doc(it.id).set({ ...strip(it), name: ch.name_after || it.name, qty: numOr(ch.qty_after, it.qty), unit_price: numOr(ch.price_after, it.unit_price) });
      } else if (ch.new_item) {
        newItemId = newId("i");
        await db.collection("items").doc(newItemId).set(clean({ no: ch.new_item.no, wbs: ch.new_item.wbs, name: ch.new_item.name, qty: numOr(ch.qty_after, 0), unit_price: numOr(ch.price_after, 0), order: ch.new_item.order ?? state.items.length + 1 }));
      }
    }
    const patches = new Map(), patch = (id, x) => patches.set(id, { ...(patches.get(id) || {}), ...x });
    for (const id of p.cancel || []) patch(id, { cancelled: true, cancel_cr: cr.id, cancel_date: today });
    for (const r of p.rename || []) patch(r.id, { description: r.description });
    for (const id of p.resume || []) patch(id, { work_status: ST.PROG, resume: true });
    for (const [id, x] of patches) {
      const d = state.deliverables.find((y) => y.id === id); if (!d) continue;
      const body = { ...strip(d), ...x };
      if (body.resume) { for (const k of ["resume", "suspend_reason", "suspend_date", "suspend_cr", "suspend_cr_linked"]) delete body[k]; }
      await db.collection("deliverables").doc(id).set(body);
    }
    let max = Math.max(0, ...state.deliverables.map((d) => /^D-(\d+)$/.exec(d.id)).filter(Boolean).map((m) => Number(m[1])));
    const created = [];
    for (const a of p.add || []) {
      const itemId = a.item_id === "new" ? newItemId : a.item_id; if (!itemId) continue;
      for (let n = 0; n < a.count; n++) {
        const id = "D-" + String(++max).padStart(3, "0");
        await db.collection("deliverables").doc(id).set({ item_id: itemId, description: String(a.description || "").replace("{n}", String((a.start || 1) + n)), work_status: ST.NEW, cr_origin: cr.id });
        created.push(id);
      }
    }
    if (cr.extend_months) await db.doc("contract/settings").set({ ...state.settings, duration_months: numOr(state.settings.duration_months, 0) + Number(cr.extend_months) });
    await db.collection("crs").doc(cr.id).set({ ...strip(cr), status: "معتمد", decision_date: cr.decision_date || today, applied_at: today, applied: { created, new_item: newItemId } });
  }, "تم تطبيق طلب التغيير");
}

    ], state.crs.flatMap((x) => (x.changes || []).map((ch) => { const it = ch.item_id ? c.itemsById.get(ch.item_id) : null; const qB = numOr(ch.qty_before, 0), qA = numOr(ch.qty_after, 0), pB = numOr(ch.price_before, 0), pA = numOr(ch.price_after, 0);
      return { code: x.code, status: x.status, no: it ? it.no : ch.new_item?.no, nameB: ch.name_before || it?.name || null, nameA: ch.name_after || ch.name_before || it?.name || ch.new_item?.name, qB, qA, pB, pA, tB: qB * pB, tA: qA * pA, diff: qA * pA - qB * pB, scope: ch.scope }; })));
    addSheet(wb, "الإجازات", [{ h: "التاريخ", k: "date", w: 14, f: FMT.D }, { h: "المناسبة", k: "name", w: 30 }, { h: "ملاحظة", k: "note", w: 20 }],
      [...(s.holidays || [])].sort((a, b) => String(a.date).localeCompare(String(b.date))).map((h) => ({ date: toDate(h.date), name: h.name, note: h.note })));
    return [wb, `متابعة_عقد_البوابة_${c.asOfIso}.xlsx`];
  });
}

function exportReport(btn) {
  return withExcel(btn, async () => {
    const R = buildReport(), e = R.end, s = state.settings, t = e.tot;
    const wb = new ExcelJS.Workbook();
    kvSheet(wb, "ملخص التقرير", [
      ["المشروع", s.project_name], ["رقم العقد", s.contract_no], ["من", toDate(R.from)], ["إلى", toDate(R.to)],
      ["إجمالي المقبول (%)", { v: t.acceptedShare, f: FMT.P }], ["إجمالي المقبول (ريال)", { v: t.acceptedValue, f: FMT.M }],
      ["إجمالي في انتظار القبول (%)", { v: t.waitingShare, f: FMT.P }], ["إجمالي في انتظار القبول (ريال)", { v: t.waitingValue, f: FMT.M }],
      ["نسبة الإنجاز (المقبول ÷ الإجمالي)", { v: t.progress, f: FMT.P }], ["نسبة الإنجاز المسلَّم", { v: t.deliveredPct, f: FMT.P }], ["نسبة الإنجاز الفعلي", { v: t.actual, f: FMT.P }],
      ["في انتظار رد العميل", R.openCycles.length], ["منها تجاوزت المهلة", R.overLimit.length], ["مُعادة بملاحظات", e.statusCounts[ST.RET]],
      ["تسليمات خلال الفترة", R.submitted.length], ["ردود بملاحظات خلال الفترة", R.returned.length], ["قبول خلال الفترة", R.accepted.length],
      ["قيمة المقبول خلال الفترة (ريال)", { v: R.acceptedValue, f: FMT.M }], ["مشكلات فُتحت", R.issuesOpened.length], ["مشكلات أُغلقت", R.issuesClosed.length],
      [BLOCKING, R.blockingOpen.length], ["طلبات تغيير مفتوحة", R.crsOpen.length],
    ]);
    const delCols = (extra) => [{ h: "رقم المخرج", k: "id", w: 10 }, { h: "رقم البند", k: "item", w: 8 }, { h: "وصف المخرج", k: "desc", w: 46, wrap: true }, ...extra];
    const base = (d) => ({ id: d.id, item: e.itemsById.get(d.item_id)?.no, desc: d.description });
    addSheet(wb, "المقبولة", delCols([{ h: "تاريخ القبول", k: "date", w: 12, f: FMT.D }, { h: "القيمة (ريال)", k: "value", w: 15, f: FMT.M }, { h: "أيام المراجعة", k: "review", w: 10 }, { h: "أيام التأخير", k: "delay", w: 10 }]),
      R.accepted.map((x) => ({ ...base(x.d), date: toDate(x.e.date), value: x.k.value, review: x.k.review, delay: x.k.delay })));
    addSheet(wb, "المسلَّمة", delCols([{ h: "تاريخ التسليم", k: "date", w: 12, f: FMT.D }, { h: "رقم الدورة", k: "cycle", w: 9 }]),
      R.submitted.map((x) => ({ ...base(x.d), date: toDate(x.e.date), cycle: x.x?.cycle })));
    addSheet(wb, "المُعادة بملاحظات", delCols([{ h: "تاريخ الرد", k: "date", w: 12, f: FMT.D }, { h: "ملاحظات", k: "notes", w: 34, wrap: true }]),
      R.returned.map((x) => ({ ...base(x.d), date: toDate(x.e.date), notes: x.e.notes })));
    addSheet(wb, "في انتظار الرد", delCols([{ h: "تاريخ التسليم", k: "date", w: 12, f: FMT.D }, { h: "أيام المراجعة", k: "review", w: 10 }, { h: "أيام التأخير", k: "delay", w: 10 }]),
      R.openCycles.map((x) => ({ ...base(x.d), date: numD(x.k.openCycle.start), review: x.k.openCycle.review, delay: x.k.openCycle.delay })));
    addSheet(wb, "المشكلات والقرارات", ISSUE_COLS, issuesSheetRows([...new Set([...R.blockingOpen, ...R.issuesOpened, ...R.issuesClosed])], e));
    addSheet(wb, "طلبات التغيير", CR_COLS, crSheetRows([...new Set([...R.crsOpen, ...R.crsTouched])], e));
    return [wb, `تقرير_متابعة_${R.from}_${R.to}.xlsx`];
  });
}

/* ------------------------------------------------------------ events */
function setTab(tab) {
  if (!TAB_KEYS.includes(tab)) tab = "dashboard";
  state.tab = tab;
  try { localStorage.setItem("tab", tab); } catch (_) {}
  if (location.hash !== "#" + tab) history.replaceState(null, "", "#" + tab);
  render();
  window.scrollTo(0, 0);
}

document.addEventListener("click", async (ev) => {
  if (ev.target.closest("input, select, textarea, label") && !ev.target.closest("button")) return;
  const t = ev.target.closest("button, tr, .card, path[data-filter-exec], path[data-filter-bill], [data-close]");
  if (!t) return;
  const ds = t.dataset;
  if (ds.tab) return setTab(ds.tab);
  if ("close" in ds) return closeDrawer();
  if (ds.go) return setTab(ds.go);
  if (ds.filterExec || ds.filterBill) { state.filters = { q: "", item: "", exec: ds.filterExec || "", bill: ds.filterBill || "", issue: "" }; return setTab("deliverables"); }
  if (ds.delview) { state.delView = ds.delview; return render(); }
  if (ds.rmItem) return openDrawer({ kind: "item", id: ds.rmItem, confirm: true });
  if (ds.rmDel) return openDrawer({ kind: "del", id: ds.rmDel, sub: "info", confirm: true });
  if (ds.editEv) return openDrawer({ kind: "ev", id: ds.editEv });
  if (ds.rmEv) return openDrawer({ kind: "ev", id: ds.rmEv, confirm: true });
  if (ds.rmIssue) return openDrawer({ kind: "issue", id: ds.rmIssue, confirmIssue: ds.rmIssue });
  if (ds.rmCr) return openDrawer({ kind: "cr", id: ds.rmCr, confirm: true });
  if ("newItem" in ds) return openDrawer({ kind: "item" });
  if (ds.editItem) return openDrawer({ kind: "item", id: ds.editItem });
  if ("newDel" in ds) return openDrawer({ kind: "delForm" });
  if (ds.editDel) return openDrawer({ kind: "del", id: ds.editDel, sub: "info" });
  if (ds.openDel) return openDrawer({ kind: "del", id: ds.openDel, sub: ds.sub || "info" });
  if (ds.subTab) { Object.assign(state.drawer, { sub: ds.subTab, editIssue: null, confirm: false, confirmEv: null, confirmIssue: null }); return renderDrawer(); }
  if ("newEv" in ds) return openDrawer({ kind: "ev" });
  if ("newIssue" in ds) return openDrawer({ kind: "issue" });
  if (ds.editIssue) {
    if (state.drawer?.kind === "del") { state.drawer.editIssue = ds.editIssue; renderDrawer(); document.querySelector(".drawer-body").scrollTop = 0; return; }
    return openDrawer({ kind: "issue", id: ds.editIssue });
  }
  if ("cancelIssue" in ds) { if (state.drawer?.kind === "del") { state.drawer.editIssue = null; return renderDrawer(); } return closeDrawer(); }
  if (ds.closeIssue) return setIssueStatus(ds.closeIssue, true, t);
  if (ds.reopenIssue) return setIssueStatus(ds.reopenIssue, false, t);
  if (ds.askDelIssue) { state.drawer.confirmIssue = ds.askDelIssue; return renderDrawer(); }
  if ("newCr" in ds) return openDrawer({ kind: "cr" });
  if (ds.editCr) return openDrawer({ kind: "cr", id: ds.editCr });
  if ("askDelete" in ds) { state.drawer.confirm = true; return renderDrawer(); }
  if ("askApply" in ds) { state.drawer.confirmApply = true; return renderDrawer(); }
  if (ds.delEv) { state.drawer.confirmEv = ds.delEv; return renderDrawer(); }
  if ("cancelConfirm" in ds) { Object.assign(state.drawer, { confirm: false, confirmEv: null, confirmIssue: null, confirmApply: false }); return renderDrawer(); }
  if (ds.confirm) {
    const d = state.drawer;
    if (ds.confirm === "apply") { if (await applyCr(state.crs.find((x) => x.id === d.id), t)) closeDrawer(); return; }
    if (ds.confirm === "item") { if (await run(t, () => state.db.collection("items").doc(d.id).delete(), "تم حذف البند")) closeDrawer(); }
    else if (ds.confirm === "cr") { if (await run(t, () => state.db.collection("crs").doc(d.id).delete(), "تم حذف طلب التغيير")) closeDrawer(); }
    else if (ds.confirm === "del") {
      const evs = state.events.filter((e) => e.deliverable === d.id), iss = state.issues.filter((i) => i.deliverable === d.id);
      if (await run(t, async () => {
        for (const e of evs) await state.db.collection("events").doc(e.id).delete();
        for (const i of iss) await state.db.collection("issues").doc(i.id).delete();
        await state.db.collection("deliverables").doc(d.id).delete();
      }, "تم حذف المخرج")) closeDrawer();
    } else if (ds.confirm.startsWith("ev:")) {
      if (await run(t, () => state.db.collection("events").doc(ds.confirm.slice(3)).delete(), "تم حذف الحركة")) { if (d.kind === "ev") closeDrawer(); else { d.confirmEv = null; renderDrawer(); } }
    } else if (ds.confirm.startsWith("issue:")) {
      if (await run(t, () => state.db.collection("issues").doc(ds.confirm.slice(6)).delete(), "تم الحذف")) { if (d.kind === "issue") closeDrawer(); else { d.confirmIssue = null; d.editIssue = null; renderDrawer(); } }
    }
    return;
  }
  if (ds.editHol !== undefined) { state.holEdit = Number(ds.editHol); render(); document.getElementById("hDate")?.focus(); return; }
  if ("cancelHol" in ds) { state.holEdit = null; return render(); }
  if (ds.delHol !== undefined) {
    state.holEdit = null;
    const i = Number(ds.delHol); const list = (state.settings.holidays || []).filter((_, j) => j !== i);
    return saveHolidays(list, t, "تم حذف الإجازة");
  }
  if (t.id === "themeToggle" || t.id === "themeToggleM") return applyTheme(currentTheme() === "dark" ? "light" : "dark", true);
  if (t.id === "exportBtn") return exportAll(t);
  if (t.id === "reportExport") return exportReport(t);
  if (t.id === "reportPdf") return exportReportPdf(t);
  if (t.id === "delayPdf") return exportDelayPdf(t);
  if (t.id === "reportCopy") {
    const text = reportText(buildReport());
    try { await navigator.clipboard.writeText(text); toast("نُسخ التقرير؛ يمكنك لصقه في البريد أو الرسالة"); }
    catch (_) {
      const box = document.getElementById("copyFallback");
      box.innerHTML = `<textarea class="copybox" readonly aria-label="نص التقرير">${esc(text)}</textarea>`;
      const ta = box.querySelector("textarea"); ta.focus(); ta.select();
      toast("تعذّر النسخ التلقائي؛ النص محدد، اضغط Ctrl+C");
    }
  }
});

document.addEventListener("submit", (ev) => {
  ev.preventDefault();
  const form = ev.target, btn = form.querySelector('button[type="submit"]');
  const fid = form.getAttribute("id"); // not form.id: a field named "id" would shadow it
  if (fid === "itemForm") return saveItem(form, btn);
  if (fid === "delForm") return saveDeliverable(form, btn);
  if (fid === "delInfoForm") return saveDelInfo(form, btn);
  if (fid === "billingForm") return saveBilling(form, btn);
  if (fid === "evForm") return state.drawer?.id ? saveEventEdit(form, btn) : addEvent(form, btn);
  if (fid === "quickEv") return addEvent(form, btn, state.drawer.id);
  if (fid === "issueForm") return saveIssue(form, btn);
  if (fid === "crForm") return saveCr(form, btn);
  if (fid === "settingsForm") return saveSettings(form, btn);
  if (fid === "holForm") {
    const date = form.querySelector("#hDate").value, name = form.querySelector("#hName").value.trim(), note = form.querySelector("#hNote").value.trim();
    if (!isIso(date) || !name) return toast("أدخل التاريخ والمناسبة.", true);
    const all = state.settings.holidays || [], at = Number.isInteger(state.holEdit) ? state.holEdit : -1;
    if (all.some((h, j) => j !== at && h.date === date)) return toast("هذا التاريخ مسجل من قبل.", true);
    if (at >= 0) { state.holEdit = null; return saveHolidays(all.map((h, j) => (j === at ? clean({ date, name, note }) : h)), btn, "تم تعديل الإجازة"); }
    return saveHolidays([...all, clean({ date, name, note })], btn, "تمت إضافة الإجازة");
  }
});

/* chart hover: a tooltip near the pointer and the value in the chart's centre */
const chartTip = document.createElement("div");
chartTip.className = "chart-tip"; chartTip.hidden = true; chartTip.setAttribute("role", "tooltip");
document.body.appendChild(chartTip);
function setCenter(svg, v, l) {
  const cv = svg?.querySelector(".c-v"), cl = svg?.querySelector(".c-l");
  if (cv) cv.textContent = v ?? cv.dataset.default; if (cl) cl.textContent = l ?? cl.dataset.default;
}
document.addEventListener("mouseover", (ev) => {
  const el = ev.target.closest && ev.target.closest("[data-tip-title]");
  if (!el) return;
  const svg = el.closest("svg");
  svg?.querySelectorAll(".on").forEach((x) => x.classList.remove("on"));
  el.classList.add("on");
  setCenter(svg, el.dataset.centerV, el.dataset.centerL);
  const amt = el.dataset.tipAmt !== undefined && el.dataset.tipAmt !== "" ? Number(el.dataset.tipAmt) : null;
  chartTip.innerHTML = `<strong>${esc(el.dataset.tipTitle)}</strong><span class="big num">${esc(el.dataset.tipPct)}</span>${amt !== null ? `<span>${sar(amt)}</span>` : ""}${el.dataset.tipSub ? `<span>${esc(el.dataset.tipSub)}</span>` : ""}`;
  chartTip.hidden = false;
});
document.addEventListener("mousemove", (ev) => { if (!chartTip.hidden) { chartTip.style.left = ev.clientX + "px"; chartTip.style.top = ev.clientY + "px"; } });
document.addEventListener("mouseout", (ev) => {
  const el = ev.target.closest && ev.target.closest("[data-tip-title]");
  if (!el || (ev.relatedTarget && el.contains(ev.relatedTarget))) return;
  el.classList.remove("on");
  setCenter(el.closest("svg"));
  chartTip.hidden = true;
});

let inputTimer;
const SEARCH = { fQ: (v) => (state.filters.q = v), lQ: (v) => (state.logFilters.q = v), iQ: (v) => (state.issueFilters.q = v) };
document.addEventListener("input", (ev) => {
  const id = ev.target.id;
  if (!SEARCH[id]) return;
  clearTimeout(inputTimer);
  inputTimer = setTimeout(() => {
    SEARCH[id](ev.target.value);
    const pos = ev.target.selectionStart;
    render();
    const el = document.getElementById(id); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (_) {} }
  }, 200);
});
document.addEventListener("change", (ev) => {
  const el = ev.target, id = el.id;
  const set = { fItem: () => (state.filters.item = el.value), fExec: () => (state.filters.exec = el.value), fBill: () => (state.filters.bill = el.value), fIssue: () => (state.filters.issue = el.value),
    lAction: () => (state.logFilters.action = el.value), iState: () => (state.issueFilters.state = el.value), iType: () => (state.issueFilters.type = el.value),
    rPreset: () => { const [a, b] = reportRange(); state.report.preset = el.value; if (el.value === "custom") { state.report.from = a; state.report.to = b; } },
    rFrom: () => { const [, b] = reportRange(); state.report = { preset: "custom", from: el.value, to: b }; },
    rTo: () => { const [a] = reportRange(); state.report = { preset: "custom", from: a, to: el.value }; } };
  if (set[id]) { set[id](); return render(); }
  if (id === "dSuspLinked") { const box = document.getElementById("suspCrPick"); if (box) box.hidden = !el.checked; return; }
  if (id === "dWork") { const box = document.getElementById("suspFields"); if (box) box.hidden = el.value !== ST.SUS; const done = document.getElementById("doneFields"); if (done) done.hidden = el.value !== ST.DONE; return; }
  if (el.name === "critem") {
    const form = el.form, items = [...form.querySelectorAll('input[name="critem"]:checked')].map((x) => x.value);
    const sel = [...form.querySelectorAll('input[name="crdel"]:checked')].map((x) => x.value);
    document.getElementById("crDels").innerHTML = crDelChecks(items, sel);
  }
});
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape" && state.drawer) closeDrawer();
  if (ev.key === "Enter" && ev.target.matches("tr.clickable")) ev.target.click();
});
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (TAB_KEYS.includes(h) && h !== state.tab) setTab(h); });

/* ------------------------------------------------------------ boot */
(function initTab() {
  let tab = location.hash.slice(1);
  if (!TAB_KEYS.includes(tab)) { try { tab = localStorage.getItem("tab") || ""; } catch (_) { tab = ""; } }
  state.tab = TAB_KEYS.includes(tab) ? tab : "dashboard";
})();
render();

let scheduled = false;
function scheduleRender() {
  if (scheduled) return; scheduled = true;
  requestAnimationFrame(() => {
    scheduled = false;
    // a snapshot arriving while the user types in the drawer must not wipe the form
    const active = document.activeElement;
    if (state.drawer && active && active.closest(".drawer") && active.matches("input, textarea, select")) { compute(); return; }
    render();
  });
}

async function boot() {
  const api = window.claude;
  if (!api || typeof api.use !== "function") { state.offline = true; render(); return; }
  const [db, downloads] = await Promise.all([api.use("db").catch(() => null), api.use("downloads").catch(() => null)]);
  state.downloads = downloads;
  if (!downloads) document.getElementById("exportBtn").hidden = true;
  if (!db) { state.offline = true; render(); return; }
  state.db = db;
  const onErr = (e) => { if (e?.code !== "unavailable") toast(errText(e), true); };
  db.doc("contract/settings").onSnapshot((snap) => {
    state.settings = { ...DEFAULT_SETTINGS, ...(snap.exists ? snap.data() : {}) };
    state.ready.settings = true; scheduleRender();
  }, onErr);
  for (const name of COLLECTIONS) db.collection(name).onSnapshot((snap) => {
    state[name] = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    state.ready[name] = true; scheduleRender();
  }, onErr);
}
boot();
})();
</script>
