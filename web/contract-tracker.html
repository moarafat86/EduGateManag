<style>
/* Layout: a contract ledger. Sticky header + tab rail, then one working surface per tab; tables scroll inside their own frame. */
:root {
  --bg: #F2F5F4;
  --surface: #FFFFFF;
  --surface-2: #F7F9F8;
  --ink: #13262B;
  --muted: #5A6B70;
  --line: #D8E0DF;
  --accent: #1F5C6B;
  --accent-ink: #FFFFFF;
  --accent-soft: #E2EDEF;
  --focus: #2F8AA0;
  --danger: #A4262C;
  --danger-soft: #FBE7E8;
  --actual: #6B5BA8;

  --st-acc-bg: #DCF1E2; --st-acc-fg: #17643A; --st-acc: #2E8B57;
  --st-wait-bg: #DDEAF7; --st-wait-fg: #1F4E78; --st-wait: #3A73B0;
  --st-ret-bg: #FBE5D5; --st-ret-fg: #8A3D0E; --st-ret: #D27530;
  --st-late-bg: #FBDCDF; --st-late-fg: #9C1C26; --st-late: #C8323F;
  --st-prog-bg: #FBF0CC; --st-prog-fg: #6F5600; --st-prog: #C9A21E;
  --st-sus-bg: #E3E6E6; --st-sus-fg: #3F4A4C; --st-sus: #8A9497;
  --st-new-bg: #EEF1F1; --st-new-fg: #5A6B70; --st-new: #C3CBCB;

  --font-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --font-display: "Readex Pro", "IBM Plex Sans Arabic", "Segoe UI", sans-serif;
  --radius: 6px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1618; --surface: #152024; --surface-2: #1A272B; --ink: #E3ECEB; --muted: #93A5A8;
    --line: #283A3E; --accent: #62B4C5; --accent-ink: #0E1618; --accent-soft: #1C343A; --focus: #8FD0DD;
    --danger: #F08A90; --danger-soft: #3A1E21; --actual: #A898E0;
    --st-acc-bg: #173527; --st-acc-fg: #8FDDAE; --st-acc: #4FB57C;
    --st-wait-bg: #182B40; --st-wait-fg: #A5C8EE; --st-wait: #5B93D1;
    --st-ret-bg: #3A2516; --st-ret-fg: #F4B788; --st-ret: #E08A48;
    --st-late-bg: #3D1B20; --st-late-fg: #F5A1A8; --st-late: #E0545F;
    --st-prog-bg: #352D10; --st-prog-fg: #EBCF6E; --st-prog: #CFAA2E;
    --st-sus-bg: #273134; --st-sus-fg: #B7C2C4; --st-sus: #7D8A8D;
    --st-new-bg: #1E2A2D; --st-new-fg: #93A5A8; --st-new: #44555A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1618; --surface: #152024; --surface-2: #1A272B; --ink: #E3ECEB; --muted: #93A5A8;
  --line: #283A3E; --accent: #62B4C5; --accent-ink: #0E1618; --accent-soft: #1C343A; --focus: #8FD0DD;
  --danger: #F08A90; --danger-soft: #3A1E21; --actual: #A898E0;
  --st-acc-bg: #173527; --st-acc-fg: #8FDDAE; --st-acc: #4FB57C;
  --st-wait-bg: #182B40; --st-wait-fg: #A5C8EE; --st-wait: #5B93D1;
  --st-ret-bg: #3A2516; --st-ret-fg: #F4B788; --st-ret: #E08A48;
  --st-late-bg: #3D1B20; --st-late-fg: #F5A1A8; --st-late: #E0545F;
  --st-prog-bg: #352D10; --st-prog-fg: #EBCF6E; --st-prog: #CFAA2E;
  --st-sus-bg: #273134; --st-sus-fg: #B7C2C4; --st-sus: #7D8A8D;
  --st-new-bg: #1E2A2D; --st-new-fg: #93A5A8; --st-new: #44555A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { direction: rtl; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font-body); font-size: 14px; line-height: 1.6; }
.num, .date, .code { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; display: inline-block; }
.date { white-space: nowrap; }
.code { font-weight: 600; letter-spacing: .02em; }
.sar { width: .82em; height: .92em; vertical-align: -0.08em; margin-inline-end: .28em; fill: currentColor; flex: none; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-inner { max-width: 1400px; margin: 0 auto; padding: 12px 16px 0; display: flex; flex-direction: column; gap: 10px; }
.title-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; justify-content: space-between; }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand h1 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 1.25rem; text-wrap: balance; }
.brand .meta { color: var(--muted); font-size: .82rem; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 12px 9px; cursor: pointer; color: var(--muted); font-weight: 500; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.tabs button:hover { color: var(--ink); }
.tabs .badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-inline-start: 4px; border-radius: 9px; background: var(--st-late-bg); color: var(--st-late-fg); font-size: .72rem; font-weight: 700; line-height: 18px; text-align: center; }

main { max-width: 1400px; margin: 0 auto; padding: 20px 16px 48px; display: flex; flex-direction: column; gap: 20px; }

/* buttons & inputs */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 6px 14px; border-radius: var(--radius); cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--danger); border-color: var(--danger); background: var(--surface); }
.btn.danger.solid { background: var(--danger); color: var(--surface); }
.btn:disabled { opacity: .55; cursor: progress; }
.btn.small { padding: 3px 10px; font-size: .85rem; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label, .field .label { font-size: .82rem; color: var(--muted); font-weight: 500; }
.field input, .field select, .field textarea, .filters input, .filters select {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 7px 10px; width: 100%; min-width: 0;
}
.field textarea { resize: vertical; min-height: 70px; }
.field .hint { font-size: .78rem; color: var(--muted); }
.check { display: flex; align-items: center; gap: 8px; font-weight: 500; cursor: pointer; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); }
.checks { display: flex; flex-wrap: wrap; gap: 6px 16px; max-height: 220px; overflow-y: auto; border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; }
.checks .check { font-weight: 400; font-size: .88rem; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.form-grid .wide { grid-column: 1 / -1; }
.form-group { grid-column: 1 / -1; font-weight: 600; font-size: .9rem; padding-top: 6px; border-top: 1px solid var(--line); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.seg button { background: var(--surface); border: 0; padding: 5px 14px; cursor: pointer; color: var(--muted); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

/* sections */
.section { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.section-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
.section-head h2 { margin: 0; font-family: var(--font-display); font-size: 1.05rem; font-weight: 600; }
.section-head .sub { color: var(--muted); font-size: .85rem; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 20px; }

/* KPI tiles */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi .label { color: var(--muted); font-size: .82rem; font-weight: 500; }
.kpi .value { font-family: var(--font-display); font-size: 1.5rem; font-weight: 600; line-height: 1.3; display: flex; align-items: baseline; flex-wrap: wrap; gap: 0 10px; }
.kpi .value .amt { font-size: .62em; color: var(--muted); font-weight: 500; }
.kpi .foot { color: var(--muted); font-size: .8rem; }
.kpi .meter { height: 6px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; margin-top: 6px; }
.kpi .meter span { display: block; height: 100%; }
.kpi.wait .value { color: var(--st-wait-fg); }
.kpi.acc .value { color: var(--st-acc-fg); }

/* status */
.pill { display: inline-block; padding: 1px 10px; border-radius: 999px; font-size: .8rem; font-weight: 600; white-space: nowrap; }
.s-acc { background: var(--st-acc-bg); color: var(--st-acc-fg); }
.s-wait { background: var(--st-wait-bg); color: var(--st-wait-fg); }
.s-ret { background: var(--st-ret-bg); color: var(--st-ret-fg); }
.s-late { background: var(--st-late-bg); color: var(--st-late-fg); }
.s-prog { background: var(--st-prog-bg); color: var(--st-prog-fg); }
.s-sus { background: var(--st-sus-bg); color: var(--st-sus-fg); }
.s-new { background: var(--st-new-bg); color: var(--st-new-fg); }
.flag { display: inline-flex; align-items: center; gap: 4px; padding: 0 8px; border-radius: 999px; font-size: .76rem; font-weight: 700; white-space: nowrap; background: var(--st-late-bg); color: var(--st-late-fg); }
.flag.soft { background: var(--st-prog-bg); color: var(--st-prog-fg); }
.yes { color: var(--st-acc-fg); font-weight: 600; }
.no { color: var(--muted); }

/* donut */
.donut-wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 20px 28px; }
.donut { width: 220px; height: 220px; flex: none; max-width: 100%; }
.donut path { cursor: pointer; transition: opacity .15s; }
.donut path:hover { opacity: .82; }
.donut .total { font-family: var(--font-display); font-size: 30px; font-weight: 600; fill: var(--ink); }
.donut .total-lbl { font-size: 12px; fill: var(--muted); }
.legend { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1 1 200px; }
.legend button { background: none; border: 0; padding: 3px 0; cursor: pointer; display: grid; grid-template-columns: 12px 1fr auto auto; gap: 8px; align-items: center; text-align: start; font-size: .9rem; }
.legend button:hover .lbl { text-decoration: underline; }
.legend .sw { width: 12px; height: 12px; border-radius: 3px; }
.legend .share { color: var(--muted); font-size: .8rem; min-width: 46px; text-align: end; }

/* bars */
.mini-bar { display: inline-flex; width: 64px; height: 6px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 3px; overflow: hidden; vertical-align: middle; margin-inline-start: 8px; }
.mini-bar span { display: block; height: 100%; background: var(--st-acc); }
.mini-bar.del span { background: var(--st-wait); }
.mini-bar.act span { background: var(--actual); }

/* tables */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .88rem; }
th, td { padding: 8px 10px; text-align: start; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: var(--surface-2); color: var(--muted); font-weight: 600; font-size: .8rem; white-space: nowrap; position: sticky; top: 0; }
td.n, th.n { text-align: end; white-space: nowrap; }
td.c, th.c { text-align: center; }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:hover { background: var(--accent-soft); }
tfoot td { font-weight: 700; background: var(--surface-2); border-bottom: 0; }
td .desc { max-width: 420px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.red { color: var(--danger); font-weight: 700; }
.muted { color: var(--muted); }
.warn-cell { color: var(--danger); font-weight: 600; font-size: .82rem; }
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.filters input { width: auto; flex: 1 1 200px; }
.filters select { width: auto; flex: 0 1 190px; }
.count { color: var(--muted); font-size: .85rem; }

/* cards list (issues, crs) */
.cards { display: flex; flex-direction: column; gap: 10px; }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; background: var(--surface); }
.card.blocking { border-inline-start: 4px solid var(--st-late); }
.card.closed { opacity: .75; }
.card .head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.card .title { font-weight: 600; }
.card .meta { color: var(--muted); font-size: .8rem; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.card .body { white-space: pre-line; font-size: .9rem; }
.card .actions { margin-top: 2px; }
.card.clickable { cursor: pointer; }
.card.clickable:hover { border-color: var(--accent); }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgba(8, 20, 24, .45); z-index: 40; }
.drawer { position: fixed; inset-block: 0; inset-inline-start: 0; width: min(600px, 100%); background: var(--surface); z-index: 41; display: flex; flex-direction: column; border-inline-end: 1px solid var(--line); box-shadow: 0 0 40px rgba(0,0,0,.18); }
.drawer-head { display: flex; flex-direction: column; gap: 10px; padding: calc(14px + env(safe-area-inset-top, 0px)) 18px 0; border-bottom: 1px solid var(--line); }
.drawer-head .row1 { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.drawer-head h3 { margin: 0; font-family: var(--font-display); font-size: 1.05rem; font-weight: 600; min-width: 0; }
.drawer-head .tabs button { padding: 6px 10px 8px; }
.drawer-head.plain { padding-bottom: 14px; }
.drawer-body { padding: 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
.icon-btn { background: none; border: 1px solid var(--line); border-radius: var(--radius); width: 34px; height: 34px; cursor: pointer; font-size: 1.1rem; line-height: 1; flex: none; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 16px; }
.kv div { display: flex; flex-direction: column; min-width: 0; }
.kv .k { font-size: .78rem; color: var(--muted); }
.kv .v { font-weight: 600; overflow-wrap: anywhere; }
.confirm { border: 1px solid var(--danger); background: var(--danger-soft); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
h4 { margin: 0; font-size: .95rem; font-weight: 600; }
.block { display: flex; flex-direction: column; gap: 10px; }

/* timeline */
.timeline { display: flex; flex-direction: column; border-inline-start: 2px solid var(--line); margin-inline-start: 6px; }
.tl { position: relative; padding-block: 4px 14px; padding-inline-start: 18px; }
.tl::before { content: ""; position: absolute; inset-inline-start: -7px; top: 9px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--muted); }
.tl.sub::before { border-color: var(--st-wait); }
.tl.rep::before { border-color: var(--st-ret); }
.tl.acc::before { border-color: var(--st-acc); background: var(--st-acc); }
.tl .line1 { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.tl .what { font-weight: 600; }
.tl .info { color: var(--muted); font-size: .82rem; }
.tl .del-ev { margin-inline-start: auto; }

/* report */
.report-controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.report-controls .field { flex: 0 1 180px; }
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 10px; }
.stat { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; }
.stat .k { color: var(--muted); font-size: .8rem; }
.stat .v { font-family: var(--font-display); font-size: 1.3rem; font-weight: 600; }
.copybox { width: 100%; min-height: 160px; border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; background: var(--surface-2); }

/* misc */
.empty { text-align: center; padding: 28px 16px; color: var(--muted); display: flex; flex-direction: column; gap: 10px; align-items: center; }
.empty strong { color: var(--ink); font-size: 1.02rem; }
.notice { background: var(--danger-soft); color: var(--danger); border-radius: 8px; padding: 12px 16px; font-weight: 500; }
.toast { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); inset-inline-end: 18px; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; z-index: 60; font-weight: 500; max-width: calc(100% - 36px); }
.toast.err { background: var(--danger); color: var(--surface); }
.hol-add { display: grid; grid-template-columns: 160px 1fr 140px auto; gap: 10px; align-items: end; }
@media (max-width: 640px) { .hol-add { grid-template-columns: 1fr 1fr; } .kpi .value { font-size: 1.3rem; } .donut-wrap { justify-content: center; } }
@media (prefers-reduced-motion: no-preference) { .drawer { animation: slide .18s ease-out; } @keyframes slide { from { transform: translateX(24px); opacity: .6; } to { transform: none; opacity: 1; } } }
</style>

<script>
(() => {
"use strict";
document.documentElement.dir = "rtl";
document.documentElement.lang = "ar";

/* ------------------------------------------------------------ constants */

  { k: "certificate", label: "صدرت له شهادة إنجاز", yn: true },
  { k: "acceptance_form", label: "نموذج قبول مخرج جديد", yn: true },
  { k: "invoiced", label: "تمت فوترته", yn: true },
  { k: "invoice_no", label: "رقم الفاتورة" },
  { k: "ref_no", label: "رقم المطالبة السابقة" },
  { k: "claim_no", label: "رقم المطالبة الجديدة" },

];

/* ------------------------------------------------------------ calculations
   Same rules as the Excel workbook:
   - every "تسليم" opens a review cycle; it closes at the first reply/acceptance on or after it, or the next submission
   - review days = working days from the day after submission to the cycle end (weekend + holidays excluded)
   - delay = review days above the review limit, per cycle                                                     */
function computeModel(data, asOfIso) {
  const s = data.settings;
  const asOf = dn(asOfIso);
  const weekend = new Set((Array.isArray(s.weekend) ? s.weekend : [5, 6]).map(Number));
  const hol = new Set((s.holidays || []).map((h) => dn(h.date)).filter(Number.isFinite));
  const reviewLimit = numOr(s.review_days, 10);
  const vat = numOr(s.vat, 0.15);
  const workdays = (a, b) => { if (!(b >= a)) return 0; let c = 0; for (let d = a; d <= b; d++) if (!weekend.has((d + 4) % 7) && !hol.has(d)) c++; return c; };
  const span = (a, b) => Math.max(0, workdays(a, b) - 1);

  const itemsById = new Map(data.items.map((i) => [i.id, i]));
  const delById = new Map(data.deliverables.map((d) => [d.id, d]));
  const evBy = new Map();
  for (const e of data.events) {
    const t = dn(e.date);
    if (!e.deliverable || !Number.isFinite(t) || !ACTIONS.includes(e.action)) continue;
    if (!evBy.has(e.deliverable)) evBy.set(e.deliverable, []);
    evBy.get(e.deliverable).push({ ...e, t });
  }

  const ev = new Map();
  for (const e of data.events) {
    const c = { cycle: null, end: null, open: false, review: null, delay: null, vendorDays: null, vendorOpen: false, warn: "" };
    const t = dn(e.date), list = evBy.get(e.deliverable) || [];
    if (!e.deliverable) c.warn = "رقم المخرج ناقص";
    else if (!delById.has(e.deliverable)) c.warn = "رقم المخرج غير موجود";
    else if (!ACTIONS.includes(e.action)) c.warn = "نوع الحركة ناقص";
    else if (!Number.isFinite(t)) c.warn = "التاريخ ناقص";
    else if (t > asOf) c.warn = "التاريخ بعد تاريخ الاحتساب";
    else if (e.action !== ACT.SUB && !list.some((x) => x.action === ACT.SUB && x.t <= t)) c.warn = "لا يوجد تسليم سابق لهذه الحركة";

    if (Number.isFinite(t) && e.deliverable) {
      if (e.action === ACT.SUB) {
        c.cycle = list.filter((x) => x.action === ACT.SUB && x.t < t).length + 1;
        const ends = [
          ...list.filter((x) => x.action !== ACT.SUB && x.t >= t).map((x) => x.t),
          ...list.filter((x) => x.action === ACT.SUB && x.t > t).map((x) => x.t),
        ];
        c.open = ends.length === 0;
        c.end = c.open ? asOf : Math.min(...ends);
        c.review = span(t, c.end);
        c.delay = Math.max(0, c.review - reviewLimit);
      } else if (e.action === ACT.REP) {
        // time on the project team's side: from the reply until the resubmission
        const next = list.filter((x) => x.action === ACT.SUB && x.t >= t).map((x) => x.t);
        const accepted = list.some((x) => x.action === ACT.ACC && x.t >= t);
        if (next.length) c.vendorDays = span(t, Math.min(...next));
        else if (!accepted) { c.vendorDays = span(t, asOf); c.vendorOpen = true; }
      }
    }
    ev.set(e.id, c);
  }

  const issuesBy = new Map();
  for (const i of data.issues) { if (!issuesBy.has(i.deliverable)) issuesBy.set(i.deliverable, []); issuesBy.get(i.deliverable).push(i); }
  const crsByDel = new Map(), crsByItem = new Map();
  for (const cr of data.crs) {
    for (const id of cr.deliverables || []) { if (!crsByDel.has(id)) crsByDel.set(id, []); crsByDel.get(id).push(cr); }
    for (const id of cr.items || []) { if (!crsByItem.has(id)) crsByItem.set(id, []); crsByItem.get(id).push(cr); }
  }

  const del = new Map();
  for (const d of data.deliverables) {
    const list = evBy.get(d.id) || [];
    const pick = (a) => list.filter((x) => x.action === a).map((x) => x.t);
    const subs = pick(ACT.SUB), reps = pick(ACT.REP), accs = pick(ACT.ACC);
    const firstSubmit = subs.length ? Math.min(...subs) : 0;
    const lastSubmit = subs.length ? Math.max(...subs) : 0;
    const lastReply = reps.length ? Math.max(...reps) : 0;
    const accepted = accs.length ? Math.max(...accs) : 0;
    let status;
    if (accepted > 0) status = ST.ACC;
    else if (d.work_status === ST.SUS) status = ST.SUS;
    else if (lastReply > 0 && lastReply >= lastSubmit) status = ST.RET;
    else if (lastSubmit > 0) status = ST.WAIT;
    else status = WORK_STATUSES.includes(d.work_status) ? d.work_status : ST.NEW;

    let review = 0, delay = 0, vendorDays = 0, openCycle = null;
    for (const e of data.events) {
      if (e.deliverable !== d.id) continue;
      const c = ev.get(e.id);
      if (c.review !== null) { review += c.review; delay += c.delay; if (c.open) openCycle = { start: dn(e.date), review: c.review, delay: c.delay }; }
      if (c.vendorDays !== null) vendorDays += c.vendorDays;
    }
    const issues = issuesBy.get(d.id) || [];
    const openIssues = issues.filter((i) => i.status !== CLOSED);
    const item = itemsById.get(d.item_id);
    const value = item ? numOr(item.unit_price, 0) : 0;
    del.set(d.id, {
      firstSubmit, lastSubmit, lastReply, accepted, cycles: subs.length, status, review, delay, vendorDays, openCycle,
      value, valueVat: value * (1 + vat), openIssues: openIssues.length, blocking: openIssues.filter((i) => i.blocking).length,
      crs: crsByDel.get(d.id) || [], waitingSinceReply: status === ST.RET ? span(lastReply, asOf) : null,
    });
  }

  const items = new Map();
  const tot = { qty: 0, total: 0, vat: 0, totalVat: 0, registered: 0, delivered: 0, accepted: 0, waiting: 0, late: 0, acceptedValue: 0, deliveredValue: 0, waitingValue: 0, remaining: 0, actualWeighted: 0 };
  for (const it of data.items) {
    const ds = data.deliverables.filter((d) => d.item_id === it.id);
    const qty = numOr(it.qty, 0), price = numOr(it.unit_price, 0), total = qty * price;
    const k = (d) => del.get(d.id);
    const r = {
      qty, price, total, vat: total * vat, totalVat: total * (1 + vat), registered: ds.length,
      delivered: ds.filter((d) => k(d).firstSubmit > 0).length,
      accepted: ds.filter((d) => k(d).status === ST.ACC).length,
      waiting: ds.filter((d) => k(d).status === ST.WAIT).length,
      late: ds.filter((d) => k(d).status === ST.LATE).length,
      actual: it.actual_progress === undefined || it.actual_progress === null || it.actual_progress === "" ? null : numOr(it.actual_progress, null),
      crs: crsByItem.get(it.id) || [],
    };
    r.progress = qty > 0 ? r.accepted / qty : null;
    r.deliveredPct = qty > 0 ? r.delivered / qty : null;
    r.acceptedValue = r.accepted * price;
    r.deliveredValue = r.delivered * price;
    r.waitingValue = r.waiting * price;
    r.remaining = total - r.acceptedValue;
    r.actualWeighted = (r.actual || 0) * total;
    items.set(it.id, r);
    for (const key of Object.keys(tot)) tot[key] += r[key] || 0;
  }
  tot.acceptedShare = tot.total > 0 ? tot.acceptedValue / tot.total : null;
  tot.waitingShare = tot.total > 0 ? tot.waitingValue / tot.total : null;
  tot.progress = tot.qty > 0 ? tot.accepted / tot.qty : null;
  tot.deliveredPct = tot.qty > 0 ? tot.delivered / tot.qty : null;
  tot.actual = tot.total > 0 ? tot.actualWeighted / tot.total : null;

  const statusCounts = Object.fromEntries(STATUS_ORDER.map((st) => [st, 0]));
  for (const d of data.deliverables) statusCounts[del.get(d.id).status]++;

  return { asOf, asOfIso, reviewLimit, vat, ev, del, items, tot, statusCounts, itemsById, delById, span };
}
const currentAsOf = () => isIso(state.settings.as_of_override) ? state.settings.as_of_override : todayIso();
function compute() { state.calc = computeModel(state, currentAsOf()); }

/* ---- status donut */
function donut(counts, total) {
  const R = 100, r0 = 62, cx = 110, cy = 110;
  const live = STATUS_ORDER.filter((s) => counts[s]);
  if (!total) return `<svg class="donut" viewBox="0 0 220 220" role="img" aria-label="لا توجد مخرجات"><circle cx="${cx}" cy="${cy}" r="${(R + r0) / 2}" fill="none" stroke="var(--line)" stroke-width="${R - r0}"/></svg>`;
  let a = -Math.PI / 2;
  const pt = (rad, ang) => `${(cx + rad * Math.cos(ang)).toFixed(2)},${(cy + rad * Math.sin(ang)).toFixed(2)}`;
  const paths = live.map((s) => {
    const n = counts[s], sweep = (n / total) * Math.PI * 2;
    const a2 = a + sweep, large = sweep > Math.PI ? 1 : 0;
    let d;
    if (live.length === 1) d = `M${pt(R, -Math.PI / 2)}A${R},${R} 0 1 1 ${pt(R, Math.PI * 1.5 - 0.0001)}L${pt(r0, Math.PI * 1.5 - 0.0001)}A${r0},${r0} 0 1 0 ${pt(r0, -Math.PI / 2)}Z`;
    else d = `M${pt(R, a)}A${R},${R} 0 ${large} 1 ${pt(R, a2)}L${pt(r0, a2)}A${r0},${r0} 0 ${large} 0 ${pt(r0, a)}Z`;
    a = a2;
    return `<path d="${d}" fill="var(--st-${STATUS_CLASS[s]})" stroke="var(--surface)" stroke-width="2" data-filter-status="${esc(s)}"><title>${esc(s)}: ${n} مخرج (${((n / total) * 100).toFixed(1)}%)</title></path>`;
  }).join("");
  return `<svg class="donut" viewBox="0 0 220 220" role="img" aria-label="توزيع المخرجات حسب الحالة">${paths}
    <text x="${cx}" y="${cy + 4}" text-anchor="middle" class="total">${total}</text><text x="${cx}" y="${cy + 26}" text-anchor="middle" class="total-lbl">مخرجًا</text></svg>`;
}

/* ---- dashboard */
function viewDashboard() {
  const c = state.calc, t = c.tot;
  if (!state.items.length) return `<section class="section">${emptyBlock("لا توجد بنود للعقد بعد", "ابدأ بإضافة بنود العقد من شاشة البنود، ثم أضف المخرجات وسجّل حركات المراجعة.", `<button class="btn primary" data-go="items" type="button">إضافة أول بند</button>`)}</section>`;
  const total = state.deliverables.length;
  const legend = STATUS_ORDER.map((s) =>
    `<button type="button" data-filter-status="${esc(s)}"><span class="sw" style="background:var(--st-${STATUS_CLASS[s]})"></span><span class="lbl">${esc(s)}</span><strong class="num">${c.statusCounts[s] || 0}</strong><span class="share num">${total ? ((c.statusCounts[s] / total) * 100).toFixed(1) + "%" : "-"}</span></button>`).join("");
  const withK = state.deliverables.map((d) => ({ d, k: c.del.get(d.id) }));
  const open = withK.filter((x) => x.k.openCycle && x.k.status !== ST.ACC).sort((a, b) => b.k.openCycle.review - a.k.openCycle.review);
  const returned = withK.filter((x) => x.k.status === ST.RET).sort((a, b) => b.k.waitingSinceReply - a.k.waitingSinceReply);
  const openIssues = state.issues.filter((i) => i.status !== CLOSED).sort((a, b) => (b.blocking ? 1 : 0) - (a.blocking ? 1 : 0) || String(a.date).localeCompare(String(b.date)));
  const openCrs = state.crs.filter((x) => CR_OPEN.has(x.status)).sort((a, b) => String(a.date).localeCompare(String(b.date)));
  const meter = (v, color) => `<div class="meter"><span style="width:${Math.max(0, Math.min(100, (v || 0) * 100))}%;background:var(${color})"></span></div>`;

  const itemRows = [...state.items].sort(byItemOrder).map((it) => {
    const r = c.items.get(it.id);
    const crOpen = r.crs.some((x) => CR_OPEN.has(x.status));
    return `<tr class="clickable" tabindex="0" data-edit-item="${esc(it.id)}">
      <td><span class="code">${esc(itemLabel(it))}</span></td><td><div class="desc">${esc(it.name)}</div>${crOpen ? `<span class="flag soft">طلب تغيير مفتوح</span>` : ""}</td>
      <td class="n">${int(r.qty)}</td><td class="n">${int(r.delivered)}</td><td class="n">${int(r.accepted)}</td>
      <td class="n">${pct(r.deliveredPct)}${bar(r.deliveredPct, "del")}</td>
      <td class="n">${pct(r.progress)}${bar(r.progress)}</td>
      <td class="n">${r.actual === null ? '<span class="muted">—</span>' : pct(r.actual) + bar(r.actual, "act")}</td></tr>`;
  }).join("");

  return `
  <div class="kpis">
    <div class="kpi"><span class="label">قيمة العقد قبل الضريبة</span><span class="value">${sar(t.total)}</span><span class="foot">شاملة الضريبة ${sar(t.totalVat)}</span></div>
    <div class="kpi wait"><span class="label">إجمالي في انتظار القبول</span><span class="value">${pct(t.waitingShare)}<span class="amt">${sar(t.waitingValue)}</span></span>${meter(t.waitingShare, "--st-wait")}<span class="foot"><span class="num">${t.waiting}</span> مخرجًا مسلَّمًا ينتظر قبول العميل</span></div>
    <div class="kpi acc"><span class="label">إجمالي المقبول</span><span class="value">${pct(t.acceptedShare)}<span class="amt">${sar(t.acceptedValue)}</span></span>${meter(t.acceptedShare, "--st-acc")}<span class="foot"><span class="num">${t.accepted}</span> مخرجًا مقبولًا من <span class="num">${t.qty}</span></span></div>
    <div class="kpi"><span class="label">المتبقي (غير المقبول)</span><span class="value">${sar(t.remaining)}</span><span class="foot">قيمة العقد مطروحًا منها المقبول</span></div>
  </div>
  <div class="kpis">
    <div class="kpi"><span class="label">نسبة الإنجاز (المقبول ÷ الإجمالي)</span><span class="value">${pct(t.progress)}</span>${meter(t.progress, "--st-acc")}<span class="foot"><span class="num">${t.accepted}</span> من <span class="num">${t.qty}</span> مخرجًا</span></div>
    <div class="kpi"><span class="label">نسبة الإنجاز المسلَّم (المسلَّم ÷ الإجمالي)</span><span class="value">${pct(t.deliveredPct)}</span>${meter(t.deliveredPct, "--st-wait")}<span class="foot"><span class="num">${t.delivered}</span> من <span class="num">${t.qty}</span> مخرجًا سُلِّم مرة واحدة على الأقل</span></div>
    <div class="kpi"><span class="label">نسبة الإنجاز الفعلي</span><span class="value">${pct(t.actual)}</span>${meter(t.actual, "--actual")}<span class="foot">مُدخلة يدويًا لكل بند، ومرجَّحة بقيمة البنود</span></div>
  </div>
  <div class="grid-2">
    <section class="section">
      <div class="section-head"><h2>حالة المخرجات</h2><span class="sub">اضغط على أي حالة لعرض مخرجاتها</span></div>
      <div class="donut-wrap">${donut(c.statusCounts, total)}<div class="legend">${legend}</div></div>
    </section>
    <section class="section">
      <div class="section-head"><h2>المشكلات والقرارات المفتوحة</h2><span class="sub">تظهر أولًا المشكلات التي ${BLOCKING}</span></div>
      ${openIssues.length ? `<div class="cards">${openIssues.slice(0, 5).map((i) => issueCard(i, { clickable: true, showDel: true })).join("")}</div>
        ${openIssues.length > 5 ? `<button class="btn small" type="button" data-go="issues">عرض الكل (<span class="num">${openIssues.length}</span>)</button>` : ""}`
        : emptyBlock("لا توجد مشكلات مفتوحة", "سجّل أي مشكلة أو قرار من صفحة المخرج.")}
    </section>
  </div>
  <section class="section">
    <div class="section-head"><h2>في انتظار رد العميل</h2><span class="sub">دورات مراجعة مفتوحة · المهلة <span class="num">${c.reviewLimit}</span> أيام عمل · <span class="num">${open.length}</span> مخرجًا</span></div>
    ${open.length ? `<div class="table-wrap"><table><thead><tr><th>المخرج</th><th>الوصف</th><th>البند</th><th>تاريخ التسليم</th><th class="n">رقم الدورة</th><th class="n">أيام المراجعة</th><th class="n">أيام التأخير</th><th class="n">القيمة ${SAR}</th></tr></thead><tbody>
      ${open.slice(0, 15).map((x) => delRow(x.d, `<td><span class="code">${esc(itemLabel(c.itemsById.get(x.d.item_id)))}</span></td><td>${dateHtml(isoOf(x.k.openCycle.start))}</td><td class="n">${int(x.k.cycles)}</td><td class="n">${int(x.k.openCycle.review)}</td><td class="n ${x.k.openCycle.delay > 0 ? "red" : ""}">${int(x.k.openCycle.delay)}</td><td class="n">${money(x.k.value)}</td>`)).join("")}
      </tbody></table></div>${open.length > 15 ? `<button class="btn small" type="button" data-filter-status="${ST.WAIT}">عرض الكل (<span class="num">${open.length}</span>)</button>` : ""}`
      : emptyBlock("لا توجد مخرجات تنتظر الرد", "تم الرد على جميع التسليمات.")}
  </section>
  <section class="section">
    <div class="section-head"><h2>إنجاز البنود</h2><span class="sub">اضغط على البند لتعديل نسبة الإنجاز الفعلي</span></div>
    <div class="table-wrap"><table>
      <thead><tr><th>رقم البند</th><th>البند</th><th class="n">الكمية</th><th class="n">المسلَّم</th><th class="n">المقبول</th><th class="n">نسبة الإنجاز المسلَّم</th><th class="n">نسبة الإنجاز (المقبول)</th><th class="n">نسبة الإنجاز الفعلي</th></tr></thead>
      <tbody>${itemRows}</tbody>
      <tfoot><tr><td colspan="2">الإجمالي</td><td class="n">${int(t.qty)}</td><td class="n">${int(t.delivered)}</td><td class="n">${int(t.accepted)}</td><td class="n">${pct(t.deliveredPct)}</td><td class="n">${pct(t.progress)}</td><td class="n" title="مرجَّحة بقيمة البنود">${pct(t.actual)}</td></tr></tfoot>
    </table></div>
  </section>
  <div class="grid-2">
    <section class="section">
      <div class="section-head"><h2>مُعادة بملاحظات</h2><span class="sub">تنتظر إعادة التسليم من فريق المشروع</span></div>
      ${returned.length ? `<div class="table-wrap"><table><thead><tr><th>المخرج</th><th>الوصف</th><th>تاريخ الرد</th><th class="n">أيام العمل منذ الرد</th></tr></thead><tbody>
        ${returned.map((x) => delRow(x.d, `<td>${dateHtml(isoOf(x.k.lastReply))}</td><td class="n">${int(x.k.waitingSinceReply)}</td>`)).join("")}</tbody></table></div>`
        : emptyBlock("لا توجد مخرجات مُعادة", "لا توجد ملاحظات تنتظر إعادة التسليم.")}
    </section>
    <section class="section">
      <div class="section-head"><h2>طلبات التغيير المفتوحة</h2><span class="sub">قيد الإعداد أو مُرسلة أو قيد الدراسة</span></div>
      ${openCrs.length ? `<div class="cards">${openCrs.map(crCard).join("")}</div>` : emptyBlock("لا توجد طلبات تغيير مفتوحة", "", `<button class="btn small" type="button" data-go="crs">طلبات التغيير</button>`)}
    </section>
  </div>`;
}

/* ---- items */

  const rows = [...state.items].sort(byItemOrder).map((it) => {
    const r = c.items.get(it.id);
    const mismatch = r.registered !== r.qty;
    const crOpen = r.crs.filter((x) => CR_OPEN.has(x.status)).length;
    return `<tr class="clickable" tabindex="0" data-edit-item="${esc(it.id)}">
      <td><span class="code">${esc(itemLabel(it))}</span></td><td><span class="code muted">${esc(it.wbs)}</span></td><td><div class="desc">${esc(it.name)}</div></td>
      <td class="n">${int(r.qty)}</td><td class="n">${money(r.price)}</td><td class="n">${money(r.total)}</td><td class="n">${money(r.totalVat)}</td>
      <td class="n ${mismatch ? "red" : ""}" title="${mismatch ? "عدد المخرجات المسجلة يختلف عن الكمية التعاقدية" : ""}">${int(r.registered)}</td>
      <td class="n">${int(r.delivered)}</td><td class="n">${int(r.accepted)}</td>
      <td class="n">${pct(r.deliveredPct)}</td><td class="n">${pct(r.progress)}</td><td class="n">${r.actual === null ? '<span class="muted">—</span>' : pct(r.actual)}</td>
      <td class="n">${money(r.acceptedValue)}</td><td class="n">${money(r.remaining)}</td>
      <td class="c">${r.crs.length ? `<span class="${crOpen ? "flag soft" : "muted"}">${r.crs.map((x) => esc(x.code)).join("، ")}</span>` : ""}</td></tr>`;
  }).join("");
  return `<section class="section">
    <div class="section-head"><h2>بنود العقد</h2><div class="actions"><span class="count">المبالغ بالريال ${SAR} · اضغط على أي بند لتعديله</span><button class="btn primary" data-new-item type="button">+ بند جديد</button></div></div>
    ${state.items.length ? `<div class="table-wrap"><table>
      <thead><tr><th>رقم البند</th><th>WBS</th><th>اسم البند</th><th class="n">الكمية</th><th class="n">سعر الوحدة</th><th class="n">الإجمالي قبل الضريبة</th><th class="n">الإجمالي شاملًا الضريبة</th><th class="n">المسجلة</th><th class="n">المسلَّمة</th><th class="n">المقبولة</th><th class="n">نسبة المسلَّم</th><th class="n">نسبة الإنجاز</th><th class="n">الإنجاز الفعلي</th><th class="n">قيمة المقبول</th><th class="n">المتبقي</th><th class="c">طلبات التغيير</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><td colspan="3">الإجمالي</td><td class="n">${int(t.qty)}</td><td></td><td class="n">${money(t.total)}</td><td class="n">${money(t.totalVat)}</td><td class="n">${int(t.registered)}</td><td class="n">${int(t.delivered)}</td><td class="n">${int(t.accepted)}</td><td class="n">${pct(t.deliveredPct)}</td><td class="n">${pct(t.progress)}</td><td class="n" title="مرجَّحة بقيمة البنود">${pct(t.actual)}</td><td class="n">${money(t.acceptedValue)}</td><td class="n">${money(t.remaining)}</td><td></td></tr></tfoot>
    </table></div>` : emptyBlock("لا توجد بنود بعد", "أضف بنود العقد كما وردت في جدول الكميات: رقم البند، والاسم، والكمية، وسعر الوحدة.")}
  </section>`;
}

/* ---- deliverables */
function filteredDeliverables() {
  const c = state.calc, f = state.filters, q = f.q.trim();
  return [...state.deliverables].filter((d) => {
    const k = c.del.get(d.id);
    if (f.item && d.item_id !== f.item) return false;
    if (f.status && k.status !== f.status) return false;
    if (f.issue === "open" && !k.openIssues) return false;
    if (f.issue === "blocking" && !k.blocking) return false;
    if (f.issue === "cr" && !k.crs.length) return false;
    if (q && !(`${d.id} ${d.description || ""} ${d.notes || ""} ${Object.values(billingOf(d)).join(" ")}`.includes(q))) return false;
    return true;
  }).sort(byId);
}
function viewDeliverables() {
  const c = state.calc, f = state.filters, billingView = state.delView === "billing";
  const list = filteredDeliverables();
  const itemOpts = [...state.items].sort(byItemOrder).map((it) => `<option value="${esc(it.id)}"${f.item === it.id ? " selected" : ""}>${esc(itemLabel(it))} — ${esc(short(it.name, 40))}</option>`).join("");
  const statusOpts = STATUS_ORDER.map((s) => `<option${f.status === s ? " selected" : ""}>${esc(s)}</option>`).join("");
  const issueOpts = [["", "جميع المخرجات"], ["open", "عليها مشكلة أو قرار مفتوح"], ["blocking", BLOCKING], ["cr", "مرتبطة بطلب تغيير"]]
    .map(([v, l]) => `<option value="${v}"${f.issue === v ? " selected" : ""}>${l}</option>`).join("");
  const flags = (k) => [k.blocking ? `<span class="flag" title="مشكلة ${BLOCKING}">⚠ ${k.blocking}</span>` : k.openIssues ? `<span class="flag soft" title="مشكلات أو قرارات مفتوحة">${k.openIssues}</span>` : "",
    k.crs.length ? `<span class="flag soft" title="طلب تغيير">${k.crs.map((x) => esc(x.code)).join("، ")}</span>` : ""].join(" ");
  const head = billingView
    ? `<th>رقم المخرج</th><th>البند</th><th>الوصف</th><th>الحالة</th>${BILLING.map((b) => `<th>${b.label}</th>`).join("")}`
    : `<th>رقم المخرج</th><th>البند</th><th>الوصف</th><th>الحالة</th><th>تنبيهات</th><th>أول تسليم</th><th>تاريخ القبول</th><th class="n">مرات التسليم</th><th class="n">أيام المراجعة</th><th class="n">أيام التأخير</th><th class="n">القيمة قبل الضريبة ${SAR}</th>`;
  const rows = list.map((d) => {
    const k = c.del.get(d.id), it = c.itemsById.get(d.item_id), b = billingOf(d);
    const common = `<td><span class="code">${esc(d.id)}</span></td><td><span class="code">${esc(itemLabel(it))}</span></td><td><div class="desc">${esc(d.description)}</div></td><td>${pill(k.status)}</td>`;
    const rest = billingView
      ? BILLING.map((x) => `<td>${x.yn ? ynHtml(b[x.k]) : b[x.k] ? `<span class="code">${esc(b[x.k])}</span>` : '<span class="muted">—</span>'}</td>`).join("")
      : `<td>${flags(k)}</td><td>${dateHtml(k.firstSubmit ? isoOf(k.firstSubmit) : "")}</td><td>${dateHtml(k.accepted ? isoOf(k.accepted) : "")}</td>
        <td class="n">${int(k.cycles)}</td><td class="n">${int(k.review)}</td><td class="n ${k.delay ? "red" : ""}">${int(k.delay)}</td><td class="n">${money(k.value)}</td>`;
    return `<tr class="clickable" tabindex="0" data-open-del="${esc(d.id)}" ${billingView ? 'data-sub="billing"' : ""}>${common}${rest}</tr>`;
  }).join("");
  return `<section class="section">
    <div class="section-head"><h2>المخرجات</h2><div class="actions">
      <div class="seg" role="group" aria-label="طريقة العرض"><button type="button" data-delview="review" aria-pressed="${!billingView}">المتابعة</button><button type="button" data-delview="billing" aria-pressed="${billingView}">الفوترة</button></div>
      <button class="btn primary" data-new-del type="button">+ مخرج جديد</button></div></div>
    <div class="filters">
      <input id="fQ" type="search" placeholder="ابحث برقم المخرج أو الوصف أو رقم الفاتورة أو المطالبة" value="${esc(f.q)}" aria-label="بحث">
      <select id="fItem" aria-label="البند"><option value="">جميع البنود</option>${itemOpts}</select>
      <select id="fStatus" aria-label="الحالة"><option value="">جميع الحالات</option>${statusOpts}</select>
      <select id="fIssue" aria-label="التنبيهات">${issueOpts}</select>
      <span class="count"><span class="num">${list.length}</span> من <span class="num">${state.deliverables.length}</span></span>
    </div>
    ${list.length ? `<div class="table-wrap"><table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>`
      : state.deliverables.length ? emptyBlock("لا توجد مخرجات مطابقة", "غيّر البحث أو عوامل التصفية.") : emptyBlock("لا توجد مخرجات بعد", state.items.length ? "أضف المخرجات تحت كل بند، ولكل مخرج رقم ثابت مثل D-001." : "أضف بنود العقد أولًا من شاشة البنود.")}
  </section>`;
}

/* ---- log */
function viewLog() {
  const c = state.calc, f = state.logFilters, q = f.q.trim();
  const list = [...state.events].filter((e) => (!f.action || e.action === f.action) && (!q || `${e.deliverable} ${e.notes || ""}`.includes(q)))
    .sort((a, b) => (dn(b.date) || 0) - (dn(a.date) || 0) || String(b.deliverable).localeCompare(String(a.deliverable), "en", { numeric: true }));
  const actOpts = ACTIONS.map((a) => `<option${f.action === a ? " selected" : ""}>${esc(a)}</option>`).join("");
  const rows = list.map((e) => {
    const k = c.ev.get(e.id), d = c.delById.get(e.deliverable), sub = k.cycle !== null;
    return `<tr class="clickable" tabindex="0" data-open-del="${esc(e.deliverable)}">
      <td><span class="code">${esc(e.deliverable)}</span></td><td><div class="desc">${esc(d?.description)}</div></td><td>${esc(e.action)}</td><td>${dateHtml(e.date)}</td>
      <td class="n">${sub ? int(k.cycle) : ""}</td><td>${sub ? dateHtml(isoOf(k.end)) : ""}</td><td>${sub ? (k.open ? '<span class="pill s-prog">جارية</span>' : '<span class="muted">مغلقة</span>') : ""}</td>
      <td class="n">${sub ? int(k.review) : ""}</td><td class="n ${sub && k.delay ? "red" : ""}">${sub ? int(k.delay) : ""}</td>
      <td class="n">${k.vendorDays !== null ? int(k.vendorDays) : ""}</td>
      <td class="warn-cell">${esc(k.warn)}</td><td><div class="desc">${esc(e.notes)}</div></td></tr>`;
  }).join("");
  return `<section class="section">
    <div class="section-head"><h2>سجل المراجعات</h2><button class="btn primary" data-new-ev type="button">+ حركة جديدة</button></div>
    <p class="muted" style="margin:0">يفتح كل تسليم دورة مراجعة لدى العميل، وتُغلق الدورة عند أول رد أو قبول (أو عند تسليم جديد). تُحسب الأيام أيامَ عمل بدءًا من اليوم التالي للتسليم، مع استبعاد الإجازة الأسبوعية والإجازات الرسمية. التأخير هو ما يزيد على المهلة في كل دورة على حدة. أما «أيام لدى فريق المشروع» فهي المدة من الرد بملاحظات حتى إعادة التسليم، ولا تُحتسب على العميل.</p>
    <div class="filters">
      <input id="lQ" type="search" placeholder="ابحث برقم المخرج أو الملاحظات" value="${esc(f.q)}" aria-label="بحث">
      <select id="lAction" aria-label="نوع الحركة"><option value="">جميع الحركات</option>${actOpts}</select>
      <span class="count"><span class="num">${list.length}</span> حركة</span>
    </div>
    ${list.length ? `<div class="table-wrap"><table>
      <thead><tr><th>المخرج</th><th>الوصف</th><th>الحركة</th><th>التاريخ</th><th class="n">الدورة</th><th>نهاية الدورة</th><th>حالة الدورة</th><th class="n">أيام المراجعة</th><th class="n">أيام التأخير</th><th class="n">أيام لدى فريق المشروع</th><th>تنبيه</th><th>ملاحظات</th></tr></thead>
      <tbody>${rows}</tbody></table></div>` : emptyBlock(state.events.length ? "لا توجد حركات مطابقة" : "لا توجد حركات بعد", "سجّل كل تسليم أو رد بملاحظات أو قبول حركةً مستقلة بتاريخها.")}
  </section>`;
}

/* ---- issues */
function viewIssues() {
  const f = state.issueFilters, q = f.q.trim();
  const stateOk = (i) => f.state === "" ? true : f.state === OPEN ? i.status !== CLOSED : f.state === CLOSED ? i.status === CLOSED : (i.blocking && i.status !== CLOSED);

/* ---- periodic report */
function reportRange() {
  const r = state.report, today = dn(todayIso()), wd = (today + 4) % 7; // 0 = Sunday
  const weekStart = today - wd;
  const t = new Date(); const y = t.getFullYear(), m = t.getMonth();
  const monthStart = dn(`${y}-${String(m + 1).padStart(2, "0")}-01`);
  const prevMonthStart = dn(m === 0 ? `${y - 1}-12-01` : `${y}-${String(m).padStart(2, "0")}-01`);
  const ranges = {
    this_week: [weekStart, today], last_week: [weekStart - 7, weekStart - 1],
    this_month: [monthStart, today], last_month: [prevMonthStart, monthStart - 1],
  };
  if (r.preset !== "custom") { const [a, b] = ranges[r.preset] || ranges.last_week; return [isoOf(a), isoOf(b)]; }
  return [isIso(r.from) ? r.from : isoOf(weekStart - 7), isIso(r.to) ? r.to : isoOf(today)];
}
function buildReport() {
  const [from, to] = reportRange();
  const a = dn(from), b = dn(to);
  const inRange = (iso) => { const t = dn(iso); return t >= a && t <= b; };
  const end = computeModel({ ...state, events: state.events.filter((e) => dn(e.date) <= b) }, to);
  const evIn = state.events.filter((e) => inRange(e.date) && end.delById.has(e.deliverable));
  const pickEv = (act) => evIn.filter((e) => e.action === act).sort((p, q) => String(p.date).localeCompare(String(q.date)))
    .map((e) => ({ e, d: end.delById.get(e.deliverable), k: end.del.get(e.deliverable), x: end.ev.get(e.id) }));
  const accepted = pickEv(ACT.ACC), submitted = pickEv(ACT.SUB), returned = pickEv(ACT.REP);
  const acceptedValue = accepted.reduce((s, x) => s + (x.k?.value || 0), 0);
  const openCycles = state.deliverables.map((d) => ({ d, k: end.del.get(d.id) })).filter((x) => x.k.openCycle && x.k.status !== ST.ACC).sort((p, q) => q.k.openCycle.review - p.k.openCycle.review);
  const overLimit = openCycles.filter((x) => x.k.openCycle.delay > 0);
  const issuesOpened = state.issues.filter((i) => inRange(i.date));
  const issuesClosed = state.issues.filter((i) => i.status === CLOSED && inRange(i.closed_date));
  const blockingOpen = state.issues.filter((i) => i.blocking && dn(i.date) <= b && (i.status !== CLOSED || dn(i.closed_date) > b));
  const crsTouched = state.crs.filter((x) => inRange(x.date) || inRange(x.decision_date));
  const crsOpen = state.crs.filter((x) => CR_OPEN.has(x.status));
  return { from, to, end, accepted, submitted, returned, acceptedValue, openCycles, overLimit, issuesOpened, issuesClosed, blockingOpen, crsTouched, crsOpen };
}

function requireDb() { if (!state.db) { toast("التخزين غير متاح؛ افتح الصفحة من claude.ai بعد تسجيل الدخول.", true); return false; } return true; }
async function run(btn, fn, okMsg) {
  if (!requireDb()) return false;
  if (btn) btn.disabled = true;
  try { await fn(); if (okMsg) toast(okMsg); return true; }
  catch (e) { toast(errText(e), true); return false; }
  finally { if (btn) btn.disabled = false; }
}
const formData = (form) => Object.fromEntries(new FormData(form).entries());
const clean = (o) => { const r = {}; for (const [k, v] of Object.entries(o)) if (v !== "" && v !== null && v !== undefined && !(typeof v === "number" && Number.isNaN(v))) r[k] = v; return r; };
const newId = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);

async function saveItem(form, btn) {
  const f = formData(form), id = state.drawer.id || newId("i");
  const no = /^\d+$/.test(f.no.trim()) ? Number(f.no.trim()) : f.no.trim();
  if (state.items.some((x) => x.id !== id && String(x.no) === String(no))) { toast("رقم البند مستخدم من قبل.", true); return; }
  const actual = f.actual_progress === "" ? "" : Math.max(0, Math.min(100, Number(f.actual_progress))) / 100;
  const body = clean({ no, wbs: f.wbs.trim(), name: f.name.trim(), qty: numOr(f.qty, 0), unit_price: numOr(f.unit_price, 0), actual_progress: actual, order: numOr(f.order, state.items.length + 1) });
  if (await run(btn, () => state.db.collection("items").doc(id).set(body), "تم حفظ البند")) closeDrawer();
}
async function saveDeliverable(form, btn) {
  const f = formData(form), editing = state.drawer.id;
  const id = editing || f.did.trim();
  if (!/^[A-Za-z0-9_.~:@+-]+$/.test(id)) { toast("يجب أن يتكون رقم المخرج من حروف إنجليزية وأرقام وشرطة فقط.", true); return; }
  if (!editing && state.deliverables.some((x) => x.id === id)) { toast(`الرقم ${id} مستخدم من قبل.`, true); return; }
  const prevB = editing ? billingOf(state.deliverables.find((x) => x.id === id) || {}) : {};
  const billing = {};
  for (const x of BILLING) {
    const v = (f["b_" + x.k] ?? "").trim();
    if (v) billing[x.k] = typeof prevB[x.k] === "number" && String(prevB[x.k]) === v ? prevB[x.k] : v;
  }
  const body = clean({ item_id: f.item_id, description: f.description.trim(), work_status: f.work_status, points: f.points === "" ? "" : Number(f.points), notes: f.notes.trim() });
  if (Object.keys(billing).length) body.billing = billing;

const numD = (n) => n ? toDate(isoOf(n)) : null;
const FMT = { M: "#,##0.00", D: "yyyy-mm-dd", P: "0.0%" };
function addSheet(wb, name, cols, rows, opts = {}) {
  const ws = wb.addWorksheet(name, { views: [{ rightToLeft: true, state: "frozen", ySplit: 1 }] });
  ws.columns = cols.map((col) => ({ header: col.h, key: col.k, width: col.w || 14, style: { numFmt: col.f, font: { name: "Arial", size: 10 }, alignment: { vertical: "top", wrapText: !!col.wrap } } }));
  rows.forEach((r) => ws.addRow(r));
  const head = ws.getRow(1);
  head.font = { name: "Arial", bold: true, color: { argb: "FFFFFFFF" } };
  head.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FF1F5C6B" } };
  head.alignment = { vertical: "middle", horizontal: "center", wrapText: true };
  head.height = 32;
  if (cols.length) ws.autoFilter = { from: { row: 1, column: 1 }, to: { row: 1, column: cols.length } };
  if (opts.total) { const tr = ws.addRow(opts.total); tr.font = { name: "Arial", bold: true }; tr.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFD9E7EA" } }; }
  return ws;
}
function kvSheet(wb, name, rows) {

async function withExcel(btn, fn) {
  if (!window.ExcelJS) { toast("تعذّر تحميل مكتبة Excel؛ يُرجى تحديث الصفحة.", true); return; }
  if (!state.downloads) { toast("التنزيل غير متاح في هذا العرض.", true); return; }
  btn.disabled = true;
  try {
    const [wb, filename] = await fn();
    const buf = await wb.xlsx.writeBuffer();
    await state.downloads.save({ filename, data: new Blob([buf]) });
    toast("تم حفظ ملف Excel");
  } catch (e) {
    if (e?.code === "declined") toast("أُلغي التنزيل.");
    else toast(e?.code ? errText(e) : "تعذّر إنشاء ملف Excel: " + (e?.message || e), true);

}

document.addEventListener("click", async (ev) => {
  if (ev.target.closest("input, select, textarea, label") && !ev.target.closest("button")) return;
  const t = ev.target.closest("button, tr, .card, path[data-filter-status], [data-close]");
  if (!t) return;
  const ds = t.dataset;
  if (ds.tab) return setTab(ds.tab);
  if ("close" in ds) return closeDrawer();
  if (ds.go) return setTab(ds.go);
  if (ds.filterStatus) { state.filters = { q: "", item: "", status: ds.filterStatus, issue: "" }; return setTab("deliverables"); }
  if (ds.delview) { state.delView = ds.delview; return render(); }
  if ("newItem" in ds) return openDrawer({ kind: "item" });
  if (ds.editItem) return openDrawer({ kind: "item", id: ds.editItem });
  if ("newDel" in ds) return openDrawer({ kind: "delForm" });
  if (ds.editDel) return openDrawer({ kind: "delForm", id: ds.editDel, sub: state.drawer?.sub });
  if (ds.openDel) return openDrawer({ kind: "del", id: ds.openDel, sub: ds.sub || "review" });
  if (ds.subTab) { state.drawer.sub = ds.subTab; state.drawer.editIssue = null; return renderDrawer(); }
  if ("newEv" in ds) return openDrawer({ kind: "ev" });
  if ("newIssue" in ds) return openDrawer({ kind: "issue" });
  if (ds.editIssue) {
    if (state.drawer?.kind === "del") { state.drawer.editIssue = ds.editIssue; renderDrawer(); document.querySelector(".drawer-body").scrollTop = 0; return; }
    return openDrawer({ kind: "issue", id: ds.editIssue });
  }
  if ("cancelIssue" in ds) { if (state.drawer?.kind === "del") { state.drawer.editIssue = null; return renderDrawer(); } return closeDrawer(); }
  if (ds.closeIssue) return setIssueStatus(ds.closeIssue, true, t);
  if (ds.reopenIssue) return setIssueStatus(ds.reopenIssue, false, t);
  if (ds.askDelIssue) { state.drawer.confirmIssue = ds.askDelIssue; return renderDrawer(); }
  if ("newCr" in ds) return openDrawer({ kind: "cr" });
  if (ds.editCr) return openDrawer({ kind: "cr", id: ds.editCr });
  if ("askDelete" in ds) { state.drawer.confirm = true; return renderDrawer(); }
  if (ds.delEv) { state.drawer.confirmEv = ds.delEv; return renderDrawer(); }
  if ("cancelConfirm" in ds) { Object.assign(state.drawer, { confirm: false, confirmEv: null, confirmIssue: null }); return renderDrawer(); }
  if (ds.confirm) {
    const d = state.drawer;
    if (ds.confirm === "item") { if (await run(t, () => state.db.collection("items").doc(d.id).delete(), "تم حذف البند")) closeDrawer(); }
    else if (ds.confirm === "cr") { if (await run(t, () => state.db.collection("crs").doc(d.id).delete(), "تم حذف طلب التغيير")) closeDrawer(); }
    else if (ds.confirm === "del") {
      const evs = state.events.filter((e) => e.deliverable === d.id), iss = state.issues.filter((i) => i.deliverable === d.id);
      if (await run(t, async () => {
        for (const e of evs) await state.db.collection("events").doc(e.id).delete();
        for (const i of iss) await state.db.collection("issues").doc(i.id).delete();
        await state.db.collection("deliverables").doc(d.id).delete();
      }, "تم حذف المخرج")) closeDrawer();
    } else if (ds.confirm.startsWith("ev:")) {
      if (await run(t, () => state.db.collection("events").doc(ds.confirm.slice(3)).delete(), "تم حذف الحركة")) { d.confirmEv = null; renderDrawer(); }
    } else if (ds.confirm.startsWith("issue:")) {
      if (await run(t, () => state.db.collection("issues").doc(ds.confirm.slice(6)).delete(), "تم الحذف")) { if (d.kind === "issue") closeDrawer(); else { d.confirmIssue = null; d.editIssue = null; renderDrawer(); } }
    }
    return;
  }
  if (ds.delHol !== undefined) {
    const i = Number(ds.delHol); const list = (state.settings.holidays || []).filter((_, j) => j !== i);
    return saveHolidays(list, t, "تم حذف الإجازة");
  }
  if (t.id === "exportBtn") return exportAll(t);
  if (t.id === "reportExport") return exportReport(t);
  if (t.id === "reportCopy") {
    const text = reportText(buildReport());
    try { await navigator.clipboard.writeText(text); toast("نُسخ التقرير؛ يمكنك لصقه في البريد أو الرسالة"); }
    catch (_) {
      const box = document.getElementById("copyFallback");
      box.innerHTML = `<textarea class="copybox" readonly aria-label="نص التقرير">${esc(text)}</textarea>`;
      const ta = box.querySelector("textarea"); ta.focus(); ta.select();
      toast("تعذّر النسخ التلقائي؛ النص محدد، اضغط Ctrl+C");
    }
  }
});

document.addEventListener("submit", (ev) => {
  ev.preventDefault();
  const form = ev.target, btn = form.querySelector('button[type="submit"]');
  const fid = form.getAttribute("id"); // not form.id: a field named "id" would shadow it
  if (fid === "itemForm") return saveItem(form, btn);
  if (fid === "delForm") return saveDeliverable(form, btn);
  if (fid === "evForm") return addEvent(form, btn);
  if (fid === "quickEv") return addEvent(form, btn, state.drawer.id);
  if (fid === "issueForm") return saveIssue(form, btn);
  if (fid === "crForm") return saveCr(form, btn);
  if (fid === "settingsForm") return saveSettings(form, btn);
  if (fid === "holForm") {
    const date = form.querySelector("#hDate").value, name = form.querySelector("#hName").value.trim(), note = form.querySelector("#hNote").value.trim();
    if (!isIso(date) || !name) return toast("أدخل التاريخ والمناسبة.", true);
    if ((state.settings.holidays || []).some((h) => h.date === date)) return toast("هذا التاريخ مسجل من قبل.", true);
    return saveHolidays([...(state.settings.holidays || []), clean({ date, name, note })], btn, "تمت إضافة الإجازة");
  }
});

let inputTimer;
const SEARCH = { fQ: (v) => (state.filters.q = v), lQ: (v) => (state.logFilters.q = v), iQ: (v) => (state.issueFilters.q = v) };
document.addEventListener("input", (ev) => {
  const id = ev.target.id;
  if (!SEARCH[id]) return;
  clearTimeout(inputTimer);
  inputTimer = setTimeout(() => {
    SEARCH[id](ev.target.value);
    const pos = ev.target.selectionStart;
    render();
    const el = document.getElementById(id); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (_) {} }
  }, 200);
});
document.addEventListener("change", (ev) => {
  const el = ev.target, id = el.id;
  const set = { fItem: () => (state.filters.item = el.value), fStatus: () => (state.filters.status = el.value), fIssue: () => (state.filters.issue = el.value),
    lAction: () => (state.logFilters.action = el.value), iState: () => (state.issueFilters.state = el.value), iType: () => (state.issueFilters.type = el.value),
    rPreset: () => { const [a, b] = reportRange(); state.report.preset = el.value; if (el.value === "custom") { state.report.from = a; state.report.to = b; } },
    rFrom: () => { const [, b] = reportRange(); state.report = { preset: "custom", from: el.value, to: b }; },
    rTo: () => { const [a] = reportRange(); state.report = { preset: "custom", from: a, to: el.value }; } };
  if (set[id]) { set[id](); return render(); }
  if (el.name === "critem") {
    const form = el.form, items = [...form.querySelectorAll('input[name="critem"]:checked')].map((x) => x.value);
    const sel = [...form.querySelectorAll('input[name="crdel"]:checked')].map((x) => x.value);
    document.getElementById("crDels").innerHTML = crDelChecks(items, sel);
  }
});
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape" && state.drawer) closeDrawer();
  if (ev.key === "Enter" && ev.target.matches("tr.clickable")) ev.target.click();
});
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (TAB_KEYS.includes(h) && h !== state.tab) setTab(h); });

/* ------------------------------------------------------------ boot */
(function initTab() {
  let tab = location.hash.slice(1);
  if (!TAB_KEYS.includes(tab)) { try { tab = localStorage.getItem("tab") || ""; } catch (_) { tab = ""; } }
  state.tab = TAB_KEYS.includes(tab) ? tab : "dashboard";
})();
render();

let scheduled = false;
function scheduleRender() {
  if (scheduled) return; scheduled = true;
  requestAnimationFrame(() => {
    scheduled = false;
    // a snapshot arriving while the user types in the drawer must not wipe the form
    const active = document.activeElement;
    if (state.drawer && active && active.closest(".drawer") && active.matches("input, textarea, select")) { compute(); return; }
    render();
  });
}

async function boot() {
  const api = window.claude;
  if (!api || typeof api.use !== "function") { state.offline = true; render(); return; }
  const [db, downloads] = await Promise.all([api.use("db").catch(() => null), api.use("downloads").catch(() => null)]);
  state.downloads = downloads;
  if (!downloads) document.getElementById("exportBtn").hidden = true;
  if (!db) { state.offline = true; render(); return; }
  state.db = db;
  const onErr = (e) => { if (e?.code !== "unavailable") toast(errText(e), true); };
  db.doc("contract/settings").onSnapshot((snap) => {
    state.settings = { ...DEFAULT_SETTINGS, ...(snap.exists ? snap.data() : {}) };
    state.ready.settings = true; scheduleRender();
  }, onErr);
  for (const name of COLLECTIONS) db.collection(name).onSnapshot((snap) => {
    state[name] = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    state.ready[name] = true; scheduleRender();
  }, onErr);
}
boot();
})();
</script>
